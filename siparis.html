<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sipariş</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F6F2E9;
    --surface:#FFFFFF;
    --ink:#232C2A;
    --muted:#71776F;
    --line:#E3DCC9;
    --accent:#A85C2B;
    --accent-ink:#5A3016;
    --good:#3D7A54;
    --good-bg:#E4F1E6;
    --warn:#B98A1E;
    --warn-bg:#FBF0D6;
    --danger:#B5402F;
    --danger-bg:#FBE7E1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  .banner{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;}
  .banner h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;margin:0;letter-spacing:-0.01em;}
  .banner .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .nav-link{font-size:12px;color:var(--accent-ink);text-decoration:none;font-weight:600;}
  .nav-link-active{color:var(--ink);text-decoration:underline;}
  .nav-link:hover{text-decoration:underline;}
  .top-nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
  .top-nav-item{display:inline-flex;align-items:center;gap:4px;padding:8px 15px;border-radius:7px;font-size:13.5px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);transition:border-color .15s,background .15s;}
  .top-nav-item:hover{border-color:var(--accent-ink);}
  .top-nav-item.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .top-nav-item.external{color:var(--accent-ink);}
  .brand-row{display:flex;align-items:center;gap:14px;}
  .brand-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .logo-click{position:relative;display:inline-block;cursor:pointer;}
  .brand-logo{height:48px;max-width:150px;object-fit:contain;display:block;}
  .brand-logo-placeholder{width:76px;height:48px;border:1.5px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10.5px;text-align:center;}
  .logo-edit-badge{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;border:2px solid var(--bg);pointer-events:none;}

  .btn{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:3px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .btn:hover{background:var(--ink);color:#fff;}
  .btn:active{transform:scale(0.96);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  .btn.ghost{border-color:var(--line);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger-outline{border-color:var(--danger);color:var(--danger);}
  .btn.danger-outline:hover{background:var(--danger);color:#fff;}
  .btn:disabled{opacity:.4;pointer-events:none;}

  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .toolbar select, .toolbar input[type=text]{border:1.5px solid var(--line);background:var(--surface);padding:8px 10px;border-radius:3px;font-family:inherit;font-size:13px;color:var(--ink);}
  .toolbar input[type=text]{min-width:220px;}
  .toolbar .count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}

  .empty{padding:50px 20px;text-align:center;color:var(--muted);}
  .empty h3{font-family:'Fraunces',serif;color:var(--ink);margin-bottom:6px;}

  .overlay{position:fixed;inset:0;background:rgba(35,44,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--surface);border-radius:6px;max-width:560px;width:100%;padding:26px 28px 28px;border:1px solid var(--line);}
  .modal h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input, .field select, .field textarea{width:100%;border:1.5px solid var(--line);border-radius:3px;padding:9px 10px;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .field-msg{font-size:11px;margin-top:4px;color:var(--muted);}
  .field-msg.error{color:var(--danger);}
  .auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:32px 30px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(35,44,42,.06);}
  .user-badge{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .user-badge .role-chip{background:#EEEBE2;padding:1px 7px;border-radius:8px;font-weight:700;font-size:10px;text-transform:uppercase;}

  .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;max-width:80vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}
  .loading{padding:60px;text-align:center;color:var(--muted);}

  /* Product grid */
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
  .product-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
  .product-card:hover{box-shadow:0 3px 14px rgba(35,44,42,.10);}
  .product-card .pc-img{width:100%;height:150px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line);display:block;}
  .product-card .pc-img-placeholder{width:100%;height:150px;background:#F1ECDD;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);}
  .pc-body{padding:11px 13px;}
  .pc-ref{font-family:'Fraunces',serif;font-size:17px;}
  .pc-name{color:var(--muted);font-size:12px;margin-top:1px;}
  .pc-colors{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
  .pc-color-chip{font-size:10px;background:#F1ECDD;color:var(--ink);padding:2px 7px;border-radius:9px;font-weight:600;white-space:nowrap;}
  .pc-color-chip.low{background:var(--danger-bg);color:var(--danger);}
  .pc-price{font-family:'Fraunces',serif;font-size:16px;margin-top:8px;color:var(--accent-ink);}
  .pc-price-edit{margin-top:9px;}
  .pc-price-edit label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px;font-weight:700;}
  .pc-price-edit input{width:100%;border:1.5px solid var(--line);border-radius:3px;padding:7px 9px;font-family:'Fraunces',serif;font-size:15px;color:var(--accent-ink);background:var(--bg);}
  .pc-color-chip.active{background:var(--accent);color:#fff;}
  .pc-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
  .pc-stock-badge{background:#EEEBE2;padding:1px 7px;border-radius:9px;font-weight:600;}
  .pc-stock-badge.low{background:var(--danger-bg);color:var(--danger);}

  /* Product detail */
  .product-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .product-head h2{font-family:'Fraunces',serif;margin:0;font-size:24px;}
  .product-head .ph-meta{color:var(--muted);font-size:13px;margin-top:4px;}

  .variant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px;}
  .variant-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .variant-card img{width:100%;height:170px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line);display:block;}
  .variant-card .vc-img-placeholder{width:100%;height:170px;background:#F1ECDD;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);}
  .vc-body{padding:12px 14px;}
  .vc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .vc-color{font-weight:700;font-size:14px;}
  .vc-price-wrap{display:flex;align-items:center;gap:4px;font-size:12.5px;}
  .vc-price-wrap input{width:64px;border:1.5px solid var(--line);border-radius:3px;padding:3px 5px;font-family:inherit;font-size:12.5px;background:var(--bg);}
  .vc-actions{display:flex;gap:5px;margin-top:8px;}

  .size-picker{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;}
  .size-chip{padding:4px 9px;border:1.5px solid var(--line);border-radius:14px;font-size:11px;cursor:pointer;background:var(--surface);}
  .size-chip:hover{border-color:var(--accent);}
  .size-chip.added{opacity:.3;pointer-events:none;}

  .sku-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-top:1px dashed var(--line);gap:6px;}
  .sku-row:first-of-type{border-top:none;}
  .sku-row .sku-label{flex:1;}
  .sku-row .barcode{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;}
  .sku-row input.stock-input{width:52px;padding:3px 5px;border:1px solid var(--line);border-radius:3px;font-size:12px;text-align:center;}
  .sku-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:2px 4px;}

  .upload-drop{border:1.5px dashed var(--line);border-radius:5px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;background:var(--bg);}
  .upload-drop:hover{border-color:var(--accent);}
  .upload-preview{width:100%;max-height:180px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;margin-top:8px;}

  .modal.wide{max-width:520px;}
  .bulk-help{font-size:12px;color:var(--muted);background:#FBF9F3;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:12px;line-height:1.5;}
  .bulk-help code{background:#EEEBE2;padding:1px 5px;border-radius:3px;font-size:11.5px;}
  #depo-bulk-textarea{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:3px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);}
  .bulk-result{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:4px;}
  .bulk-result.ok{background:var(--good-bg);color:var(--good);}
  .bulk-result.error{background:var(--danger-bg);color:var(--danger);}
  .log-item{border-bottom:1px solid var(--line);padding:10px 0;}
  .log-item:last-child{border-bottom:none;}
  .log-item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;}
  .log-item .note{margin-top:4px;font-size:13.5px;}
  .log-empty{color:var(--muted);font-size:13px;padding:10px 0;}
  .chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .chip.wa{background:#E4F8EC;color:#1D9A4E;}
  .chip.other{background:#EEEBE2;color:var(--muted);}
  .extra-info-box{border:1.5px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:14px;background:var(--bg);}
  .extra-info-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px;}
  .extra-info-label{color:var(--muted);}
  .extra-info-value{font-variant-numeric:tabular-nums;text-align:right;}
  .order-totals-box{display:grid;grid-template-columns:1fr auto;gap:5px 20px;border:1.5px solid var(--line);border-radius:6px;padding:14px 20px;max-width:300px;margin-left:auto;font-size:13px;}
  .order-totals-box span{padding:2px 0;}
  .order-totals-box span:nth-child(odd){color:var(--muted);}
  .order-totals-box span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right;font-weight:600;}
  .order-totals-box .tot-label,.order-totals-box .tot-value{border-top:1px solid var(--line);padding-top:9px;margin-top:5px;font-weight:700;color:var(--ink);font-size:14px;}
  .order-totals-box .bal-label,.order-totals-box .bal-value{font-weight:700;font-size:15px;}
  .depo-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;max-height:72vh;overflow-y:auto;}
  .depo-table{border-collapse:collapse;width:100%;min-width:640px;background:var(--surface);}
  .depo-table thead th{
    position:sticky;top:0;z-index:2;background:#F1ECDD;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;
    text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap;
  }
  .depo-table tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .depo-table tbody tr:hover{background:#FBF9F3;}
  .depo-table tbody tr:last-child td{border-bottom:none;}
  .depo-td-muted{color:var(--muted);font-variant-numeric:tabular-nums;}
  .depo-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
  .depo-actions .btn{padding:4px 9px;font-size:12px;}
  .depo-qty-cell{display:flex;align-items:center;gap:8px;}
  .depo-qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
  .depo-qty-btn.in{color:var(--good);border-color:var(--good);}
  .depo-qty-btn.in:hover{background:var(--good);color:#fff;}
  .depo-qty-btn.out{color:var(--danger);border-color:var(--danger);}
  .depo-qty-btn.out:hover{background:var(--danger);color:#fff;}
  .depo-price-input{width:78px;border:1.5px solid var(--line);border-radius:3px;padding:5px 7px;font-size:12.5px;background:var(--bg);}
  .fx-banner{background:#FBF0D6;border:1.5px solid var(--warn);color:var(--accent-ink);border-radius:5px;padding:9px 14px;margin-bottom:14px;font-size:13px;}
  .pdf-scope{display:flex;gap:8px;margin-bottom:12px;}
  .pdf-scope label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;color:var(--ink);}
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">Yükleniyor…</div></div>
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';

// ---------- constants ----------
const API_URL = 'https://script.google.com/macros/s/AKfycbxWMQn9FmNZXcmv6se-ZrlO7zfjNFyLf-gUzfRMGCV8Y25lT7DVPkRgnRTlcMVtPa02cw/exec';
async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 90000);
  try{
    return await fetch(url, {...(options||{}), signal: controller.signal});
  } finally {
    clearTimeout(timer);
  }
}
const SIZES = [
  {code:'0', label:'Size 0 (0-3 Ay)', short:'Size 0', eng:'Size 0 (0-3M)', eu:15},
  {code:'1', label:'Size 1 (3-6 Ay)', short:'Size 1', eng:'Size 1 (3-6M)', eu:16},
  {code:'2', label:'Size 2 (6-9 Ay)', short:'Size 2', eng:'Size 2 (6-9M)', eu:17},
  {code:'3', label:'Size 3 (9-12 Ay)', short:'Size 3', eng:'Size 3 (9-12M)', eu:18}
];
const MAX_COLORS_PER_MODEL = 9;
const MAX_SIZES_PER_COLOR = 9;
const LOW_STOCK_THRESHOLD = 5;

// ---------- helpers ----------
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function digitsOnly(s){ return (s||'').toString().replace(/[^0-9]/g,''); }
function attrEsc(s){ return esc(s).replace(/`/g,'&#96;'); }
function parseBulkLine(line){
  // Auto-detect delimiter: tab, then semicolon (common in Turkish-locale Excel CSV exports), then comma.
  let parts;
  if(line.includes('\t')) parts = line.split('\t');
  else if(line.includes(';')) parts = line.split(';');
  else parts = line.split(',');
  return parts.map(p=>p.trim());
}
function formatMoney(n){ return (Number(n)||0).toLocaleString('tr-TR', {maximumFractionDigits:2}); }
function csvField(v){ const s = String(v==null?'':v); if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"'; return s; }
function downloadBlob(filename, mime, content){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

let toastTimer = null;
function showToast(msg, persistent){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  if(!persistent) toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

// ---------- EAN-13 barcode ----------
function padRef(refNo){ return String(refNo).replace(/[^0-9]/g,'').padStart(6,'0').slice(-6); }
function ean13CheckDigit(base12){
  let sum = 0;
  for(let i=0;i<12;i++){
    const d = parseInt(base12[i],10);
    sum += (i%2===0) ? d*1 : d*3;
  }
  return String((10 - (sum % 10)) % 10);
}
function computeBarcode(refNo, colorOrder, sizeOrder){
  const base12 = '1288' + padRef(refNo) + String(colorOrder) + String(sizeOrder);
  return base12 + ean13CheckDigit(base12);
}

// ---------- backend (shared with Müşteri Merkezi) ----------
async function loadAll(){
  const authParams = session ? ('?authUser=' + encodeURIComponent(session.username) + '&authHash=' + encodeURIComponent(session.passwordHash)) : '';
  const res = await fetch(API_URL + authParams);
  const text = await res.text();
  return text ? JSON.parse(text) : {};
}
async function saveKey(key, value){
  try{
    const res = await fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({key, value, auth: session ? {username:session.username, passwordHash:session.passwordHash} : null})
    }, 60000);
    const data = await res.json();
    if(!data || !data.ok){ showToast('Kaydetme hatası — tekrar deneyin'); return false; }
    return true;
  }catch(e){
    if(e && e.name === 'AbortError'){
      showToast('⏱ Sunucu yanıtı gecikti — kayıt yine de tamamlanmış olabilir, birkaç saniye sonra sayfayı yenileyip kontrol edin.');
    } else {
      showToast('Kaydetme hatası — internet bağlantınızı kontrol edin');
    }
    return false;
  }
}

// ---------- authentication ----------
const AUTH_STORAGE_KEY = 'fs_auth_session_v1';
let session = null;
const authState = { screen: 'loading', error: '', loggingIn: false, publicLogo: null };
const LOGO_CACHE_KEY = 'fs_logo_cache_v1';
function loadCachedLogo(){
  try{ return localStorage.getItem(LOGO_CACHE_KEY) || null; }catch(e){ return null; }
}
function saveCachedLogo(dataUrl){
  try{ if(dataUrl) localStorage.setItem(LOGO_CACHE_KEY, dataUrl); }catch(e){ /* storage full/unavailable — ignore, cosmetic only */ }
}
async function fetchPublicLogo(){
  try{
    const res = await fetch(API_URL + '?action=publicLogo');
    const data = await res.json();
    if(data && data.logo){
      authState.publicLogo = data.logo;
      saveCachedLogo(data.logo);
      if(authState.screen !== 'app') renderAuthScreen();
    }
  }catch(e){ /* logo is cosmetic — ignore failures */ }
}

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function loadSessionFromStorage(){
  try{ const raw = localStorage.getItem(AUTH_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveSessionToStorage(s){ try{ localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(s)); }catch(e){} }
function clearSessionStorage(){ try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e){} }
async function checkBootstrapStatus(){
  try{
    const res = await fetch(API_URL + '?action=bootstrapStatus');
    const data = await res.json();
    return !!data.hasUsers;
  }catch(e){ return true; }
}
async function verifySession(s){
  try{
    const res = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'login', username:s.username, passwordHash:s.passwordHash})
    });
    const data = await res.json();
    return data && data.ok ? data.user : null;
  }catch(e){ return null; }
}
async function boot(){
  authState.publicLogo = loadCachedLogo();
  renderAuthScreen();
  fetchPublicLogo();
  const stored = loadSessionFromStorage();
  if(stored){
    // Load immediately using the stored session — don't block on a network round-trip first.
    session = { username: stored.username, passwordHash: stored.passwordHash, displayName: stored.displayName||stored.username, role: stored.role||'staff', id: stored.id };
    authState.screen = 'app';
    init();
    startAutoRefresh();
    verifySession(stored).then(user=>{
      if(user){
        session = { username: user.username, passwordHash: stored.passwordHash, displayName: user.displayName, role: user.role, id: user.id };
      } else {
        clearSessionStorage();
        session = null;
        authState.screen = 'login';
        renderAuthScreen();
      }
    });
    return;
  }
  const hasUsers = await checkBootstrapStatus();
  authState.screen = hasUsers ? 'login' : 'bootstrap';
  renderAuthScreen();
}
async function submitBootstrap(){
  if(authState.loggingIn) return;
  const username = document.getElementById('bs-username').value.trim();
  const password = document.getElementById('bs-password').value;
  const displayName = document.getElementById('bs-displayname').value.trim();
  if(!username || password.length < 4){ authState.error = 'Kullanıcı adı girin, şifre en az 4 karakter olmalı'; renderAuthScreen(); return; }
  authState.error = '';
  authState.loggingIn = true;
  renderAuthScreen();
  const passwordHash = await hashPassword(password);
  try{
    const res = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'bootstrap', username, passwordHash, displayName})
    });
    const data = await res.json();
    authState.loggingIn = false;
    if(data && data.ok){
      session = { username: data.user.username, passwordHash, displayName: data.user.displayName, role: data.user.role, id: data.user.id };
      saveSessionToStorage(session);
      authState.screen = 'app';
      init();
      startAutoRefresh();
    } else {
      authState.error = 'Kurulum başarısız — sayfayı yenileyip tekrar deneyin';
      renderAuthScreen();
    }
  }catch(e){
    authState.loggingIn = false;
    authState.error = 'Sunucuya bağlanılamadı';
    renderAuthScreen();
  }
}

// ---------- client-side image processing (crop + whiten background) ----------
function sampleBackgroundColor(data, w, h){
  const pts = [
    [1,1],[w-2,1],[1,h-2],[w-2,h-2],
    [Math.floor(w/2),1],[1,Math.floor(h/2)],[w-2,Math.floor(h/2)],[Math.floor(w/2),h-2]
  ];
  let r=0,g=0,b=0,n=0;
  pts.forEach(([x,y])=>{
    if(x<0||y<0||x>=w||y>=h) return;
    const idx=(y*w+x)*4;
    r+=data[idx]; g+=data[idx+1]; b+=data[idx+2]; n++;
  });
  return n ? [r/n, g/n, b/n] : [255,255,255];
}
function colorDist(r,g,b,cr,cg,cb){
  const dr=r-cr, dg=g-cg, db=b-cb;
  return Math.sqrt(dr*dr + dg*dg + db*db);
}
// ---------- Excel (embedded cell images) katalog içe aktarma ----------
function xmlDecode(s){
  return (s||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
}
async function parseXlsxWithImages(file){
  const zip = await JSZip.loadAsync(file);

  // Shared strings
  const strings = [];
  const sharedStringsFile = zip.file('xl/sharedStrings.xml');
  if(sharedStringsFile){
    const xml = await sharedStringsFile.async('text');
    for(const m of xml.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) strings.push(xmlDecode(m[1]));
  }

  // Resolve the first sheet's actual file path (robust to non-default sheet naming)
  const workbookXml = await zip.file('xl/workbook.xml').async('text');
  const workbookRelsXml = await zip.file('xl/_rels/workbook.xml.rels').async('text');
  const sheetRidMatch = workbookXml.match(/<sheet[^>]*r:id="(rId\d+)"/);
  const relId = sheetRidMatch ? sheetRidMatch[1] : 'rId1';
  const targetMatch = workbookRelsXml.match(new RegExp('Id="'+relId+'"[^>]*Target="([^"]+)"'));
  const sheetPath = 'xl/' + (targetMatch ? targetMatch[1] : 'worksheets/sheet1.xml');
  const sheetXml = await zip.file(sheetPath).async('text');

  // Rich Value chain — resolves cell vm="N" attributes to actual media file paths.
  // Only present when the workbook uses Excel's "image in cell" feature.
  let vmToImage = {};
  const metaFile = zip.file('xl/metadata.xml');
  if(metaFile){
    const metaXml = await metaFile.async('text');
    const rvbList = [...metaXml.matchAll(/<xlrd:rvb i="(\d+)"\/>/g)].map(m=>parseInt(m[1]));
    const rvFile = zip.file('xl/richData/rdrichvalue.xml');
    const relRelFile = zip.file('xl/richData/richValueRel.xml');
    const relRelRelsFile = zip.file('xl/richData/_rels/richValueRel.xml.rels');
    if(rvFile && relRelFile && relRelRelsFile){
      const rvXml = await rvFile.async('text');
      const rvBlocks = [...rvXml.matchAll(/<rv[^>]*>([\s\S]*?)<\/rv>/g)];
      const rvFirstV = rvBlocks.map(b=>{ const m=b[1].match(/<v>(\d+)<\/v>/); return m?parseInt(m[1]):null; });
      const relRelXml = await relRelFile.async('text');
      const relIds = [...relRelXml.matchAll(/<rel r:id="(rId\d+)"\/>/g)].map(m=>m[1]);
      const relRelRelsXml = await relRelRelsFile.async('text');
      const ridToTarget = {};
      for(const m of relRelRelsXml.matchAll(/Id="(rId\d+)"[^>]*Target="([^"]+)"/g)) ridToTarget[m[1]] = m[2];
      rvbList.forEach((rvbI, idx)=>{
        const vm = idx+1;
        const rvIdx = rvFirstV[rvbI];
        if(rvIdx==null) return;
        const rid = relIds[rvIdx];
        const target = rid ? ridToTarget[rid] : null;
        if(target) vmToImage[vm] = 'xl/' + target.replace('../', '');
      });
    }
  }

  // Parse rows via DOMParser
  const doc = new DOMParser().parseFromString(sheetXml, 'application/xml');
  const rowEls = [...doc.getElementsByTagName('row')];
  function cellText(c){
    if(!c) return null;
    const t = c.getAttribute('t');
    const vEl = c.getElementsByTagName('v')[0];
    if(!vEl) return null;
    if(t==='s') return strings[parseInt(vEl.textContent)];
    return vEl.textContent;
  }
  const rows = rowEls.map(rowEl=>{
    const byCol = {};
    for(const c of [...rowEl.children]){
      const ref = c.getAttribute('r');
      const m = ref && ref.match(/^[A-Z]+/);
      if(m) byCol[m[0]] = c;
    }
    return byCol;
  });
  if(rows.length===0) return {rows:[], columns:{}};

  const headerRow = rows[0];
  const headerMap = {};
  Object.keys(headerRow).forEach(col=>{
    const txt = (cellText(headerRow[col])||'').trim().toUpperCase();
    if(txt) headerMap[txt] = col;
  });
  function findCol(...candidates){ for(const c of candidates){ if(headerMap[c]) return headerMap[c]; } return null; }
  const columns = {
    barcode: findCol('_BARKOD','BARKOD','BARCODE'),
    image: findCol('RESİM','RESIM','IMAGE','GÖRSEL','GORSEL'),
    ref: findCol('GRUP','REF','REFERANS','REFERANS NO','REF NO'),
    color: findCol('RENK','COLOR'),
    gender: findCol('CİNSİYET','CINSIYET','GENDER'),
    season: findCol('SEZON','SEASON'),
  };

  const parsedRows = [];
  for(const r of rows.slice(1)){
    const barcode = columns.barcode ? cellText(r[columns.barcode]) : null;
    if(!barcode) continue;
    const bcell = columns.image ? r[columns.image] : null;
    const vm = bcell ? bcell.getAttribute('vm') : null;
    const imagePath = vm ? vmToImage[vm] : null;
    const genderRaw = columns.gender ? cellText(r[columns.gender]) : null;
    const seasonRaw = columns.season ? cellText(r[columns.season]) : null;
    parsedRows.push({
      barcode: String(barcode).trim(),
      imagePath,
      refNo: columns.ref ? cellText(r[columns.ref]) : null,
      colorName: columns.color ? cellText(r[columns.color]) : null,
      gender: (genderRaw && genderRaw.trim().toUpperCase()!=='CİNSİYET') ? genderRaw.trim() : null,
      season: (seasonRaw && seasonRaw.trim().toUpperCase()!=='SEZON') ? seasonRaw.trim() : null,
    });
  }

  // Resolve unique image paths to Blobs once each
  const uniquePaths = Array.from(new Set(parsedRows.map(r=>r.imagePath).filter(Boolean)));
  const blobCache = {};
  for(const p of uniquePaths){
    const f = zip.file(p);
    if(f) blobCache[p] = await f.async('blob');
  }
  parsedRows.forEach(r=>{ if(r.imagePath) r.imageBlob = blobCache[r.imagePath] || null; });

  return {rows: parsedRows, columns, hasRichImages: uniquePaths.length>0};
}

async function processImageFile(file, maxWidth, quality){
  maxWidth = maxWidth || 620; quality = quality || 0.8;

  // Decode the source image. createImageBitmap with a resize hint lets the browser decode
  // directly at a smaller size — this avoids ever holding a full-resolution decode of a huge
  // phone photo (e.g. a 12MP+ iPhone shot) in memory, which can otherwise cause failures on
  // some devices. Falls back to the classic <img> approach if createImageBitmap isn't available.
  let source, sw, sh;
  try{
    if(window.createImageBitmap){
      source = await createImageBitmap(file, {resizeWidth: 1000, resizeQuality: 'medium'});
      sw = source.width; sh = source.height;
    }
  }catch(err){ source = null; }

  if(!source){
    const dataUrl = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = e=>resolve(e.target.result);
      reader.onerror = ()=>reject(new Error('file read failed'));
      reader.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = ()=>reject(new Error('image load failed'));
      im.src = dataUrl;
    });
    const analyzeScale = Math.min(1, 1000 / img.width);
    sw = Math.max(1, Math.round(img.width * analyzeScale));
    sh = Math.max(1, Math.round(img.height * analyzeScale));
    source = img;
  }

  // Simple, reliable resize — no background detection/cropping, so there's no risk of eating
  // into a light-colored product. Keeps the photo exactly as taken, just sized down.
  const outScale = Math.min(1, maxWidth / sw);
  const ow = Math.max(1, Math.round(sw*outScale)), oh = Math.max(1, Math.round(sh*outScale));
  const c1 = document.createElement('canvas');
  c1.width = ow; c1.height = oh;
  const ctx1 = c1.getContext('2d');
  ctx1.fillStyle = '#ffffff';
  ctx1.fillRect(0,0,ow,oh);
  ctx1.drawImage(source, 0, 0, ow, oh);

  // Safety net: a Sheets cell silently drops data past ~50,000 characters. Try progressively
  // lower quality (never lower resolution) until the encoded image comfortably fits.
  const MAX_IMAGE_CHARS = 38000;
  let q = quality;
  let out = c1.toDataURL('image/jpeg', q);
  while(out.length > MAX_IMAGE_CHARS && q > 0.35){
    q -= 0.1;
    out = c1.toDataURL('image/jpeg', q);
  }
  return out;
}

  logo: null,

  fxRateLoading: false,

};

async function init(){
  if(session.role === 'depocu'){
    state.loaded = true;
    state.blockedForDepocu = true;
    render();
    return;
  }
  try{
    const all = await loadAll();
    state.products = all['catalogProducts'] || [];
    state.skus = all['catalogSkus'] || [];
    state.logo = all['logo'] || null;
    state.warehouseItems = [];
    state.variants = [];
    state.customers = [];
    state.orders = [];
    Object.keys(all).forEach(k=>{
      if(k.indexOf('catalogVariant:') === 0 && all[k]){
        state.variants.push(all[k]);
      } else if(k.indexOf('warehouseItem:') === 0 && all[k]){
        state.warehouseItems.push(all[k]);
      } else if(k.indexOf('customer:') === 0 && all[k]){
        state.customers.push(all[k]);
      } else if(k.indexOf('order:') === 0 && all[k]){
        const o = all[k];
        if(o.status === 'shipped') o.status = 'packed'; // legacy status name from before pack/deliver were split
        state.orders.push(o);
      }
    });
  }catch(e){
    showToast('Sunucuya bağlanılamadı — internet bağlantınızı kontrol edin');
  }
  state.loaded = true;
  render();
}
async function refreshData(){
  showToast('Güncelleniyor…', true); // stays visible (no gap) until the reload actually finishes
  await init();
  showToast('Güncel veriler yüklendi');
}
let autoRefreshTimer = null;
function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(silentAutoRefresh, 45000); // every 45s
}
async function silentAutoRefresh(){
  if(document.hidden) return;
  if(state.modalMode) return;
  if(state.view === 'orderNew') return; // don't disrupt an order being actively built
  if(state.orderDraftSaving || state.packingRunning) return;

    await init();
  }catch(e){ /* silent — a failed background refresh isn't worth interrupting the user for */ }
}

function variantsFor(productId){ return state.variants.filter(v=>v.productId===productId).sort((a,b)=>a.colorOrder-b.colorOrder); }
function skusFor(variantId){ return state.skus.filter(s=>s.variantId===variantId).sort((a,b)=>a.sizeOrder-b.sizeOrder); }
function sizeNumberOnly(sizeLabel){
  if(!sizeLabel) return '';
  const m = String(sizeLabel).match(/(\d+)\s*$/);
  return m ? m[1] : String(sizeLabel).trim();
}
function detailRefLabel(refNo, colorName, sizeLabel){
  const parts = [refNo, colorName, sizeNumberOnly(sizeLabel)].filter(p=>p!==undefined && p!==null && String(p).trim()!=='');
  return parts.join(' ').toUpperCase();
}
function imageForBarcode(barcode){
  const sku = state.skus.find(s=>s.barcode===barcode);
  if(!sku) return null;
  const variant = state.variants.find(v=>v.id===sku.variantId);
  return (variant && variant.image) ? variant.image : null;
}
function priceForBarcode(barcode, refNoFallback){
  const sku = state.skus.find(s=>s.barcode===barcode);
  if(sku){
    const variant = state.variants.find(v=>v.id===sku.variantId);
    if(variant){
      const product = state.products.find(p=>p.id===variant.productId);
      if(product) return Number(product.price)||0;
    }
  }
  if(refNoFallback){
    const product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNoFallback).trim().toUpperCase());
    if(product) return Number(product.price)||0;
  }
  return null;
}
async function updateDepoPrice(barcode, refNoFallback, newPrice){
  const price = Number(newPrice);
  if(isNaN(price) || price < 0){ showToast('Geçerli bir fiyat girin'); render(); return; }
  const sku = state.skus.find(s=>s.barcode===barcode);
  let product = null;
  if(sku){
    const variant = state.variants.find(v=>v.id===sku.variantId);
    if(variant) product = state.products.find(p=>p.id===variant.productId);
  }
  if(!product && refNoFallback){
    product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNoFallback).trim().toUpperCase());
  }
  const oldPrice = product ? (Number(product.price)||0) : 0;
  if(product && oldPrice > 0 && oldPrice !== price){
    const ok = confirm(`Ref ${product.refNo} fiyatını $${formatMoney(oldPrice)}'den $${formatMoney(price)}'ye güncellemek istediğinize emin misiniz? Bu, tüm renk ve bedenleri etkileyecek.`);
    if(!ok){ render(); return; }
  }
  if(!product){
    if(!refNoFallback){ showToast('Bu kayıt için referans bilgisi eksik, fiyat girilemiyor'); return; }
    product = {id:uid(), refNo:refNoFallback, name:'', price:0, createdAt:todayISO(), createdBy:session.displayName};
    state.products.push(product);
  }
  product.price = price;
  render();
  const ok2 = await saveKey('catalogProducts', state.products);
  if(ok2) showToast('Fiyat güncellendi — Ref ' + product.refNo + '\'in tüm renk ve bedenlerini etkiler');
}

function stockForBarcode(barcode, fallback){
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  return item ? (Number(item.stock)||0) : (Number(fallback)||0);
}
function reservedForBarcode(barcode){
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  return item ? (Number(item.reserved)||0) : 0;
}
function availableForBarcode(barcode, fallback){
  return stockForBarcode(barcode, fallback) - reservedForBarcode(barcode);
}
function unitForRefNo(refNo){
  const p = state.products.find(x=>String(x.refNo).trim().toUpperCase()===String(refNo).trim().toUpperCase());
  return (p && p.unit) ? p.unit : 'Adet';
}
function customerName(c){
  if(!c) return '—';
  return c.adSoyad && c.firma ? `${c.adSoyad} (${c.firma})` : (c.adSoyad || c.firma || '—');
}
function customerById(id){ return state.customers.find(c=>c.id===id); }
function ordersForCustomer(customerId){ return state.orders.filter(o=>o.customerId===customerId); }
function nextOrderNo(){
  const max = state.orders.reduce((m,o)=>{
    const n = parseInt(String(o.orderNo||'').replace(/[^0-9]/g,''),10);
    return isNaN(n) ? m : Math.max(m,n);
  }, 0);
  return 'S-' + String(max+1).padStart(4,'0');
}
function orderLineSubtotal(order){
  return (order.lines||[]).reduce((sum,l)=>{
    const lineQty = l.sizes ? l.sizes.reduce((s,x)=>s+(Number(x.qty)||0),0) : (Number(l.qty)||0);
    return sum + lineQty*(Number(l.unitPrice)||0);
  }, 0);
}
function orderDiscountAmount(order){
  const sub = orderLineSubtotal(order);
  if(!order.discountType || !order.discountValue) return 0;
  return order.discountType==='percent' ? sub * (Number(order.discountValue)||0)/100 : (Number(order.discountValue)||0);
}
function orderTotal(order){ return Math.max(0, orderLineSubtotal(order) - orderDiscountAmount(order)); }
function orderReturnedAmount(order){
  return (order.returns||[]).reduce((sum,r)=> sum + (r.lines||[]).reduce((s,l)=>{
    const origLine = (order.lines||[]).find(x=>x.barcode===l.barcode);
    return s + (origLine ? l.qty*(Number(origLine.unitPrice)||0) : 0);
  }, 0), 0);
}
function orderReturnedQty(order, barcode){
  return (order.returns||[]).reduce((sum,r)=> sum + (r.lines||[]).filter(l=>l.barcode===barcode).reduce((s,l)=>s+l.qty,0), 0);
}
function orderBalance(order){ return Math.max(0, orderTotal(order) - orderReturnedAmount(order) - (Number(order.deposit)||0)); }
function orderStatusLabel(status){
  return {draft:'Taslak', approved:'Onaylandı', packed:'Hazırlandı', delivered:'Teslim Edildi', returned:'İade Edildi', cancelled:'İptal Edildi'}[status] || status;
}
function orderStatusChipClass(status){
  return {draft:'other', approved:'wa', packed:'wa', delivered:'wa', returned:'other', cancelled:'other'}[status] || 'other';
}
function orderTotalQty(o){ return (o.lines||[]).reduce((sum,l)=>sum+(Number(l.qty)||0),0); }
function qtyByUnitToLabel(map){
  const parts = Object.keys(map).map(u=>`${map[u]} ${u}`);
  return parts.length ? parts.join(', ') : '0';
}
function orderQtyByUnit(order){
  const map = {};
  (order.lines||[]).forEach(l=>{
    const u = unitForRefNo(l.refNo);
    map[u] = (map[u]||0) + (Number(l.qty)||0);
  });
  return qtyByUnitToLabel(map);
}
function orderDraftQtyByUnit(draft){
  const map = {};
  (draft.lines||[]).forEach(l=>{
    const u = unitForRefNo(l.refNo);
    const lineQty = l.sizes.reduce((s,x)=>s+(Number(x.qty)||0),0);
    map[u] = (map[u]||0) + lineQty;
  });
  return qtyByUnitToLabel(map);
}
function orderPrimaryUnit(o){
  const first = (o.lines||[])[0];
  return first ? unitForRefNo(first.refNo) : 'Adet';
}
function stockForVariant(variantId){ return skusFor(variantId).reduce((sum,s)=>sum+stockForBarcode(s.barcode, s.stock),0); }

function totalStockForProduct(productId){
  const vids = new Set(variantsFor(productId).map(v=>v.id));
  return state.skus.filter(s=>vids.has(s.variantId)).reduce((sum,s)=>sum+stockForBarcode(s.barcode, s.stock),0);
}

function openNewOrder(){
  state.orderDraft = { id: uid(), customerId: null, lines: [], discountType: null, discountValue: 0, deposit: 0, notes: '' };
  state.orderCustomerSearch = '';
  state.orderProductSearch = '';

}
function setOrderCustomer(id){ state.orderDraft.customerId = id; render(); }
function setOrderCustomerSearch(v){ state.orderCustomerSearch = v; render(); }
function setOrderProductSearch(v){ state.orderProductSearch = v; render(); }
// Adds (or focuses) one order line group for a color variant — one row per color, image + per-size qty.
function orderGroupKey(refNo, colorName){ return String(refNo).trim().toUpperCase() + '::' + String(colorName).trim().toUpperCase(); }
function extractSizeNum(label){
  const m = String(label||'').match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function naturalSizeSort(a, b){
  const na = extractSizeNum(a.sizeLabel);
  const nb = extractSizeNum(b.sizeLabel);
  if(na!==null && nb!==null && na!==nb) return na-nb;
  if(na!==null && nb===null) return -1;
  if(na===null && nb!==null) return 1;
  return String(a.sizeLabel||'').localeCompare(String(b.sizeLabel||''));
}
function addOrderColorLine(refNo, colorName){
  const key = orderGroupKey(refNo, colorName);
  if(state.orderDraft.lines.some(l=>l.groupKey===key)) return; // already added
  const product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNo).trim().toUpperCase());
  const variant = product ? state.variants.find(v=>v.productId===product.id && v.colorName===colorName) : null;
  const sizes = [];
  if(variant){
    skusFor(variant.id).forEach(s=>{
      sizes.push({barcode:s.barcode, sizeLabel: s.customSizeLabel || (SIZES.find(x=>x.code===s.sizeCode)||{}).short || s.sizeCode || '', qty:0});
    });
  }
  // Always also pull in Depo items for this ref+color — covers barcodes not (yet) linked into a formal catalog variant.
  state.warehouseItems.filter(w=>orderGroupKey(w.refNo, w.colorName)===key).forEach(w=>{
    if(!sizes.some(s=>s.barcode===w.barcode)) sizes.push({barcode:w.barcode, sizeLabel:w.sizeLabel||'', qty:0});
  });
  if(sizes.length===0){ showToast('Bu renk için beden/barkod bulunamadı'); return; }
  sizes.sort(naturalSizeSort);
  state.orderDraft.lines.push({
    groupKey:key, refNo, colorName, image: variant?variant.image:null,
    unitPrice: product?(Number(product.price)||0):0, sizes
  });
  render();
}
function removeOrderColorLine(groupKey){
  state.orderDraft.lines = state.orderDraft.lines.filter(l=>l.groupKey!==groupKey);
  render();
}
function setOrderLineQty(groupKey, barcode, value){
  const line = state.orderDraft.lines.find(l=>l.groupKey===groupKey);
  if(!line) return;
  const qty = Math.max(0, parseInt(value,10)||0);
  line.sizes.forEach(s=>{ s.qty = qty; }); // same qty across all sizes by default; edit any box afterward to override just that one
  render();
}
function setOrderLinePrice(groupKey, value){
  const line = state.orderDraft.lines.find(l=>l.groupKey===groupKey);
  if(!line) return;
  line.unitPrice = Math.max(0, parseFlexibleNumberOrder(value));
  render();
}
function parseFlexibleNumberOrder(str){
  if(str==null) return 0;
  str = String(str).trim().replace(/[$₺€£]/g,'').trim();
  if(/^\d+,\d{1,2}$/.test(str)) str = str.replace(',', '.');
  const n = parseFloat(str);
  return isNaN(n) ? 0 : n;
}
function setOrderDiscountType(v){ state.orderDraft.discountType = v || null; if(!v) state.orderDraft.discountValue = 0; render(); }
function setOrderDiscountValue(v){ state.orderDraft.discountValue = parseFlexibleNumberOrder(v); render(); }
function setOrderDeposit(v){ state.orderDraft.deposit = parseFlexibleNumberOrder(v); render(); }
function setOrderNotes(v){ state.orderDraft.notes = v; }
function flattenOrderLines(draft){
  // Converts the per-color/per-size UI structure into a flat line list for storage — one entry
  // per barcode with qty>0, which is what the backend's approve/ship logic operates on.
  const flat = [];
  (draft.lines||[]).forEach(l=>{
    l.sizes.forEach(s=>{
      if(s.qty>0) flat.push({barcode:s.barcode, refNo:l.refNo, colorName:l.colorName, sizeLabel:s.sizeLabel, qty:s.qty, unitPrice:l.unitPrice});
    });
  });
  return flat;
}
async function saveOrderDraft(){
  if(state.orderDraftSaving) return; // already in flight — ignore repeat clicks (prevents duplicate orders)
  const d = state.orderDraft;
  if(!d.customerId){ showToast('Önce bir müşteri seçin'); return; }
  const flat = flattenOrderLines(d);
  if(flat.length===0){ showToast('En az bir üründen, en az bir bedene adet girin'); return; }
  const existing = state.orders.find(o=>o.id===d.id);
  const order = {
    id: d.id, orderNo: existing ? existing.orderNo : null, customerId: d.customerId,
    status: 'draft', createdAt: existing ? existing.createdAt : new Date().toISOString(), createdBy: existing ? existing.createdBy : session.displayName,
    lines: flat, discountType: d.discountType, discountValue: d.discountValue, deposit: d.deposit, notes: d.notes
  };
  state.orderDraftSaving = true;
  render();
  showToast('Kaydediliyor…');
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'saveOrderDraft', auth:{username:session.username, passwordHash:session.passwordHash}, order})
    }, 30000);
    const data = await res.json();
    if(data && data.ok){
      state.orders = existing ? state.orders.map(o=>o.id===data.order.id?data.order:o) : [...state.orders, data.order];
      state.orderDraft = null;
      state.selectedOrderId = null;
      state.view = 'orders';
      showToast('Sipariş taslak olarak kaydedildi');
    } else {
      showToast('Kaydedilemedi — tekrar deneyin');
    }
  }catch(e){ showToast('Sunucuya bağlanılamadı'); }
  state.orderDraftSaving = false;
  render();
}
function editOrderDraft(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  if(!o || o.status!=='draft') return;
  const lines = [];
  const byKey = {};
  o.lines.forEach(l=>{
    const key = orderGroupKey(l.refNo, l.colorName);
    if(!byKey[key]){
      const product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(l.refNo).trim().toUpperCase());
      const variant = product ? state.variants.find(v=>v.productId===product.id && v.colorName===l.colorName) : null;
      byKey[key] = { groupKey:key, refNo: l.refNo, colorName: l.colorName, image: variant?variant.image:null, unitPrice: l.unitPrice, sizes: [] };
      lines.push(byKey[key]);
    }
    byKey[key].sizes.push({barcode:l.barcode, sizeLabel:l.sizeLabel, qty:l.qty});
  });
  lines.forEach(l=>l.sizes.sort(naturalSizeSort));
  state.orderDraft = { id: o.id, customerId: o.customerId, lines, discountType: o.discountType, discountValue: o.discountValue, deposit: o.deposit, notes: o.notes||'' };
  state.orderCustomerSearch = '';
  state.orderProductSearch = '';
  state.view = 'orderNew';
  render();
}

  const p = {id:uid(), refNo: String(refNo).replace(/[^0-9]/g,''), name: (name||'').trim(), price: Number(price)||0, unit: unit||'Adet', createdAt: todayISO(), createdBy: session.displayName};

  const newPrice = Number(price)||0;

  if(oldPrice > 0 && oldPrice !== newPrice){

// Shared helper — every stock movement (manual, bulk import, scan) goes through this.
let pendingCriticalWrites = 0;
function beginCriticalWrite(){ pendingCriticalWrites++; }
function endCriticalWrite(){ pendingCriticalWrites = Math.max(0, pendingCriticalWrites-1); }
window.addEventListener('beforeunload', function(e){
  if(pendingCriticalWrites > 0){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
async function postStockMovement(barcode, type, qty, note, refNo, colorName, sizeLabel){
  beginCriticalWrite();
  try{
    const res = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'addStockMovement', auth:{username:session.username, passwordHash:session.passwordHash},
        movement:{barcode, refNo:refNo||'', colorName:colorName||'', sizeLabel:sizeLabel||'', type, qty, note:note||'', date: todayISO(), createdBy: session.displayName}})
    });
    const data = await res.json();
    if(data && data.ok){
      let item = state.warehouseItems.find(w=>w.barcode===barcode);
      if(!item){ item = {barcode, refNo:refNo||'', colorName:colorName||'', sizeLabel:sizeLabel||'', stock:0}; state.warehouseItems.push(item); }
      item.stock = data.stock;
      return {ok:true, stock:data.stock, item};
    }
    return {ok:false};
  }catch(e){ return {ok:false, networkError:true}; }
  finally{ endCriticalWrite(); }
}

function parseCombinedRef(text){
  // "261523 BLUE 1" -> {refNo:'261523', colorName:'BLUE', sizeLabel:'1'}
  const tokens = (text||'').trim().split(/\s+/).filter(Boolean);
  if(tokens.length===0) return {refNo:'', colorName:'', sizeLabel:''};
  if(tokens.length===1) return {refNo:tokens[0], colorName:'', sizeLabel:''};
  if(tokens.length===2) return {refNo:tokens[0], colorName:tokens[1], sizeLabel:''};
  return {refNo:tokens[0], colorName:tokens.slice(1,-1).join(' '), sizeLabel:tokens[tokens.length-1]};
}
function parseDepoBulkLines(raw){
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const items = [];
  let skipped = 0, batchDupes = 0;
  const seenInBatch = new Set();
  for(const line of lines){
    if(/^Barkod\s*[,\t]/i.test(line)) continue; // skip a header row if present
    const cols = parseBulkLine(line).map(c=>(c||'').trim()).filter((c,i,arr)=> !(c==='' && i===arr.length-1 && arr.length>1));
    let barcode, refNo, colorName, sizeLabel, qtyRaw, priceRaw;
    if(cols.length >= 5){
      // Ayrı sütunlu format: Barkod, RefNo, Renk, Beden, Miktar[, Fiyat]
      [barcode, refNo, colorName, sizeLabel, qtyRaw, priceRaw] = cols;
    } else if(cols.length >= 2){
      // Birleşik referans formatı: Barkod, "261523 BLUE 1"[, Miktar[, Fiyat]]
      barcode = cols[0];
      const combined = parseCombinedRef(cols[1]);
      refNo = combined.refNo; colorName = combined.colorName; sizeLabel = combined.sizeLabel;
      qtyRaw = cols.length >= 3 ? cols[2] : '';
      priceRaw = cols.length >= 4 ? cols[3] : '';
    } else if(cols.length === 1 && /\s/.test(cols[0])){
      // Hiç virgül/tab yok, tamamen boşlukla ayrılmış: Barkod 261523 BLUE 1 Miktar
      const tokens = cols[0].split(/\s+/).filter(Boolean);
      barcode = tokens[0];
      const lastIsNum = /^\d+$/.test(tokens[tokens.length-1]);
      const refTokens = lastIsNum && tokens.length>=3 ? tokens.slice(1,-1) : tokens.slice(1);
      const combined = parseCombinedRef(refTokens.join(' '));
      refNo = combined.refNo; colorName = combined.colorName; sizeLabel = combined.sizeLabel;
      qtyRaw = lastIsNum && tokens.length>=3 ? tokens[tokens.length-1] : '';
    } else {
      skipped++; continue;
    }
    barcode = (barcode||'').trim();
    const qty = parseInt(qtyRaw, 10);
    const price = parseFloat(priceRaw);
    if(!barcode){ skipped++; continue; }
    if(seenInBatch.has(barcode)){ batchDupes++; continue; } // aynı dosyada tekrar eden barkod — ilkini kullan
    seenInBatch.add(barcode);
    items.push({barcode, refNo:(refNo||'').trim(), colorName:(colorName||'').trim(), sizeLabel:(sizeLabel||'').trim(), openingStock: isNaN(qty)?0:qty, price: isNaN(price)?null:price, createdBy: session.displayName});
  }
  return {items, skipped, batchDupes};
}
const DEPO_BULK_CHUNK_SIZE = 200;
function setDepoBulkProgress(text, isError){
  const el = document.getElementById('depo-bulk-result');
  if(!el) return;
  el.style.display = 'block';
  el.className = 'bulk-result ' + (isError ? 'error' : 'ok');
  el.textContent = text;
}
async function sendDepoBulkImport(items, skipped, batchDupes){
  if(items.length===0){ showToast('İçe aktarılacak geçerli satır bulunamadı'); return; }
  if(state.depoBulkRunning) return; // guard against double-submit
  state.depoBulkRunning = true;
  render();

  const chunks = [];
  for(let i=0;i<items.length;i+=DEPO_BULK_CHUNK_SIZE) chunks.push(items.slice(i, i+DEPO_BULK_CHUNK_SIZE));

  let totalMovements = 0, totalProcessed = 0, failedChunks = 0;
  const allConflicts = [];
  for(let i=0;i<chunks.length;i++){
    setDepoBulkProgress(`İşleniyor… ${totalProcessed} / ${items.length} satır (parça ${i+1}/${chunks.length}) — lütfen bu pencereyi kapatmayın.`);
    try{
      const res = await fetch(API_URL, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'bulkImportWarehouse', auth:{username:session.username, passwordHash:session.passwordHash}, items:chunks[i]})
      });
      const data = await res.json();
      if(data && data.ok){
        totalMovements += data.movementsWritten||0;
        totalProcessed += chunks[i].length;
        if(data.conflicts && data.conflicts.length) allConflicts.push(...data.conflicts);
      } else {
        failedChunks++;
      }
    }catch(e){
      failedChunks++;
    }
  }

  state.depoBulkRunning = false;

  // Apply any Fiyat (USD) values to catalog products — never for depocu (no price access).
  let pricesUpdated = 0;
  if(session.role !== 'depocu'){
    const priceByRef = {};
    items.forEach(it=>{ if(it.price!=null && it.refNo) priceByRef[it.refNo] = it.price; });
    const refKeys = Object.keys(priceByRef);
    if(refKeys.length>0){
      let changed = false;
      refKeys.forEach(refNo=>{
        let product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNo).trim().toUpperCase());
        if(!product){
          product = {id:uid(), refNo, name:'', price:priceByRef[refNo], createdAt:todayISO(), createdBy:session.displayName};
          state.products.push(product);
          changed = true; pricesUpdated++;
        } else if(product.price !== priceByRef[refNo]){
          product.price = priceByRef[refNo];
          changed = true; pricesUpdated++;
        }
      });
      if(changed) await saveKey('catalogProducts', state.products);
    }
  }

  if(totalProcessed > 0){ await refreshData(); }
  else { render(); }

  const noteParts = [];
  if(skipped>0) noteParts.push(`${skipped} satır atlandı (barkod eksik)`);
  if(batchDupes>0) noteParts.push(`${batchDupes} satır dosya içinde barkodu tekrar ettiği için atlandı`);
  if(pricesUpdated>0) noteParts.push(`${pricesUpdated} model için fiyat güncellendi`);
  if(allConflicts.length>0) noteParts.push(`⚠ ${allConflicts.length} barkod, sistemde FARKLI bir ürüne kayıtlıydı — stok yine de işlendi ama ürün bilgisi güncellenmedi, kontrol edin: ` + allConflicts.slice(0,10).map(c=>c.barcode).join(', ') + (allConflicts.length>10?'…':''));
  const noteStr = noteParts.length ? (' ' + noteParts.join(' · ') + '.') : '';

  if(failedChunks===0){
    setDepoBulkProgress(`✓ Tamamlandı — ${totalProcessed} kayıt işlendi (${totalMovements} tanesi stok hareketi olarak eklendi).${noteStr}`, allConflicts.length>0);
    showToast('Toplu içe aktarma tamamlandı');
  } else {
    setDepoBulkProgress(`${totalProcessed} kayıt işlendi, ${failedChunks} parça gönderilemedi (bağlantı sorunu olabilir) — tekrar deneyebilirsiniz, zaten işlenmiş barkodlar güvenle tekrar gönderilebilir.${noteStr}`, true);
    showToast('Bazı satırlar aktarılamadı');
  }
}
async function submitDepoBulkImport(){
  if(state.depoBulkRunning) return;
  state.depoBulkError = null;
  if(state.depoBulkFile){
    await sendDepoBulkImport(state.depoBulkFile.items, state.depoBulkFile.skipped, state.depoBulkFile.batchDupes);
    state.depoBulkFile = null;
    return;
  }
  const raw = document.getElementById('depo-bulk-textarea').value;
  if(!raw || !raw.trim()){
    state.depoBulkError = 'Önce bir CSV dosyası seçin ya da kutuya veri yapıştırın.';
    render();
    return;
  }
  const {items, skipped, batchDupes} = parseDepoBulkLines(raw);
  if(items.length===0){
    state.depoBulkError = `Girdiğiniz veriden geçerli bir satır çıkmadı (${skipped} satır atlandı) — sütun formatını kontrol edin.`;
    render();
    return;
  }
  await sendDepoBulkImport(items, skipped, batchDupes);
}
function handleDepoBulkFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(state.depoBulkRunning){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      let text = ev.target.result;
      if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip UTF-8 BOM if present
      const {items, skipped, batchDupes} = parseDepoBulkLines(text);
      if(items.length===0){
        const firstLine = text.split('\n').map(l=>l.trim()).filter(Boolean)[0] || '(dosya boş görünüyor)';
        state.depoBulkFile = null;
        state.depoBulkError = `Dosyadan geçerli bir satır çıkmadı (${skipped} satır atlandı). İlk satır: "${firstLine}" — sütun formatını kontrol edin.`;
      } else {
        state.depoBulkFile = {name:file.name, items, skipped, batchDupes};
        state.depoBulkError = null;
        showToast(`${items.length} satır dosyadan okundu — "İçe Aktar"a basın`);
      }
    }catch(err){
      state.depoBulkFile = null;
      state.depoBulkError = 'Dosya işlenirken bir hata oluştu: ' + (err && err.message ? err.message : err);
    }
    render();
  };
  reader.onerror = function(){ showToast('Dosya okunamadı'); };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}
function clearDepoBulkFile(){ state.depoBulkFile = null; state.depoBulkError = null; render(); }

// ---------- Yeni Depo Kaydı — barkodu otomatik formülle üretir (admin/staff) ----------
async function ensureCatalogEntryForExistingBarcode(barcode, refNo, colorName, sizeLabel){
  // Used for legacy/imported barcodes that already exist — reuses the given barcode
  // as-is instead of computing a new one, and allows non-numeric reference codes.
  let product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNo||'').trim().toUpperCase());
  if(!product){
    product = {id:uid(), refNo:(refNo||'').trim(), name:'', price:0, createdAt:todayISO(), createdBy:session.displayName};
    state.products = [...state.products, product];
    await saveKey('catalogProducts', state.products);
  }
  let variant = state.variants.find(v=>v.productId===product.id && v.colorName===(colorName||'').trim());
  if(!variant){
    const existingV = variantsFor(product.id);
    const colorOrder = existingV.length ? Math.max(...existingV.map(v=>v.colorOrder))+1 : 1;
    variant = {id:uid(), productId:product.id, colorName:(colorName||'').trim(), colorOrder, image:null, createdAt:todayISO(), createdBy:session.displayName};
    state.variants = [...state.variants, variant];
    await saveKey('catalogVariant:'+variant.id, variant);
  }
  let sku = state.skus.find(s=>s.barcode===barcode);
  if(!sku){
    const existingS = skusFor(variant.id);
    const sizeOrder = existingS.length ? Math.max(...existingS.map(s=>s.sizeOrder))+1 : 1;
    const num = sizeNumberOnly(sizeLabel);
    const matchedSize = SIZES.find(s=>s.code===num);
    sku = {id:uid(), variantId:variant.id, sizeCode: matchedSize?matchedSize.code:null, sizeOrder, euSize: matchedSize?matchedSize.eu:null, customSizeLabel: matchedSize?'':(sizeLabel||''), barcode, createdAt:todayISO()};
    state.skus = [...state.skus, sku];
    await saveKey('catalogSkus', state.skus);
  }
  return {productId:product.id, variantId:variant.id, skuId:sku.id};
}
async function addWarehouseItemToCatalog(barcode){
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  if(!item) return;
  if(!item.refNo && !item.colorName){ showToast('Kataloğa eklemek için önce referans/renk bilgisi girin'); return; }
  showToast('Kataloğa ekleniyor…');
  await ensureCatalogEntryForExistingBarcode(item.barcode, item.refNo, item.colorName, item.sizeLabel);
  render();
  showToast('Kataloğa eklendi — fotoğraf ve fiyat eklemek için Sipariş sayfasının Modeller sekmesinde ilgili modeli açın');
}

function parseImageFilename(filename){
  const base = filename.replace(/\.[^.]+$/, '');
  const cleaned = base.replace(/_/g, '-').replace(/\s+/g, '-');
  const parts = cleaned.split('-').filter(Boolean);
  if(parts.length < 2) return null;
  const refNo = parts[0].replace(/[^0-9]/g,'');
  const colorName = parts.slice(1).join(' ').toUpperCase();
  if(!refNo || !colorName) return null;
  return {refNo, colorName};
}

}

async function handleExcelImportFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  state.excelImportParsing = true;
  state.excelImportRows = [];
  state.excelImportDone = false;
  render();
  try{
    const {rows, hasRichImages} = await parseXlsxWithImages(file);
    if(!hasRichImages){
      showToast('Bu dosyada hücre-içi resim bulunamadı — dosyanın Excel\'in "resmi hücreye ekle" özelliğiyle hazırlandığından emin olun');
    }
    state.excelImportRows = rows.map(r=>{
      const match = state.warehouseItems.find(w=>w.barcode===r.barcode);
      // If this variant already has an image saved, skip it on import — much faster re-runs
      // when the same list is imported again after only a few new rows were added.
      let alreadyHasImage = false;
      if(match){
        const product = state.products.find(p=>padRef(p.refNo)===padRef(match.refNo));
        const variant = product ? state.variants.find(v=>v.productId===product.id && v.colorName===match.colorName) : null;
        alreadyHasImage = !!(variant && variant.image);
      }
      return {
        ...r,
        matched: !!match,
        matchRefNo: match ? match.refNo : null,
        matchColorName: match ? match.colorName : null,
        matchSizeLabel: match ? match.sizeLabel : null,
        status: alreadyHasImage ? 'already' : 'pending' // pending | ok | error | skipped | already
      };
    });
  }catch(err){
    showToast('Dosya okunamadı — geçerli bir .xlsx dosyası olduğundan emin olun');
  }
  state.excelImportParsing = false;
  render();
}
async function commitExcelImport(){
  const rows = state.excelImportRows.filter(r=>r.matched && r.imageBlob && r.status!=='already');
  if(rows.length===0){ showToast('İçe aktarılacak yeni satır yok'); return; }
  state.excelImportRunning = true;
  state.excelImportProgress = 0;
  render();

  // One resize/compress per UNIQUE image, reused across all rows sharing that image (e.g. same
  // color in multiple sizes) — avoids redundant work.
  const processedByPath = {};
  const genderSeasonByRef = {}; // padded refNo -> {gender, season}

  let okCount = 0, errCount = 0;
  for(const row of rows){
    row.status = 'processing';
    render();
    try{
      if(!processedByPath[row.imagePath]){
        processedByPath[row.imagePath] = await processImageFile(row.imageBlob);
      }
      const processed = processedByPath[row.imagePath];
      const {variantId} = await ensureCatalogEntryForExistingBarcode(row.barcode, row.matchRefNo, row.matchColorName, row.matchSizeLabel);
      const variant = state.variants.find(v=>v.id===variantId);
      variant.image = processed;
      await saveKey('catalogVariant:'+variantId, variant);
      row.status = 'ok';
      okCount++;
      if(state.excelImportUpdateGenderSeason && (row.gender || row.season)){
        const key = padRef(row.matchRefNo);
        if(!genderSeasonByRef[key]) genderSeasonByRef[key] = {};
        if(row.gender) genderSeasonByRef[key].gender = row.gender;
        if(row.season) genderSeasonByRef[key].season = row.season;
      }
    }catch(err){
      row.status = 'error';
      errCount++;
    }
    state.excelImportProgress++;
    render();
  }

  // Apply gender/season at the product level
  if(state.excelImportUpdateGenderSeason){
    let productsChanged = false;
    Object.keys(genderSeasonByRef).forEach(key=>{
      const product = state.products.find(p=>padRef(p.refNo)===key);
      if(product){
        const gs = genderSeasonByRef[key];
        if(gs.gender) product.gender = gs.gender;
        if(gs.season) product.season = gs.season;
        productsChanged = true;
      }
    });
    if(productsChanged) await saveKey('catalogProducts', state.products);
  }

  state.excelImportRunning = false;
  state.excelImportDone = true;
  state.excelImportResultText = errCount>0 ? `${okCount} resim kaydedildi, ${errCount} hata` : `${okCount} resim başarıyla kataloğa eklendi`;
  render();
  showToast(state.excelImportResultText);
}
function openBulkImageModal(){ state.modalMode = 'bulkImage'; state.bulkImageRows = []; state.bulkImageRunning = false; render(); }
function handleBulkImageFiles(e){
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  state.bulkImageRows = files.map(f=>({
    fileName:f.name, parsed:parseImageFilename(f.name), description:'', status:'processing', processedImage:null
  }));
  render();
  files.forEach(async (file, idx)=>{
    const row = state.bulkImageRows[idx];
    if(!row.parsed){ row.status='unparsed'; render(); return; }
    try{
      const processed = await processImageFile(file);
      row.processedImage = processed;
      row.status = 'ready';
    }catch(err){
      row.status = 'error';
    }
    render();
  });
  e.target.value = '';
}
function removeBulkImageRow(idx){ state.bulkImageRows.splice(idx,1); render(); }
function updateBulkImageField(idx, field, value){
  const row = state.bulkImageRows[idx];
  if(!row) return;
  if(field==='refNo' || field==='colorName'){
    row.parsed = row.parsed || {refNo:'', colorName:''};
    row.parsed[field] = field==='refNo' ? value.replace(/[^0-9]/g,'') : value.toUpperCase();
    if(row.parsed.refNo && row.parsed.colorName) row.status = row.processedImage ? 'ready' : row.status;
  } else if(field==='description'){
    row.description = value;
  }
}
async function commitBulkImageImport(){
  const rows = state.bulkImageRows.filter(r=>r.status==='ready' && r.parsed && r.parsed.refNo && r.parsed.colorName);
  if(rows.length===0){ showToast('İçe aktarılacak, eşleşmesi tamamlanmış görsel yok'); return; }
  state.bulkImageRunning = true;
  render();

  let productsChanged=false, skusChanged=false, totalVariants=0, totalLinked=0;
  const variantsToSave = [];

  for(let i=0;i<rows.length;i++){
    const row = rows[i];
    state.bulkImageProgress = `İşleniyor… ${i+1} / ${rows.length} görsel (${row.fileName})`;
    render();
    const refNo = row.parsed.refNo, colorName = row.parsed.colorName, description = row.description.trim();

    let product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===refNo);
    if(!product){
      product = {id:uid(), refNo, name:description, price:0, createdAt:todayISO(), createdBy:session.displayName};
      state.products.push(product);
      productsChanged = true;
    } else if(description && !product.name){
      product.name = description; productsChanged = true;
    }

    let variant = state.variants.find(v=>v.productId===product.id && v.colorName===colorName);
    if(!variant){
      const existingV = variantsFor(product.id);
      const colorOrder = existingV.length ? Math.max(...existingV.map(v=>v.colorOrder))+1 : 1;
      variant = {id:uid(), productId:product.id, colorName, colorOrder, image:row.processedImage, createdAt:todayISO(), createdBy:session.displayName};
      state.variants.push(variant);
      totalVariants++;
    } else {
      variant.image = row.processedImage;
    }
    variantsToSave.push(variant);

    const matches = state.warehouseItems.filter(w=> String(w.refNo||'').trim().toUpperCase()===refNo && (w.colorName||'').trim().toUpperCase()===colorName);
    for(const w of matches){
      let sku = state.skus.find(s=>s.barcode===w.barcode);
      if(!sku){
        const existingS = skusFor(variant.id);
        const sizeOrder = existingS.length ? Math.max(...existingS.map(s=>s.sizeOrder))+1 : 1;
        const num = sizeNumberOnly(w.sizeLabel);
        const matchedSize = SIZES.find(s=>s.code===num);
        sku = {id:uid(), variantId:variant.id, sizeCode: matchedSize?matchedSize.code:null, sizeOrder, euSize: matchedSize?matchedSize.eu:null, customSizeLabel: matchedSize?'':(w.sizeLabel||''), barcode:w.barcode, createdAt:todayISO()};
        state.skus.push(sku);
        skusChanged = true;
        totalLinked++;
      }
    }
  }

  if(productsChanged) await saveKey('catalogProducts', state.products);
  for(const v of variantsToSave) await saveKey('catalogVariant:'+v.id, v);
  if(skusChanged) await saveKey('catalogSkus', state.skus);

  state.bulkImageRunning = false;
  state.modalMode = null;
  render();
  showToast(`${rows.length} görsel işlendi — ${totalVariants} yeni renk, ${totalLinked} beden kataloğa bağlandı`);
}
function isBarcodeInCatalog(barcode){
  return state.skus.some(s=>s.barcode===barcode);
}
async function ensureCatalogSkuAndBarcode(refNo, refName, colorName, sizeCode){
  let product = state.products.find(p=>padRef(p.refNo)===padRef(refNo));
  if(!product){
    product = {id:uid(), refNo:String(refNo).replace(/[^0-9]/g,''), name:(refName||'').trim(), price:0, createdAt:todayISO(), createdBy:session.displayName};
    state.products = [...state.products, product];
    await saveKey('catalogProducts', state.products);
  }
  let variant = state.variants.find(v=>v.productId===product.id && v.colorName===colorName);
  if(!variant){
    const existingV = variantsFor(product.id);
    if(existingV.length >= MAX_COLORS_PER_MODEL){ return {error:'Bu modelde en fazla ' + MAX_COLORS_PER_MODEL + ' renk olabilir'}; }
    const colorOrder = existingV.length ? Math.max(...existingV.map(v=>v.colorOrder))+1 : 1;
    variant = {id:uid(), productId:product.id, colorName, colorOrder, image:null, createdAt:todayISO(), createdBy:session.displayName};
    state.variants = [...state.variants, variant];
    await saveKey('catalogVariant:'+variant.id, variant);
  }
  let sku = state.skus.find(s=>s.variantId===variant.id && s.sizeCode===sizeCode);
  if(!sku){
    const existingS = skusFor(variant.id);
    if(existingS.length >= MAX_SIZES_PER_COLOR){ return {error:'Bu renkte en fazla ' + MAX_SIZES_PER_COLOR + ' beden olabilir'}; }
    const sizeOrder = existingS.length ? Math.max(...existingS.map(s=>s.sizeOrder))+1 : 1;
    const sizeInfo = SIZES.find(s=>s.code===sizeCode);
    const barcode = computeBarcode(product.refNo, variant.colorOrder, sizeOrder);
    sku = {id:uid(), variantId:variant.id, sizeCode, sizeOrder, euSize:sizeInfo.eu, barcode, createdAt:todayISO()};
    state.skus = [...state.skus, sku];
    await saveKey('catalogSkus', state.skus);
  }
  return {barcode: sku.barcode};
}

async function submitNewDepoItem(){
  const refNo = document.getElementById('ndi-ref').value.trim();
  const refName = document.getElementById('ndi-refname').value.trim();
  const colorName = document.getElementById('ndi-color').value.trim().toUpperCase();
  const sizeCode = document.getElementById('ndi-size').value;
  const startQty = parseInt(document.getElementById('ndi-qty').value, 10) || 0;
  if(!/^[0-9]{1,6}$/.test(refNo)){ showToast('Referans No 1-6 haneli bir sayı olmalı'); return; }
  if(!colorName){ showToast('Renk adı girin'); return; }
  const r = await ensureCatalogSkuAndBarcode(refNo, refName, colorName, sizeCode);
  if(r.error){ showToast(r.error); return; }
  const sizeLabel = SIZES.find(s=>s.code===sizeCode).short;
  const existing = state.warehouseItems.find(w=>w.barcode===r.barcode);
  if(existing && (existing.refNo && existing.refNo!==refNo || existing.colorName && existing.colorName.toUpperCase()!==colorName)){
    showToast('⚠ Bu barkod zaten "' + existing.refNo + ' ' + existing.colorName + '" ürününe kayıtlı — çakışma var, kontrol edin');
    return;
  }
  if(startQty > 0){
    await postStockMovement(r.barcode, 'in', startQty, 'İlk depo kaydı', refNo, colorName, sizeLabel);
  } else if(!state.warehouseItems.find(w=>w.barcode===r.barcode)){
    state.warehouseItems.push({barcode:r.barcode, refNo, colorName, sizeLabel, stock:0});
  }
  state.modalMode = null;
  render();
  showToast('Depo kaydı oluşturuldu — Barkod: ' + r.barcode);
}

function handleScanBarcodeKey(e){
  if(e.key !== 'Enter') return;
  const barcode = e.target.value.trim();
  if(!barcode) return;
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  if(!item){
    e.target.value = '';
    state.scan.barcode = barcode;
    state.scan.stage = 'unknown';
    render();
    setTimeout(()=>{ const el=document.getElementById('scan-new-ref'); if(el) el.focus(); }, 60);

  if(state.scan.rapidMode){

  } else {
    state.scan.barcode = barcode;

    state.scan.stage = 'qty';
    render();
    setTimeout(()=>{ const el=document.getElementById('scan-qty'); if(el){ el.focus(); el.select(); } }, 60);
  }

  }
}

// Queue a scan for background processing — returns immediately so the operator can keep scanning
// without waiting for the server round-trip. Each entry shows its own pending/ok/error status.
function queueScan(item, qty){
  const mode = state.scan.mode;
  const entry = {
    id: uid(), barcode: item.barcode, refNo: item.refNo, colorName: item.colorName, sizeLabel: item.sizeLabel,
    qty, mode, status: 'pending'
  };
  state.scan.sessionLog.unshift(entry);
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 0);
  processQueuedScan(entry);
}
async function processQueuedScan(entry){
  const r = await postStockMovement(entry.barcode, entry.mode, entry.qty, 'Hızlı tarama', entry.refNo, entry.colorName, entry.sizeLabel);
  if(r.ok){
    entry.status = 'ok';
    entry.stock = r.stock;
  } else {
    entry.status = 'error';
    entry.errorMsg = r.networkError ? 'Bağlantı hatası' : 'Kaydedilemedi';
  }
  render();
}
function retryQueuedScan(entryId){
  const entry = state.scan.sessionLog.find(x=>x.id===entryId);
  if(!entry) return;
  entry.status = 'pending';
  render();
  processQueuedScan(entry);
}
async function submitScanMovement(qty){
  const item = state.scan.item, mode = state.scan.mode;
  state.scan.stage = 'pending';
  state.scan.lastResult = { ok:true, text: `⏳ ${detailRefLabel(item.refNo,item.colorName,item.sizeLabel)} kaydediliyor…`, pending:true };
  render();
  const r = await postStockMovement(item.barcode, mode, qty, 'Hızlı tarama', item.refNo, item.colorName, item.sizeLabel);
  if(r.ok){
    state.scan.sessionLog.unshift({id:uid(), barcode:item.barcode, refNo:item.refNo, colorName:item.colorName, sizeLabel:item.sizeLabel, qty, mode, status:'ok', stock:r.stock});
    state.scan.lastResult = { ok:true, text: `✓ ${detailRefLabel(item.refNo,item.colorName,item.sizeLabel)} — ${mode==='out'?'Çıkış':'Giriş'} ${qty} kaydedildi (Yeni stok: ${r.stock})` };
  } else {
    state.scan.lastResult = { ok:false, text: r.networkError ? '⚠ Sunucuya bağlanılamadı — kaydedilmedi, tekrar deneyin' : '⚠ Kaydedilemedi, tekrar deneyin' };
  }
  state.scan.stage = 'scan'; state.scan.barcode=''; state.scan.item=null;
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 60);
}

// ---------- CSV export ----------
function exportBarcodeListCSV(){
  const header = ['Referans No','Model Adı','Renk','Beden','EU Beden','Barkod','Stok','Fiyat (USD)'];
  const rows = [];
  const sortedProducts = [...state.products].sort((a,b)=>padRef(a.refNo).localeCompare(padRef(b.refNo)));
  for(const p of sortedProducts){
    for(const v of variantsFor(p.id)){
      for(const s of skusFor(v.id)){
        const sizeInfo = SIZES.find(x=>x.code===s.sizeCode);
        rows.push([p.refNo, p.name||'', v.colorName, sizeInfo?sizeInfo.short:(s.customSizeLabel||s.sizeCode||''), sizeInfo?sizeInfo.eu:'', s.barcode, s.stock, p.price||0]);
      }
    }
  }
  if(rows.length===0){ showToast('Henüz barkod kaydı yok'); return; }
  const csv = [header, ...rows].map(r=>r.map(csvField).join(',')).join('\n');
  downloadBlob('barkod-listesi.csv', 'text/csv;charset=utf-8', '\uFEFF' + csv);
  showToast('Barkod listesi indirildi');
}

const TR_PDF_MAP = {'İ':'I','ı':'i','Ğ':'G','ğ':'g','Ş':'S','ş':'s','Ç':'C','ç':'c','Ö':'O','ö':'o','Ü':'U','ü':'u'};
function trPdf(str){
  if(str==null) return '';
  return String(str).replace(/[İığĞşŞçÇöÖüÜ]/g, ch => TR_PDF_MAP[ch] !== undefined ? TR_PDF_MAP[ch] : ch);
}
function loadImageNaturalSize(dataUrl){
  return new Promise(resolve=>{
    if(!dataUrl){ resolve({w:1,h:1}); return; }
    const img = new Image();
    img.onload = function(){ resolve({w:img.naturalWidth||1, h:img.naturalHeight||1}); };
    img.onerror = function(){ resolve({w:1,h:1}); };
    img.src = dataUrl;
  });
}
