// Draws the system logo in the top-right corner of the current page (page 1 only, by convention).
async function addPdfLogo(doc, pageW, margin){
  if(!state.logo) return;
  try{
    const size = await loadImageNaturalSize(state.logo);
    const ratio = size.w / size.h;
    let h = 10, w = 10*ratio;
    if(w > 28){ w = 28; h = 28/ratio; }
    doc.addImage(state.logo, 'PNG', pageW-margin-w, margin-4, w, h);
  }catch(e){ /* logo is cosmetic — skip on failure */ }
}
// Adds the WhatsApp/email contact footer to every page of the document. Call this LAST, after
// all content (and any doc.addPage() calls) are done.
function addPdfFooterToAllPages(doc, pageW, pageH, margin){
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    const y = pageH - 12;
    doc.setDrawColor(225,220,205); doc.setLineWidth(0.3);
    doc.line(margin, y-5, pageW-margin, y-5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,140,120);
    doc.text('WhatsApp ' + PDF_CONTACT_PHONE, pageW/2 - 3, y, {align:'right'});
    doc.setTextColor(190,185,170);
    doc.text('  ·  ', pageW/2, y, {align:'center'});
    doc.setTextColor(150,140,120);
    doc.text(PDF_CONTACT_EMAIL, pageW/2 + 3, y, {align:'left'});
    doc.setTextColor(0,0,0);
  }
}

async function generateCatalogPDF(scopeProductId, showPrice, title, currency, rate){
  if(!window.jspdf){ showToast('PDF kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageW = 210, pageH = 297, margin = 14;
  const cols = 4, gapX = 5, gapY = 8;
  const colWidth = (pageW - margin*2 - gapX*(cols-1)) / cols;
  const imgBoxH = 36;
  const cardH = 44;
  const headerBandH = 16;

  const productsToShow = scopeProductId ? state.products.filter(p=>p.id===scopeProductId) : state.products;
  const sortedProducts = [...productsToShow].sort((a,b)=>padRef(a.refNo).localeCompare(padRef(b.refNo)));

  const allVariants = [];
  sortedProducts.forEach(p=> variantsFor(p.id).forEach(v=> allVariants.push(v)));
  if(allVariants.length===0){ showToast('Gösterilecek renk/görsel yok'); return; }

  showToast('PDF hazırlanıyor…');
  const sizeMap = {};
  await Promise.all(allVariants.map(async v=>{ sizeMap[v.id] = await loadImageNaturalSize(v.image); }));
  await addPdfLogo(doc, pageW, margin);

  let y = margin;
  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text(title, margin, y+4);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120,120,120);
  doc.text(new Date().toLocaleDateString('tr-TR'), pageW-margin, y+12, {align:'right'});
  doc.setTextColor(0,0,0);
  y += 20;

  function ensureSpace(h){
    if(y + h > pageH - margin){ doc.addPage(); y = margin; return true; }
    return false;
  }

  for(const p of sortedProducts){
    const vs = variantsFor(p.id);
    if(vs.length===0) continue;
    ensureSpace(headerBandH + cardH + gapY);

    const sizeCodes = new Set();
    vs.forEach(v=> skusFor(v.id).forEach(s=> sizeCodes.add(s.sizeCode ? s.sizeCode : ('custom:'+(s.customSizeLabel||''))) ));
    const sizesLabel = Array.from(sizeCodes).sort().map(c=>{
      if(String(c).indexOf('custom:')===0) return c.slice(7);
      const si = SIZES.find(x=>x.code===c); return si ? si.eng : c;
    }).join('   ·   ');

    doc.setFillColor(241,236,221);
    doc.rect(margin, y, pageW - margin*2, headerBandH, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(35,44,42);
    doc.text('Ref: ' + p.refNo + (p.name ? '   —   ' + trPdf(p.name) : ''), margin+3, y+6.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90,90,90);
    doc.text(sizesLabel || 'No size defined', margin+3, y+12.5);
    if(showPrice){
      const priceUsd = p.price || 0;
      const priceVal = currency==='TRY' ? (priceUsd*(rate||0)) : priceUsd;
      const priceLabel = currency==='TRY' ? (formatMoney(priceVal)+' TL') : ('$'+formatMoney(priceVal));
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(35,44,42);
      doc.text(priceLabel, pageW-margin-3, y+9, {align:'right'});
    }
    doc.setTextColor(0,0,0);
    y += headerBandH + 5;

    let col = 0, x = margin;
    for(const v of vs){
      if(col===0 && (y + cardH > pageH - margin)){
        doc.addPage(); y = margin; col = 0; x = margin;
      }
      doc.setDrawColor(227,220,201);
      doc.rect(x, y, colWidth, imgBoxH);
      if(v.image){
        const nat = sizeMap[v.id] || {w:1,h:1};
        const scale = Math.min(colWidth/nat.w, imgBoxH/nat.h) * 0.7; // 30% smaller than the box would otherwise allow
        const iw = nat.w*scale, ih = nat.h*scale;
        const ix = x + (colWidth-iw)/2, iy = y + (imgBoxH-ih)/2;
        try{ doc.addImage(v.image, 'JPEG', ix, iy, iw, ih, undefined, 'FAST'); }catch(e){}
      }
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(35,44,42);
      doc.text(v.colorName || '', x + colWidth/2, y + imgBoxH + 5, {align:'center'});
      doc.setTextColor(0,0,0);

      if(col < cols-1){ col++; x += colWidth + gapX; }
      else { col = 0; x = margin; y += cardH + gapY; }
    }
    if(col !== 0){ y += cardH + gapY; }
    y += 4;
  }

  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text(String(i) + ' / ' + pageCount, pageW/2, pageH-8, {align:'center'});
  }
  addPdfFooterToAllPages(doc, pageW, pageH, margin);

  const curSuffix = currency==='TRY' ? '-TL' : '-USD';
  doc.save((scopeProductId ? 'katalog-tek-model' : 'katalog') + (showPrice ? curSuffix+'-fiyatli' : '') + '.pdf');
  showToast('PDF oluşturuldu');
}

// ---------- Üretim Listesi (aggregated production shortages across all approved orders) ----------
function renderProductionListView(){
  const grouped = {};
  state.orders.filter(o=>o.status==='approved' && o.productionShortages && o.productionShortages.length>0).forEach(o=>{
    o.productionShortages.forEach(s=>{
      const key = s.refNo+'::'+s.colorName+'::'+s.sizeLabel;
      if(!grouped[key]) grouped[key] = {refNo:s.refNo, colorName:s.colorName, sizeLabel:s.sizeLabel, totalShort:0, orders:[]};
      grouped[key].totalShort += s.shortBy;
      grouped[key].orders.push(o.orderNo);
    });
  });
  const rows = Object.values(grouped).sort((a,b)=> a.refNo.localeCompare(b.refNo) || a.colorName.localeCompare(b.colorName));

  let out = `<button class="btn ghost small" style="margin-bottom:14px" onclick="state.view='orders';render();">← Siparişlere Dön</button>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
    <h2 style="font-family:'Fraunces',serif;margin:0">Üretim Listesi</h2>
    ${rows.length>0 ? `<button class="btn ghost small" onclick="printProductionList()">🖨 PDF</button> <button class="btn ghost small" onclick="downloadProductionListExcel()">📊 Excel</button>` : ''}
  </div>
  <p style="color:var(--muted);font-size:13px;margin:0 0 16px">Onaylanmış (henüz sevk edilmemiş) siparişlerde stokta olmayan, üretilmesi gereken ürünler.</p>`;

  if(rows.length===0){
    out += `<div class="empty"><h3>Üretim listesi boş</h3><p>Şu anda stok yetersizliğinden dolayı üretim bekleyen bir ürün yok.</p></div>`;
  } else {
    out += `<div class="depo-table-wrap"><table class="depo-table" style="min-width:600px">
      <thead><tr><th>Referans</th><th>Renk</th><th>Beden</th><th>Üretilmesi Gereken</th><th>İlgili Siparişler</th></tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td style="font-weight:700">${esc(r.refNo)}</td>
        <td>${esc(r.colorName)}</td>
        <td>${esc(r.sizeLabel)}</td>
        <td><span class="chip other" style="background:var(--danger-bg);color:var(--danger)">${r.totalShort} ${esc(unitForRefNo(r.refNo))}</span></td>
        <td class="depo-td-muted" style="font-size:11.5px">${r.orders.join(', ')}</td>
      </tr>`).join('')}
      </tbody>
    </table></div>`;
  }
  return out;
}

function orderActionSelectHTML(o){
  if(o.status==='returned' || o.status==='cancelled') return '';
  const options = [];
  if(o.status==='draft'){
    options.push('<option value="approve">✓ Onayla</option>');
    options.push('<option value="cancel">✕ İptal Et</option>');
  } else if(o.status==='approved'){
    options.push('<option value="pack">📦 Depoda Hazırlanıyor (Detaya Git)</option>');
    options.push('<option value="cancel">✕ İptal Et</option>');
  } else if(o.status==='packed'){
    options.push('<option value="deliver">✓ Teslim Edildi Olarak İşaretle</option>');
  } else if(o.status==='delivered'){
    options.push('<option value="return">↩ İade Al</option>');
  }
  return `<select onchange="handleOrderStatusAction('${o.id}', this.value); this.value='';" style="font-size:12px;padding:4px 6px;border:1.5px solid var(--line);border-radius:3px" onclick="event.stopPropagation()">
    <option value="">Durum Değiştir…</option>
    ${options.join('')}
  </select>`;
}
function handleOrderStatusAction(orderId, action){
  if(!action) return;
  if(action==='approve') approveOrderAction(orderId);
  else if(action==='cancel') cancelOrderAction(orderId);
  else if(action==='pack'){ state.selectedOrderId=orderId; state.view='orderDetail'; render(); }
  else if(action==='deliver') deliverOrderAction(orderId);
  else if(action==='return') returnOrderAction(orderId);
}
async function deliverOrderAction(orderId){
  if(!confirm('Bu siparişin müşteriye teslim edildiğini onaylıyor musunuz? Tarih ve saat otomatik kaydedilecek.')) return;
  showToast('Kaydediliyor…');
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'deliverOrder', auth:{username:session.username, passwordHash:session.passwordHash}, orderId, deliveredBy: session.displayName})
    }, 20000);
    const data = await res.json();
    if(data && data.ok){
      await refreshData();
      showToast('Teslim edildi olarak işaretlendi');
    } else {
      showToast('Kaydedilemedi — tekrar deneyin');
    }
  }catch(e){ showToast('Sunucuya bağlanılamadı'); }
}
function returnOrderAction(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  state.returnOrderId = orderId;
  state.returnQty = {};
  (order.lines||[]).forEach(l=>{
    const remaining = l.qty - orderReturnedQty(order, l.barcode);
    if(remaining>0) state.returnQty[l.barcode] = remaining; // default: return everything still returnable
  });
  state.modalMode = 'returnOrder';
  render();
}
function setReturnQty(barcode, value, max){
  const v = Math.max(0, Math.min(max, parseInt(value,10)||0));
  state.returnQty[barcode] = v;
  render();
}
async function submitReturnOrder(){
  const orderId = state.returnOrderId;
  const returnLines = Object.keys(state.returnQty).filter(bc=>state.returnQty[bc]>0).map(bc=>({barcode:bc, qty:state.returnQty[bc]}));
  if(returnLines.length===0){ showToast('İade edilecek en az bir üründe adet girin'); return; }
  const totalQty = returnLines.reduce((s,l)=>s+l.qty,0);
  if(!confirm(`${totalQty} adet ürünü iade almak istediğinize emin misiniz?\n\nStok depoya geri eklenecek. Tüm ürünler iade alınırsa sipariş "İade Edildi" olarak işaretlenir, kısmi iadede sipariş "Teslim Edildi" olarak kalır ama bakiyeden düşülür.`)) return;
  state.modalMode = null;
  render();
  showToast('İade işleniyor…');
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'returnOrder', auth:{username:session.username, passwordHash:session.passwordHash}, orderId, returnLines, returnedBy: session.displayName})
    }, 30000);
    const data = await res.json();
    if(data && data.ok){
      await refreshData();
      showToast(data.order && data.order.status==='returned' ? 'Sipariş tamamen iade alındı' : 'Kısmi iade kaydedildi, stok depoya eklendi');
    } else {
      showToast('İade işlenemedi' + (data && data.error ? (' — ' + data.error) : ' — tekrar deneyin'));
    }
  }catch(e){ showToast('Sunucuya bağlanılamadı'); }
  render();
}
function toggleOrderSelect(id){
  if(state.selectedOrderIds.has(id)) state.selectedOrderIds.delete(id); else state.selectedOrderIds.add(id);
  render();
}
function toggleAllOrderSelect(visibleIds){
  const allSelected = visibleIds.length>0 && visibleIds.every(id=>state.selectedOrderIds.has(id));
  if(allSelected) visibleIds.forEach(id=>state.selectedOrderIds.delete(id));
  else visibleIds.forEach(id=>state.selectedOrderIds.add(id));
  render();
}
async function deleteSelectedOrders(){
  const ids = Array.from(state.selectedOrderIds);
  if(ids.length===0) return;
  if(!confirm(`${ids.length} siparişi silmek istediğinize emin misiniz?\n\nOnaylanmış (rezerve edilmiş) veya hazırlanmış (stok düşülmüş) siparişlerde stok otomatik olarak depoya iade edilir. Teslim edilmiş siparişler silinemez — onlar için "İade Al" kullanın.`)) return;
  showToast('Siliniyor…');
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'bulkDeleteOrders', auth:{username:session.username, passwordHash:session.passwordHash}, orderIds: ids, deletedBy: session.displayName})
    }, 30000);
    const data = await res.json();
    if(data && data.ok){
      state.selectedOrderIds = new Set();
      await refreshData();
      let msg = `${data.deleted} sipariş silindi.`;
      if(data.blocked && data.blocked.length>0) msg += ` ${data.blocked.length} sipariş teslim edilmiş olduğu için silinemedi (önce iade alın): ${data.blocked.join(', ')}`;
      showToast(msg);
    } else {
      showToast('Silinemedi — tekrar deneyin');
    }
  }catch(e){ showToast('Sunucuya bağlanılamadı'); }
}
function renderOrdersListView(){
  const filter = state.orderListFilter;
  const filtered = state.orders.filter(o=>{
    if(filter==='all') return true;
    if(filter==='active') return o.status==='draft' || o.status==='approved' || o.status==='packed';
    return o.status===filter;
  }).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

  const selectedCount = state.selectedOrderIds.size;

  const allSelected = visibleIds.length>0 && visibleIds.every(id=>state.selectedOrderIds.has(id));

  let out = `<div class="toolbar">
    <select onchange="state.orderListFilter=this.value;render()">
      <option value="active" ${filter==='active'?'selected':''}>Aktif (Taslak + Onaylı + Hazırlanan)</option>

    <div class="count">${filtered.length} sipariş</div>
  </div>`;

  if(filtered.length===0){
    out += `<div class="empty"><h3>Sipariş yok</h3><p>"+ Yeni Sipariş" ile ilk siparişinizi oluşturun.</p></div>`;
  } else {
    const cols = '26px 95px 90px 1fr 110px 90px 90px 110px 150px';
    out += `<div class="depo-table-wrap"><table class="depo-table" style="--depo-cols:${cols}">

      </tr></thead>
      <tbody>
      ${filtered.map(o=>{
        const c = customerById(o.customerId);
        const hasShortage = o.status==='approved' && o.productionShortages && o.productionShortages.length>0;
        return `<tr>
          <td><input type="checkbox" ${state.selectedOrderIds.has(o.id)?'checked':''} onchange="toggleOrderSelect('${o.id}')" /></td>

          <td>${orderTotalQty(o)} ${esc(orderPrimaryUnit(o))}</td>

            ${orderActionSelectHTML(o)}
            <button class="btn small ghost" onclick="downloadOrderProforma('${o.id}')">Yazdır</button>
            ${c ? `<a class="btn small ghost" href="musteri-merkezi.html?customer=${encodeURIComponent(c.id)}" target="_blank" rel="noopener" style="text-decoration:none">Müşteriye Git</a>` : ''}
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`;
  }
  return out;
}
function fmtDateOrder(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('tr-TR');
}
function fmtDateTimeOrder(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
}

// ---------- Proforma PDF ----------
async function buildOrderProformaPDF(order){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageW = 210, pageH = 297, margin = 14;
  await addPdfLogo(doc, pageW, margin);
  const c = customerById(order.customerId);

  // Group by MODEL first, then by COLOR within — one visual row-block per model, colors as columns.
  const byRef = {};
  order.lines.forEach(l=>{
    if(!byRef[l.refNo]) byRef[l.refNo] = { refNo:l.refNo, unitPrice:l.unitPrice, unit:unitForRefNo(l.refNo), colors:{} };
    if(!byRef[l.refNo].colors[l.colorName]) byRef[l.refNo].colors[l.colorName] = { colorName:l.colorName, sizes:[] };
    byRef[l.refNo].colors[l.colorName].sizes.push({sizeLabel:l.sizeLabel, qty:l.qty});
  });
  const modelRows = Object.values(byRef).map(m=>({
    ...m,
    colors: Object.values(m.colors).sort((a,b)=>a.colorName.localeCompare(b.colorName)).map(c=>({...c, sizes:[...c.sizes].sort(naturalSizeSort)}))
  })).sort((a,b)=>padRef(a.refNo).localeCompare(padRef(b.refNo)));

  let y = margin;
  // Header: title + order number/date only — no customer info crammed in here.
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('PROFORMA INVOICE', margin, y+3);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90,90,90);
  doc.text('No: ' + (order.orderNo||''), pageW-margin, y+9, {align:'right'});
  doc.setFont('helvetica','normal');
  doc.text('Date: ' + fmtDateOrder(order.createdAt), pageW-margin, y+13.5, {align:'right'});
  doc.setTextColor(0,0,0);
  y += 18;
  doc.setDrawColor(30,30,30); doc.setLineWidth(0.5); doc.line(margin, y, pageW-margin, y); doc.setLineWidth(0.2);
  y += 6;

  // Customer block — separate, compact, "Bill To" style.
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(130,130,130);
  doc.text('BILL TO', margin, y); y += 4;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0,0,0);
  doc.text(trPdf(customerName(c)), margin, y); y += 4.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90,90,90);
  if(c && c.firma && c.adSoyad){ doc.text(trPdf(c.firma), margin, y); y += 4; }
  if(c && c.country){ doc.text(trPdf(c.country), margin, y); y += 4; }
  doc.setTextColor(0,0,0);
  y += 4;

  doc.setDrawColor(200,200,200); doc.line(margin, y, pageW-margin, y); y += 6;

  // Compact table header
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(130,130,130);
  doc.text('MODEL / COLORS', margin, y);
  doc.text('QTY', pageW-margin-42, y, {align:'right'});
  doc.text('UNIT PRICE', pageW-margin-22, y, {align:'right'});
  doc.text('AMOUNT', pageW-margin, y, {align:'right'});
  doc.setTextColor(0,0,0);
  y += 3;
  doc.setDrawColor(220,220,220); doc.line(margin, y, pageW-margin, y);
  y += 5;

  const colBoxW = 40;
  const colsPerRow = Math.max(1, Math.floor((pageW - margin*2) / colBoxW));
  for(const m of modelRows){
    const totalQty = m.colors.reduce((s,cl)=>s+cl.sizes.reduce((s2,x)=>s2+x.qty,0),0);
    const lineTotal = totalQty * m.unitPrice;

    const colorBlocks = m.colors.map(cl=>{
      const sizeText = cl.sizes.map(s=>`${s.sizeLabel}:${s.qty}`).join('  ');
      const lines = doc.splitTextToSize(sizeText, colBoxW-4);
      return {...cl, lines};
    });
    const colorRows = [];
    for(let i=0;i<colorBlocks.length;i+=colsPerRow) colorRows.push(colorBlocks.slice(i,i+colsPerRow));

    let neededH = 7;
    colorRows.forEach(row=>{ neededH += 4 + Math.max(...row.map(cb=>cb.lines.length))*3.2 + 2; });

    if(y + neededH > pageH - 55){ doc.addPage(); y = margin; }

    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(0,0,0);
    doc.text(`Ref: ${m.refNo}`, margin, y+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(`${totalQty} ${m.unit}`, pageW-margin-42, y+4, {align:'right'});
    doc.text(`$${formatMoney(m.unitPrice)}`, pageW-margin-22, y+4, {align:'right'});
    doc.setFont('helvetica','bold');
    doc.text(`$${formatMoney(lineTotal)}`, pageW-margin, y+4, {align:'right'});
    y += 6;

    colorRows.forEach(row=>{
      let x = margin;
      const maxLines = Math.max(...row.map(cb=>cb.lines.length));
      row.forEach(cb=>{
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(35,44,42);
        doc.text(trPdf(cb.colorName), x, y+3);
        doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(110,110,110);
        cb.lines.forEach((line,li)=> doc.text(line, x, y+3+3.2*(li+1)));
        doc.setTextColor(0,0,0);
        x += colBoxW;
      });
      y += 4 + maxLines*3.2 + 2;
    });

    y += 1;
    doc.setDrawColor(235,235,235); doc.line(margin, y, pageW-margin, y);
    y += 4;
  }

  y += 2;
  doc.setDrawColor(30,30,30); doc.setLineWidth(0.5); doc.line(margin, y, pageW-margin, y); doc.setLineWidth(0.2);
  y += 7;

  const subtotal = orderLineSubtotal(order);
  const discountAmt = orderDiscountAmount(order);
  const total = orderTotal(order);
  const balance = orderBalance(order);
  function totalsRow(label, value, bold){
    doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(bold?10:8.5);
    doc.text(label, pageW-margin-55, y);
    doc.text(value, pageW-margin, y, {align:'right'});
    y += bold ? 6 : 5;
  }
  totalsRow('Total Quantity', orderQtyByUnit(order), false);
  totalsRow('Subtotal', '$'+formatMoney(subtotal), false);
  if(discountAmt>0) totalsRow('Discount', '−$'+formatMoney(discountAmt), false);
  totalsRow('Total', '$'+formatMoney(total), true);
  if((Number(order.deposit)||0)>0) totalsRow('Deposit Paid', '−$'+formatMoney(order.deposit), false);
  totalsRow('Balance Due', '$'+formatMoney(balance), true);

  if(order.notes){
    y += 5;
    doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(110,110,110);
    doc.text('Note: ' + trPdf(order.notes), margin, y, {maxWidth: pageW-margin*2});
  }

  addPdfFooterToAllPages(doc, pageW, pageH, margin);
  return doc;
}
function computeProductionListRows(){
  const grouped = {};
  state.orders.filter(o=>o.status==='approved' && o.productionShortages && o.productionShortages.length>0).forEach(o=>{
    o.productionShortages.forEach(s=>{
      const key = s.refNo+'::'+s.colorName+'::'+s.sizeLabel;
      if(!grouped[key]) grouped[key] = {refNo:s.refNo, colorName:s.colorName, sizeLabel:s.sizeLabel, totalShort:0, orders:[]};
      grouped[key].totalShort += s.shortBy;
      grouped[key].orders.push(o.orderNo);
    });
  });
  return Object.values(grouped).sort((a,b)=> a.refNo.localeCompare(b.refNo) || a.colorName.localeCompare(b.colorName));
}

    ['Customer', customerName(c)], [],
    ['Ref', 'Colors (color: sizes)', 'Total Qty', 'Unit', 'Unit Price', 'Line Total']
  ];
  modelRows.forEach(m=>{
    const totalQty = m.colors.reduce((s,cl)=>s+cl.sizes.reduce((s2,x)=>s2+x.qty,0),0);
    const colorsText = m.colors.map(cl=> cl.colorName + ': ' + cl.sizes.map(s=>`${s.sizeLabel}:${s.qty}`).join(', ')).join('\n');
    rows.push([m.refNo, colorsText, totalQty, m.unit, m.unitPrice, totalQty*m.unitPrice]);
  });
  const subtotal = orderLineSubtotal(order), discountAmt = orderDiscountAmount(order), total = orderTotal(order), returned = orderReturnedAmount(order), balance = orderBalance(order);
  rows.push([]);
  rows.push(['', '', '', '', 'Subtotal', subtotal]);
  if(discountAmt>0) rows.push(['', '', '', '', 'Discount', -discountAmt]);
  rows.push(['', '', '', '', 'Total', total]);
  if((Number(order.deposit)||0)>0) rows.push(['', '', '', '', 'Deposit Paid', -order.deposit]);
  if(returned>0) rows.push(['', '', '', '', 'Returned', -returned]);
  rows.push(['', '', '', '', 'Balance Due', balance]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:40},{wch:10},{wch:8},{wch:12},{wch:12}];
  Object.keys(ws).forEach(cell=>{ if(cell[0]==='B' && ws[cell].v && String(ws[cell].v).indexOf('\n')>-1){ ws[cell].s = {alignment:{wrapText:true}}; } });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Proforma');
  XLSX.writeFile(wb, `Proforma-${order.orderNo}.xlsx`);
}
async function shareOrderProforma(orderId, channel){
  const order = state.orders.find(o=>o.id===orderId);
  const c = customerById(order.customerId);
  if(!order || !c) return;
  await downloadOrderProforma(orderId);
  const msg = encodeURIComponent(`Merhaba ${c.adSoyad||c.firma||''}, ${order.orderNo} numaralı proforma faturanız hazır. Az önce indirdiğim PDF dosyasını bu sohbete ekliyorum.`);
  showToast('PDF indirildi — sohbete elle ekleyin');
  if(channel==='wa'){
    const wa = digitsOnly(c.phone);
    if(wa) window.open('https://wa.me/'+wa+'?text='+msg, '_blank');
  } else if(channel==='tg'){
    const tgU = (c.telegram||'').replace('@','').trim();
    if(tgU) window.open('https://t.me/'+encodeURIComponent(tgU), '_blank');
  } else if(channel==='email'){
    if(c.email) window.location.href = 'mailto:'+c.email+'?subject='+encodeURIComponent('Proforma Fatura — '+order.orderNo)+'&body='+msg;
  }
}

async function handleSingleVariantImage(e, refNo, colorName){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  showToast('Resim işleniyor…', true);
  try{
    const processed = await processImageFile(file);
    const repItem = state.warehouseItems.find(w=>orderGroupKey(w.refNo,w.colorName)===orderGroupKey(refNo,colorName));
    const {variantId} = await ensureCatalogEntryForExistingBarcode(repItem?repItem.barcode:uid(), refNo, colorName, repItem?repItem.sizeLabel:'');
    const variant = state.variants.find(v=>v.id===variantId);
    variant.image = processed;
    await saveKey('catalogVariant:'+variantId, variant);
    render();
    showToast('Resim kaydedildi');
  }catch(err){
    showToast('Resim işlenemedi — lütfen başka bir dosya deneyin');
  }
}

function catalogGalleryEntries(){
  // One entry per Ref+Renk that actually has a Depo stock record — this is deliberately driven
  // by Depo, not the catalog structure, so the gallery only ever shows real, stocked items.
  const map = {};
  state.warehouseItems.forEach(w=>{
    if(!w.refNo || !w.colorName) return;
    const key = orderGroupKey(w.refNo, w.colorName);
    if(!map[key]) map[key] = {refNo:w.refNo, colorName:w.colorName, image:null};
  });
  // Pull in the image from the matching catalog variant, if one's been linked.
  Object.values(map).forEach(entry=>{
    const product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(entry.refNo).trim().toUpperCase());
    const variant = product ? state.variants.find(v=>v.productId===product.id && v.colorName===entry.colorName) : null;
    entry.image = variant ? variant.image : null;
    entry.variantId = variant ? variant.id : null;
    entry.productId = product ? product.id : null;
  });
  return Object.values(map).sort((a,b)=> padRef(a.refNo).localeCompare(padRef(b.refNo)) || a.colorName.localeCompare(b.colorName));
}

            ${skus.length===0 ? `<div style="font-size:11.5px;color:var(--muted);padding:6px 0">Henüz beden eklenmedi</div>` : skus.map(s=>{
              const sizeInfo = SIZES.find(x=>x.code===s.sizeCode);
              const stk = stockForBarcode(s.barcode, s.stock);
              return `<div class="sku-row">
                <div class="sku-label">
                  <div>${esc(sizeInfo?sizeInfo.short:(s.customSizeLabel||s.sizeCode||'—'))}${sizeInfo?` <span style="color:var(--muted)">(EU ${s.euSize})</span>`:''}</div>
                  <div class="barcode">${esc(s.barcode)}</div>
                </div>
                <span class="pc-stock-badge ${stk<=LOW_STOCK_THRESHOLD?'low':''}" style="cursor:pointer" onclick="openDepoForBarcode('${attrEsc(s.barcode)}')" title="Depo'da görüntüle">${stk<=LOW_STOCK_THRESHOLD?'⚠ ':''}${stk}</span>
                <button class="sku-del" onclick="deleteSku('${s.id}')" title="Bedeni sil">✕</button>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  return out;
}

function depoOnlyRefNos(){
  const catalogRefs = new Set(state.products.map(p=>padRef(p.refNo)));
  const seen = new Set();
  const out = [];
  state.warehouseItems.forEach(w=>{
    if(!w.refNo) return;
    const key = padRef(w.refNo);
    if(catalogRefs.has(key) || seen.has(key)) return;
    seen.add(key);
    out.push(w.refNo);
  });
  return out.sort((a,b)=>padRef(a).localeCompare(padRef(b)));
}

const DEPO_PAGE_SIZE = 100;
function renderDepoView(){
  if(!state.fxRate) ensureFxRateLoaded();
  const q = state.depoSearch.trim().toLowerCase();
  let items = [...state.warehouseItems].filter(it=>{
    if(!q) return true;
    return (it.barcode||'').toLowerCase().includes(q) || (it.refNo||'').toLowerCase().includes(q) ||
           (it.colorName||'').toLowerCase().includes(q) || (it.sizeLabel||'').toLowerCase().includes(q);
  });
  switch(state.depoSortBy){
    case 'barcode-asc': items.sort((a,b)=>(a.barcode||'').localeCompare(b.barcode||'')); break;
    case 'barcode-desc': items.sort((a,b)=>(b.barcode||'').localeCompare(a.barcode||'')); break;
    case 'stock-asc': items.sort((a,b)=>(Number(a.stock)||0)-(Number(b.stock)||0)); break;
    case 'stock-desc': items.sort((a,b)=>(Number(b.stock)||0)-(Number(a.stock)||0)); break;
    case 'recent-first': items.sort((a,b)=>(b.lastMovementAt||'').localeCompare(a.lastMovementAt||'')); break;
    case 'oldest-first': items.sort((a,b)=>(a.lastMovementAt||'9999').localeCompare(b.lastMovementAt||'9999')); break;
    case 'ref-asc':
    default: items.sort((a,b)=> (a.refNo||'').localeCompare(b.refNo||'') || (a.colorName||'').localeCompare(b.colorName||''));
  }

  const canManage = session.role !== 'depocu';
  const totalPages = Math.max(1, Math.ceil(items.length / DEPO_PAGE_SIZE));
  if(state.depoPage > totalPages) state.depoPage = totalPages;
  if(state.depoPage < 1) state.depoPage = 1;
  const pageItems = items.slice((state.depoPage-1)*DEPO_PAGE_SIZE, state.depoPage*DEPO_PAGE_SIZE);
  const visibleBarcodes = pageItems.map(it=>it.barcode);
  const allSelected = canManage && visibleBarcodes.length>0 && visibleBarcodes.every(b=>state.depoSelected.has(b));
  const selectedCount = state.depoSelected.size;

  let out = '';
  if(canManage){
    out += `<div class="fx-banner">
      ${state.fxRate ? `💱 <b>1 USD = ${formatMoney(state.fxRate)} ₺</b> ${state.fxRateSource==='TCMB' ? `(TCMB Alış Kuru${state.fxRateDate?', '+esc(state.fxRateDate):''})` : '(Piyasa kuru — TCMB alınamadı)'}` : (state.fxRateLoading ? 'Kur bilgisi alınıyor…' : 'Kur bilgisi henüz yok')}
    </div>`;
  }
  out += `<div class="toolbar">
    <input type="text" id="depo-search-input" placeholder="Barkod, referans, renk veya beden ara…" value="${attrEsc(state.depoSearch)}" onkeydown="if(event.key==='Enter') setDepoSearch(this.value)" />
    <button class="btn ghost small" onclick="setDepoSearch(document.getElementById('depo-search-input').value)">Ara</button>
    ${state.depoSearch ? `<button class="btn ghost small" onclick="clearDepoSearch()">✕ Temizle</button>` : ''}
    <select onchange="setDepoSortBy(this.value)">
      <option value="ref-asc" ${state.depoSortBy==='ref-asc'?'selected':''}>Referansa Göre</option>
      <option value="barcode-asc" ${state.depoSortBy==='barcode-asc'?'selected':''}>Barkod (Küçükten Büyüğe)</option>
      <option value="barcode-desc" ${state.depoSortBy==='barcode-desc'?'selected':''}>Barkod (Büyükten Küçüğe)</option>
      <option value="stock-asc" ${state.depoSortBy==='stock-asc'?'selected':''}>Stok (Azdan Çoğa)</option>
      <option value="stock-desc" ${state.depoSortBy==='stock-desc'?'selected':''}>Stok (Çoktan Aza)</option>
      <option value="recent-first" ${state.depoSortBy==='recent-first'?'selected':''}>Son Hareket (Yeniden Eskiye)</option>
      <option value="oldest-first" ${state.depoSortBy==='oldest-first'?'selected':''}>Son Hareket (Eskiden Yeniye)</option>

    <button class="btn primary small" onclick="openScanMode('out')">📷 Hızlı Tarama</button>

    ${session.role!=='depocu' ? `<button class="btn ghost small" onclick="openNewDepoItemModal()">+ Yeni Depo Kaydı</button>` : ''}

    ${session.role!=='depocu' ? `<button class="btn ghost small" onclick="openBulkImageModal()">Toplu Görsel Yükle</button>` : ''}
    <button class="btn ghost small" onclick="exportDepoCSV()">Dışa Aktar (Excel)</button>
    ${canManage ? `<button class="btn danger-outline small" ${selectedCount===0?'disabled':''} onclick="deleteSelectedDepoItems()">Seçilenleri Sil (${selectedCount})</button>` : ''}
    ${canManage ? `<button class="btn danger-outline small" onclick="deleteAllDepoItems()">Tümünü Sil</button>` : ''}
    <div class="count">${items.length} / ${state.warehouseItems.length} kayıt</div>
  </div>`;

  if(items.length===0){
    out += `<div class="empty">
      <h3>${state.warehouseItems.length===0 ? 'Henüz depo kaydı yok' : 'Sonuç bulunamadı'}</h3>
      <p>${state.warehouseItems.length===0 ? '"Toplu Stok Yükle" ile Excel\'deki mevcut stok listenizi içe aktarabilirsiniz.' : 'Aramayı değiştirmeyi deneyin.'}</p>
    </div>`;
  } else {
    const cols = canManage ? '26px 56px 130px 1fr 150px 100px 100px 130px 44px' : '56px 130px 1fr 150px 90px';
    out += `<div class="depo-table-wrap"><table class="depo-table" style="--depo-cols:${cols}">
      <thead><tr>
        ${canManage ? `<th><input type="checkbox" ${allSelected?'checked':''} onchange="toggleDepoSelectAll(${JSON.stringify(visibleBarcodes)})" title="Bu sayfadakilerin tümünü seç" /></th>` : ''}
        <th>Sıra No</th><th>Barkod</th><th>Model No</th><th>Stok Miktarı</th>${canManage?'<th>Fiyat ($)</th><th>Fiyat (₺)</th>':''}<th>Kataloğa Ekle</th>${canManage?'<th></th>':''}
      </tr></thead>
      <tbody>
      ${pageItems.map((it,idx)=>{
        const low = (Number(it.stock)||0) <= LOW_STOCK_THRESHOLD;
        const inCatalog = isBarcodeInCatalog(it.barcode);
        const price = canManage ? priceForBarcode(it.barcode, it.refNo) : null;
        const tryPrice = (price!=null && state.fxRate) ? (price*state.fxRate) : null;
        return `<tr>
          ${canManage ? `<td><input type="checkbox" ${state.depoSelected.has(it.barcode)?'checked':''} onchange="toggleDepoSelect('${attrEsc(it.barcode)}')" /></td>` : ''}
          <td class="depo-td-muted">${(state.depoPage-1)*DEPO_PAGE_SIZE + idx + 1}</td>
          <td class="mini-meta" style="font-size:11.5px">${esc(it.barcode)}</td>
          <td class="name" style="font-size:13px">${esc(detailRefLabel(it.refNo, it.colorName, it.sizeLabel))}</td>
          <td>
            <div class="depo-qty-cell">
              <button class="depo-qty-btn out" onclick="openDepoMoveModal('${attrEsc(it.barcode)}','${attrEsc(it.refNo)}','${attrEsc(it.colorName)}','${attrEsc(it.sizeLabel)}','out')" title="Çıkış">−</button>
              <span class="pc-stock-badge ${low?'low':''}">${low?'⚠ ':''}${it.stock||0}</span>
              <button class="depo-qty-btn in" onclick="openDepoMoveModal('${attrEsc(it.barcode)}','${attrEsc(it.refNo)}','${attrEsc(it.colorName)}','${attrEsc(it.sizeLabel)}','in')" title="Giriş">+</button>
            </div>
          </td>
          ${canManage ? `<td><input type="number" min="0" step="0.01" value="${price!=null?price:''}" placeholder="0.00" class="depo-price-input" onchange="updateDepoPrice('${attrEsc(it.barcode)}','${attrEsc(it.refNo)}', this.value)" /></td>
          <td class="depo-td-muted">${tryPrice!=null ? formatMoney(tryPrice)+' ₺' : (state.fxRateLoading ? 'kur…' : '—')}</td>` : ''}
          <td>${session.role!=='depocu' ? (inCatalog ? `<span class="chip wa">Kataloğda ✓</span>` : `<button class="btn small ghost" onclick="addWarehouseItemToCatalog('${attrEsc(it.barcode)}')">Kataloğa Ekle</button>`) : '<span class="depo-td-muted">—</span>'}</td>
          ${canManage ? `<td><button class="sku-del" onclick="deleteSelectedSingle('${attrEsc(it.barcode)}')" title="Bu kaydı sil">✕</button></td>` : ''}
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`;
    if(totalPages > 1){
      out += `<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px">
        <button class="btn small ghost" ${state.depoPage<=1?'disabled':''} onclick="setDepoPage(${state.depoPage-1})">← Önceki</button>

        <button class="btn small ghost" ${state.depoPage>=totalPages?'disabled':''} onclick="setDepoPage(${state.depoPage+1})">Sonraki →</button>
      </div>`;
    }
  }
  return out;
}

  const rows = state.excelImportRows;
  const matched = rows.filter(r=>r.matched);
  const unmatched = rows.filter(r=>!r.matched);
  const alreadyHasImage = rows.filter(r=>r.status==='already');
  const toImport = matched.filter(r=>r.status!=='already');
  const running = state.excelImportRunning;
  const parsing = state.excelImportParsing;
  const isDone = state.excelImportDone;
  return `<div class="overlay">
    <div class="modal" style="max-width:920px;width:95vw">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <h2 style="margin:0">Excel'den Resim ve Bilgi İçe Aktar</h2>
        <button class="btn small ghost" ${running?'disabled':''} onclick="closeModal()">Kapat</button>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Excel dosyanızda hücrelerin içine yerleştirilmiş (Excel'in "Resmi Hücreye Ekle" özelliği) resimleri, barkoda göre eşleştirip kataloğa aktarır. Cinsiyet ve sezon sütunları varsa onları da modele işler.</p>
      ${rows.length===0 ? `
        <div class="field">
          <label>Excel Dosyası (.xlsx)</label>
          <input type="file" accept=".xlsx" onchange="handleExcelImportFile(event)" ${parsing?'disabled':''} />
        </div>
        ${parsing ? `<div class="field-msg">⏳ Dosya okunuyor, resimler çözümleniyor…</div>` : ''}
      ` : `
        ${isDone ? `<div class="bulk-result ok" style="display:block;margin-bottom:14px">✓ İçe aktarma tamamlandı — ${state.excelImportResultText||''}</div>` : ''}
        <div class="extra-info-box" style="margin-bottom:14px">
          <div class="extra-info-row"><span class="extra-info-label">Toplam Satır</span><span class="extra-info-value">${rows.length}</span></div>
          <div class="extra-info-row"><span class="extra-info-label">Yeni Aktarılacak</span><span class="extra-info-value" style="color:var(--good)">${toImport.length}</span></div>
          <div class="extra-info-row"><span class="extra-info-label">Zaten Resmi Var (atlanacak)</span><span class="extra-info-value" style="color:var(--muted)">${alreadyHasImage.length}</span></div>
          <div class="extra-info-row"><span class="extra-info-label">Depo'da Bulunamayan</span><span class="extra-info-value" style="color:${unmatched.length>0?'var(--danger)':'var(--muted)'}">${unmatched.length}</span></div>
        </div>
        <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:14px;cursor:pointer">
          <input type="checkbox" ${state.excelImportUpdateGenderSeason?'checked':''} ${running?'disabled':''} onchange="state.excelImportUpdateGenderSeason=this.checked;render();" style="width:auto" />
          Cinsiyet ve sezon bilgilerini de modele işle (varsa)
        </label>
        <div style="max-height:min(50vh,440px);overflow-y:auto;margin-bottom:14px" id="excel-import-table-wrap">
          <table class="depo-table" style="min-width:600px">
            <thead><tr><th>Resim</th><th>Barkod</th><th>Eşleşme</th><th>Cinsiyet</th><th>Sezon</th><th>Durum</th></tr></thead>
            <tbody>
              ${rows.map((r,idx)=>`<tr>
                <td>${r.imageBlob ? `<div style="width:32px;height:32px;background:#fff;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)">🖼</div>` : `<div style="width:32px;height:32px;border:1px dashed var(--line);border-radius:4px"></div>`}</td>
                <td class="mini-meta">${esc(r.barcode)}</td>
                <td>${r.matched ? `<span style="color:var(--good)">✓ ${esc(r.matchRefNo)} · ${esc(r.matchColorName)} · ${esc(r.matchSizeLabel)}</span>` : `<span style="color:var(--danger)">Depo'da yok</span>`}</td>
                <td class="depo-td-muted">${esc(r.gender||'—')}</td>
                <td class="depo-td-muted">${esc(r.season||'—')}</td>
                <td>${r.status==='ok'?'<span style="color:var(--good)">✓ Aktarıldı</span>':r.status==='error'?'<span style="color:var(--danger)">⚠ Hata</span>':r.status==='already'?'<span style="color:var(--muted)">Zaten var</span>':r.status==='skipped'?'<span style="color:var(--muted)">—</span>':r.status==='processing'?'<span style="color:var(--accent-ink)">⏳</span>':''}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
      <div class="modal-actions">
        <button class="btn ${isDone?'primary':'ghost'}" ${running?'disabled':''} onclick="closeModal()" style="${isDone?'font-weight:800':''}">${rows.length>0 && !running ? (isDone?'✓ Bitti':'Bitti') : 'Vazgeç'}</button>
        ${rows.length>0 && !isDone ? `<button class="btn primary" ${running||toImport.length===0?'disabled':''} onclick="commitExcelImport()">${running?'⏳ İçe Aktarılıyor… ('+state.excelImportProgress+'/'+toImport.length+')':`✓ ${toImport.length} Satırı İçe Aktar`}</button>` : ''}
      </div>
    </div>
  </div>`;
}
function renderBulkImageModal(){
  const running = state.bulkImageRunning;
  const rows = state.bulkImageRows;
  return `<div class="overlay" onmousedown="if(!${running} && event.target===event.currentTarget) closeModal()">
    <div class="modal wide" style="max-width:680px">
      <h2>Toplu Görsel Yükle</h2>
      ${running ? `
        <div class="bulk-help" style="text-align:center;padding:20px">
          <div style="font-weight:700;margin-bottom:4px">⏳ ${esc(state.bulkImageProgress||'İşleniyor…')}</div>
          <div style="font-size:12px">Bu pencereyi kapatmayın.</div>
        </div>
      ` : `
        <div class="bulk-help">
          Dosya adı <b>Referans-Renk</b> formatında olmalı, örn. <code>2000-BEYAZ.jpg</code>, <code>2000-RED.png</code>.<br/>
          Her görsel, o referans + renge ait <b>tüm bedenlere otomatik uygulanır</b> — tek görsel, birden fazla barkodu kapsar.<br/>
          Birden fazla dosyayı aynı anda seçebilirsiniz. Yüklemeden önce eşleşmeleri (ve isterseniz model açıklamasını) gözden geçirip düzeltebilirsiniz.
        </div>
        ${rows.length===0 ? `
          <div class="upload-drop" onclick="document.getElementById('bulk-image-file').click()">
            Görselleri seçmek için tıklayın<br/><span style="font-size:10.5px">Birden fazla dosya seçebilirsiniz</span>
          </div>
          <input type="file" id="bulk-image-file" accept="image/*" multiple style="display:none" onchange="handleBulkImageFiles(event)" />
        ` : `
          <div style="max-height:400px;overflow-y:auto;border:1px solid var(--line);border-radius:5px">
            ${rows.map((r,idx)=>{
              const matchCount = (r.parsed && r.parsed.refNo && r.parsed.colorName) ? matchCountForRefColor(r.parsed.refNo, r.parsed.colorName) : 0;
              return `<div style="display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)">
                ${r.processedImage ? `<img src="${r.processedImage}" style="width:44px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px" />` : `<div class="depo-thumb depo-thumb-empty">${r.status==='processing'?'…':'—'}</div>`}
                <div style="flex:1">
                  <div style="font-size:11px;color:var(--muted);margin-bottom:3px">${esc(r.fileName)}</div>
                  <div style="display:flex;gap:6px">
                    <input type="text" value="${attrEsc(r.parsed?r.parsed.refNo:'')}" placeholder="Ref No" style="width:70px;border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-size:12px" oninput="updateBulkImageField(${idx},'refNo',this.value)" />
                    <input type="text" value="${attrEsc(r.parsed?r.parsed.colorName:'')}" placeholder="Renk" style="width:100px;border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-size:12px;text-transform:uppercase" oninput="updateBulkImageField(${idx},'colorName',this.value)" />
                    <input type="text" value="${attrEsc(r.description)}" placeholder="Açıklama (opsiyonel)" style="flex:1;border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-size:12px" oninput="updateBulkImageField(${idx},'description',this.value)" />
                  </div>
                  <div style="font-size:10.5px;color:var(--muted);margin-top:4px">
                    ${r.status==='processing' ? 'Görsel işleniyor…' : r.status==='error' ? '⚠ Görsel işlenemedi' : r.status==='unparsed' ? '⚠ Dosya adından Ref/Renk çözülemedi, elle girin' : `${matchCount} depo kaydı ile eşleşiyor`}
                  </div>
                </div>
                <button class="sku-del" onclick="removeBulkImageRow(${idx})" title="Kaldır">✕</button>
              </div>`;
            }).join('')}
          </div>
          <button class="btn ghost small" style="margin-top:10px" onclick="document.getElementById('bulk-image-file').click()">+ Daha fazla görsel ekle</button>
          <input type="file" id="bulk-image-file" accept="image/*" multiple style="display:none" onchange="handleBulkImageFiles(event)" />
        `}
      `}
      <div class="modal-actions">
        <button class="btn ghost" ${running?'disabled':''} onclick="closeModal()">Kapat</button>
        ${(!running && rows.length>0) ? `<button class="btn primary" onclick="commitBulkImageImport()">İçe Aktar</button>` : ''}
      </div>
    </div>
  </div>`;
}

function renderNewDepoItemModal(){
  return `<div class="overlay" onmousedown="if(event.target===event.currentTarget) closeModal()">
    <div class="modal">
      <h2>Yeni Depo Kaydı</h2>
      <p style="color:var(--muted);font-size:12.5px;margin-top:-10px">Barkod, konuştuğumuz formülle (1288 + Ref No + Renk Sırası + Beden Sırası + kontrol hanesi) otomatik oluşturulur. Model/renk zaten kayıtlıysa üzerine yenisi eklenmez, mevcut olan kullanılır.</p>
      <div class="row2">
        <div class="field">
          <label>Referans No *</label>
          <input id="ndi-ref" type="text" inputmode="numeric" maxlength="6" placeholder="Örn. 2000" oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
        </div>
        <div class="field">
          <label>Model Adı (opsiyonel)</label>
          <input id="ndi-refname" type="text" placeholder="Yalnızca yeni modelse kullanılır" />
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Renk *</label>
          <input id="ndi-color" type="text" placeholder="Örn. BLUE" oninput="this.value=this.value.toUpperCase()" style="text-transform:uppercase" />
        </div>
        <div class="field">
          <label>Beden *</label>
          <select id="ndi-size">
            ${SIZES.map(s=>`<option value="${s.code}">${esc(s.short)} (EU ${s.eu})</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Başlangıç Stoğu (opsiyonel)</label>
        <input id="ndi-qty" type="number" min="0" placeholder="0" />
      </div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Vazgeç</button>
        <button class="btn primary" onclick="submitNewDepoItem()">Kaydet ve Barkod Üret</button>
      </div>
    </div>
  </div>`;
}

function renderScanModal(){
  const s = state.scan;
  return `<div class="overlay">
    <div class="modal wide">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="margin:0">Hızlı Tarama</h2>
        <button class="btn small ghost" ${s.stage==='pending'?'disabled':''} onclick="closeScanMode()">Kapat</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn small ${s.mode==='out'?'':'ghost'}" ${s.stage==='pending'?'disabled':''} style="${s.mode==='out'?'background:var(--danger);color:#fff;border-color:var(--danger)':''}" onclick="setScanMode('out')">− Çıkış</button>
        <button class="btn small ${s.mode==='in'?'primary':'ghost'}" ${s.stage==='pending'?'disabled':''} onclick="setScanMode('in')">+ Giriş</button>
      </div>
      <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);margin-bottom:16px;cursor:pointer">
        <input type="checkbox" ${s.rapidMode?'checked':''} ${s.stage==='pending'?'disabled':''} onchange="toggleScanRapidMode()" style="width:auto" />
        <b>Hızlı Sayım Modu</b> — her taramada miktar sormadan otomatik 1 adet kaydet
      </label>
      ${s.lastResult ? `<div class="bulk-result ${s.lastResult.ok?'ok':'error'}" style="display:block;margin-bottom:12px">${esc(s.lastResult.text)}</div>` : ''}
      ${s.stage==='pending' ? `
        <div class="field">
          <label>Barkodu Okutun</label>
          <input type="text" disabled value="⏳ Kaydediliyor, lütfen bekleyin…" style="font-size:16px;padding:14px;text-align:center;color:var(--muted);background:#F1ECDD" />
        </div>
      ` : s.stage==='scan' ? `
        <div class="field">
          <label>Barkodu Okutun</label>
          <input id="scan-barcode" type="text" autocomplete="off" style="font-size:20px;padding:14px;text-align:center;font-variant-numeric:tabular-nums" onkeydown="handleScanBarcodeKey(event)" placeholder="Okuyucuyla tarayın ya da elle yazıp Enter'a basın" />
        </div>
      ` : s.stage==='unknown' ? `
        <div class="bulk-result error" style="display:block;text-align:center;font-size:14px">
          ⚠ <b>${esc(s.barcode)}</b> barkodu sistemde kayıtlı değil.
        </div>
        <p style="font-size:13px;color:var(--muted);margin:12px 0 10px">Bu barkodu şimdi kaydetmek ister misiniz? Bilgileri girip devam edin — barkod olduğu gibi kaydedilecek, yeni bir barkod üretilmeyecek.</p>
        <div class="row2">
          <div class="field"><label>Referans No</label><input id="scan-new-ref" type="text" /></div>
          <div class="field"><label>Renk</label><input id="scan-new-color" type="text" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" /></div>
        </div>
        <div class="field"><label>Beden</label><input id="scan-new-size" type="text" placeholder="Örn. 1, Size 1, 19-20" /></div>
        <div class="modal-actions" style="margin-top:0">
          <button class="btn ghost" onclick="cancelScanUnknown()">Vazgeç</button>
          <button class="btn primary" onclick="confirmScanUnknown()">Kaydet ve Devam Et</button>
        </div>
      ` : `
        <div class="extra-info-box" style="margin-bottom:14px">
          <div style="font-weight:700;font-size:15px">${esc(detailRefLabel(s.item.refNo, s.item.colorName, s.item.sizeLabel))}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(s.barcode)} · Mevcut stok: ${s.item.stock||0}</div>
        </div>
        <div class="field">
          <label>Miktar</label>
          <input id="scan-qty" type="number" min="1" value="1" style="font-size:20px;padding:14px;text-align:center" onkeydown="handleScanQtyKey(event)" />
        </div>
        <div class="field-msg">Enter'a basınca kaydedilir ve bir sonraki taramaya geçilir</div>
      `}
      ${s.sessionLog.length>0 ? `
        <div style="margin-top:20px">
          <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;font-weight:700">Bu oturumda (${s.sessionLog.length})${s.sessionLog.some(l=>l.status==='pending')?' — bazıları kaydediliyor…':''}</div>
          ${s.sessionLog.slice(0,12).map(l=>`<div class="log-item" style="padding:6px 0;${l.status==='error'?'background:var(--danger-bg)':l.status==='pending'?'background:#FBF9F3':''}">
            <div class="meta">
              <span class="chip ${l.mode==='in'?'wa':'other'}">${l.mode==='in'?'Giriş':'Çıkış'}</span>
              <span>${esc(detailRefLabel(l.refNo, l.colorName, l.sizeLabel))}</span>
              <span style="font-weight:700;margin-left:auto">${l.mode==='in'?'+':'−'}${l.qty}</span>
              ${l.status==='pending' ? '<span style="font-size:11px;color:var(--muted)">⏳</span>' : ''}
              ${l.status==='ok' ? '<span style="font-size:12px;color:var(--good)">✓</span>' : ''}
              ${l.status==='error' ? `<span style="font-size:11px;color:var(--danger)">⚠ ${esc(l.errorMsg||'')}</span><button class="btn small danger-outline" style="padding:2px 8px" onclick="retryQueuedScan('${l.id}')">Tekrar Dene</button>` : ''}
            </div>
          </div>`).join('')}
        </div>
      ` : ''}
    </div>
  </div>`;
}

boot();
</script>
</body>
</html>
