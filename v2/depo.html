<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Depo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F6F2E9;
    --surface:#FFFFFF;
    --ink:#232C2A;
    --muted:#71776F;
    --line:#E3DCC9;
    --accent:#A85C2B;
    --accent-ink:#5A3016;
    --good:#3D7A54;
    --good-bg:#E4F1E6;
    --warn:#B98A1E;
    --warn-bg:#FBF0D6;
    --danger:#B5402F;
    --danger-bg:#FBE7E1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  .banner{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;}
  .banner h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;margin:0;letter-spacing:-0.01em;}
  .banner .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .nav-link{font-size:12px;color:var(--accent-ink);text-decoration:none;font-weight:600;}
  .nav-link:hover{text-decoration:underline;}
  .fsm{position:relative;display:inline-block}
  .fsm-list{display:none;position:absolute;left:0;top:calc(100% + 4px);min-width:230px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:5px;z-index:300}
  .fsm-list.right{left:auto;right:0}
  .fsm.open .fsm-list{display:block}
  .fsm-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font:inherit;font-size:13px;color:var(--ink);border-radius:5px;cursor:pointer}
  .fsm-list button:hover:not(:disabled){background:var(--bg)}
  .fsm-list button:disabled{opacity:.5;cursor:default}
  .fsm-list button.danger{color:var(--danger,#b42318)}
  .top-nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
  .top-nav-item{display:inline-flex;align-items:center;gap:4px;padding:8px 15px;border-radius:7px;font-size:13.5px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);transition:border-color .15s,background .15s;}
  .top-nav-item:hover{border-color:var(--accent-ink);}
  .top-nav-item.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .top-nav-item.external{color:var(--accent-ink);}
  .brand-row{display:flex;align-items:center;gap:14px;}
  .brand-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .logo-click{position:relative;display:inline-block;cursor:pointer;}
  .brand-logo{height:48px;max-width:150px;object-fit:contain;display:block;}
  .brand-logo-placeholder{width:76px;height:48px;border:1.5px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10.5px;text-align:center;}
  .logo-edit-badge{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;border:2px solid var(--bg);pointer-events:none;}

  .btn{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:3px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .btn:hover{background:var(--ink);color:#fff;}
  .btn:active{transform:scale(0.96);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  .btn.ghost{border-color:var(--line);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger-outline{border-color:var(--danger);color:var(--danger);}
  .btn.danger-outline:hover{background:var(--danger);color:#fff;}
  .btn:disabled{opacity:.4;pointer-events:none;}

  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .toolbar select, .toolbar input[type=text]{border:1.5px solid var(--line);background:var(--surface);padding:8px 10px;border-radius:3px;font-family:inherit;font-size:13px;color:var(--ink);}
  .toolbar input[type=text]{min-width:220px;}
  .toolbar .count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}

  .empty{padding:50px 20px;text-align:center;color:var(--muted);}
  .empty h3{font-family:'Fraunces',serif;color:var(--ink);margin-bottom:6px;}

  .overlay{position:fixed;inset:0;background:rgba(35,44,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--surface);border-radius:6px;max-width:560px;width:100%;padding:26px 28px 28px;border:1px solid var(--line);}
  .modal h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input, .field select, .field textarea{width:100%;border:1.5px solid var(--line);border-radius:3px;padding:9px 10px;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .field-msg{font-size:11px;margin-top:4px;color:var(--muted);}
  .field-msg.error{color:var(--danger);}
  .auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:32px 30px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(35,44,42,.06);}
  .user-badge{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .user-badge .role-chip{background:#EEEBE2;padding:1px 7px;border-radius:8px;font-weight:700;font-size:10px;text-transform:uppercase;}

  @keyframes slideIn{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;max-width:80vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}
  .loading{padding:60px;text-align:center;color:var(--muted);}

  /* Product grid */
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
  .product-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
  .product-card:hover{box-shadow:0 3px 14px rgba(35,44,42,.10);}
  .product-card .pc-img{width:100%;height:150px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line);display:block;}
  .product-card .pc-img-placeholder{width:100%;height:150px;background:#F1ECDD;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);}
  .pc-body{padding:11px 13px;}
  .pc-ref{font-family:'Fraunces',serif;font-size:17px;}
  .pc-name{color:var(--muted);font-size:12px;margin-top:1px;}
  .pc-colors{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
  .pc-color-chip{font-size:10px;background:#F1ECDD;color:var(--ink);padding:2px 7px;border-radius:9px;font-weight:600;white-space:nowrap;}
  .pc-color-chip.low{background:var(--danger-bg);color:var(--danger);}
  .pc-price{font-family:'Fraunces',serif;font-size:16px;margin-top:8px;color:var(--accent-ink);}
  .pc-price-edit{margin-top:9px;}
  .pc-price-edit label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px;font-weight:700;}
  .pc-price-edit input{width:100%;border:1.5px solid var(--line);border-radius:3px;padding:7px 9px;font-family:'Fraunces',serif;font-size:15px;color:var(--accent-ink);background:var(--bg);}
  .pc-color-chip.active{background:var(--accent);color:#fff;}
  .pc-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
  .pc-stock-badge{background:#EEEBE2;padding:1px 7px;border-radius:9px;font-weight:600;}
  .pc-stock-badge.low{background:var(--danger-bg);color:var(--danger);}

  /* Product detail */
  .product-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .product-head h2{font-family:'Fraunces',serif;margin:0;font-size:24px;}
  .product-head .ph-meta{color:var(--muted);font-size:13px;margin-top:4px;}

  .variant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px;}
  .variant-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .variant-card img{width:100%;height:170px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line);display:block;}
  .variant-card .vc-img-placeholder{width:100%;height:170px;background:#F1ECDD;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);}
  .vc-body{padding:12px 14px;}
  .vc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .vc-color{font-weight:700;font-size:14px;}
  .vc-price-wrap{display:flex;align-items:center;gap:4px;font-size:12.5px;}
  .vc-price-wrap input{width:64px;border:1.5px solid var(--line);border-radius:3px;padding:3px 5px;font-family:inherit;font-size:12.5px;background:var(--bg);}
  .vc-actions{display:flex;gap:5px;margin-top:8px;}

  .size-picker{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;}
  .size-chip{padding:4px 9px;border:1.5px solid var(--line);border-radius:14px;font-size:11px;cursor:pointer;background:var(--surface);}
  .size-chip:hover{border-color:var(--accent);}
  .size-chip.added{opacity:.3;pointer-events:none;}

  .sku-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-top:1px dashed var(--line);gap:6px;}
  .sku-row:first-of-type{border-top:none;}
  .sku-row .sku-label{flex:1;}
  .sku-row .barcode{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;}
  .sku-row input.stock-input{width:52px;padding:3px 5px;border:1px solid var(--line);border-radius:3px;font-size:12px;text-align:center;}
  .sku-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:2px 4px;}

  .upload-drop{border:1.5px dashed var(--line);border-radius:5px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;background:var(--bg);}
  .upload-drop:hover{border-color:var(--accent);}
  .upload-preview{width:100%;max-height:180px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;margin-top:8px;}

  .modal.wide{max-width:520px;}
  .bulk-help{font-size:12px;color:var(--muted);background:#FBF9F3;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:12px;line-height:1.5;}
  .bulk-help code{background:#EEEBE2;padding:1px 5px;border-radius:3px;font-size:11.5px;}
  #depo-bulk-textarea{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:3px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);}
  .bulk-result{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:4px;}
  .bulk-result.ok{background:var(--good-bg);color:var(--good);}
  .bulk-result.error{background:var(--danger-bg);color:var(--danger);}
  .log-item{border-bottom:1px solid var(--line);padding:10px 0;}
  .log-item:last-child{border-bottom:none;}
  .log-item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;}
  .log-item .note{margin-top:4px;font-size:13.5px;}
  .log-empty{color:var(--muted);font-size:13px;padding:10px 0;}
  .chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .chip.wa{background:#E4F8EC;color:#1D9A4E;}
  .chip.other{background:#EEEBE2;color:var(--muted);}
  .depo-main{max-height:none!important;overflow-y:visible!important}
  .depo-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;max-height:72vh;overflow-y:auto;}
  .depo-table{border-collapse:collapse;width:100%;min-width:640px;background:var(--surface);}
  .depo-table thead th{
    position:sticky;top:0;z-index:2;background:#F1ECDD;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;
    text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap;
  }
  .depo-table tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .depo-table tbody tr:hover{background:#FBF9F3;}
  .depo-table tbody tr:last-child td{border-bottom:none;}
  .depo-td-muted{color:var(--muted);font-variant-numeric:tabular-nums;}
  .depo-qty-cell{display:flex;align-items:center;gap:8px;}
  .depo-qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
  .depo-qty-btn.in{color:var(--good);border-color:var(--good);}
  .depo-qty-btn.in:hover{background:var(--good);color:#fff;}
  .depo-qty-btn.out{color:var(--danger);border-color:var(--danger);}
  .depo-qty-btn.out:hover{background:var(--danger);color:#fff;}
  .depo-price-input{width:78px;border:1.5px solid var(--line);border-radius:3px;padding:5px 7px;font-size:12.5px;background:var(--bg);}
  .fx-banner{background:#FBF0D6;border:1.5px solid var(--warn);color:var(--accent-ink);border-radius:5px;padding:9px 14px;margin-bottom:14px;font-size:13px;}
  .pdf-scope{display:flex;gap:8px;margin-bottom:12px;}
  .pdf-scope label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;color:var(--ink);}
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">Yükleniyor…</div></div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="fs-backend.js"></script>
<script>
'use strict';

// ---------- constants ----------
const API_URL = 'fsapi://x';
async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 90000);
  try{
    return await fetch(url, {...(options||{}), signal: controller.signal});
  } finally {
    clearTimeout(timer);
  }
}
const SIZES = [
  {code:'0', label:'Size 0 (0-3 Ay)', short:'Size 0', eng:'Size 0 (0-3M)', eu:15},
  {code:'1', label:'Size 1 (3-6 Ay)', short:'Size 1', eng:'Size 1 (3-6M)', eu:16},
  {code:'2', label:'Size 2 (6-9 Ay)', short:'Size 2', eng:'Size 2 (6-9M)', eu:17},
  {code:'3', label:'Size 3 (9-12 Ay)', short:'Size 3', eng:'Size 3 (9-12M)', eu:18},
  {code:'4', label:'Size 4 (12-15 Ay)', short:'Size 4', eng:'Size 4 (12-15M)', eu:19},
  {code:'5', label:'Size 5 (15-18 Ay)', short:'Size 5', eng:'Size 5 (15-18M)', eu:20},
  {code:'6', label:'Size 6 (18-24 Ay)', short:'Size 6', eng:'Size 6 (18-24M)', eu:21},
  {code:'7', label:'Size 7 (2-3 Yaş)', short:'Size 7', eng:'Size 7 (2-3Y)', eu:22},
  {code:'8', label:'Size 8 (3-4 Yaş)', short:'Size 8', eng:'Size 8 (3-4Y)', eu:23}
];
const MAX_COLORS_PER_MODEL = 9;
const MAX_SIZES_PER_COLOR = 9;
const LOW_STOCK_THRESHOLD = 5;

// ---------- helpers ----------
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function attrEsc(s){ return esc(s).replace(/`/g,'&#96;'); }
function parseBulkLine(line){
  // Auto-detect delimiter: tab, then semicolon (common in Turkish-locale Excel CSV exports), then comma.
  let parts;
  if(line.includes('\t')) parts = line.split('\t');
  else if(line.includes(';')) parts = line.split(';');
  else parts = line.split(',');
  return parts.map(p=>p.trim());
}
function formatMoney(n){ return (Number(n)||0).toLocaleString('tr-TR', {maximumFractionDigits:2}); }
function csvField(v){ const s = String(v==null?'':v); if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"'; return s; }
function downloadBlob(filename, mime, content){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

let toastTimer = null;
let doneBannerTimer=null;
function showDoneBanner(title, detail){
  let el=document.getElementById('done-banner');
  if(!el){
    el=document.createElement('div'); el.id='done-banner';
    el.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100000;background:#16a34a;color:#fff;padding:16px 28px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:20px;font-weight:700;text-align:center;max-width:92vw;display:none;pointer-events:none';
    document.body.appendChild(el);
  }
  el.innerHTML='✅ '+title+(detail?'<div style="font-size:14px;font-weight:500;margin-top:4px;opacity:.95">'+detail+'</div>':'');
  el.style.display='block';
  clearTimeout(doneBannerTimer);
  doneBannerTimer=setTimeout(()=>{el.style.display='none';},3500);
}
function showToast(msg, persistent){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  if(!persistent) toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

// ---------- EAN-13 barcode ----------
function padRef(refNo){ return String(refNo).replace(/[^0-9]/g,'').padStart(6,'0').slice(-6); }
function normColor(c){ return String(c||'').trim().toUpperCase(); }
function ean13CheckDigit(base12){
  let sum = 0;
  for(let i=0;i<12;i++){
    const d = parseInt(base12[i],10);
    sum += (i%2===0) ? d*1 : d*3;
  }
  return String((10 - (sum % 10)) % 10);
}
function computeBarcode(refNo, colorOrder, sizeOrder){
  const base12 = '1288' + padRef(refNo) + String(colorOrder) + String(sizeOrder);
  return base12 + ean13CheckDigit(base12);
}

// ---------- backend (shared with Müşteri Merkezi) ----------
async function loadAll(){
  const authParams = session ? ('?authUser=' + encodeURIComponent(session.username) + '&authHash=' + encodeURIComponent(session.passwordHash)) : '';
  const res = await fetch(API_URL + authParams);
  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  // A genuine bulk-data response never has an explicit `ok:false`/`error` field at the top level
  // — if one is present, the server rejected the request (maintenance mode, auth issue, a
  // transient error, etc.) rather than returning real data. Treat this as a failure so the
  // caller's try/catch skips the update, instead of silently wiping out good local data with an
  // empty/malformed result.
  if(data && data.ok===false) throw new Error(data.error || 'bulk_fetch_rejected');
  return data;
}
function describeWriteBlock_(data){
  if(data && data.error==='maintenance_mode') return data.message || 'Sistem şu anda bakımda — lütfen daha sonra tekrar deneyin.';
  if(data && data.error==='stock_count_locked') return data.message || 'Aktif bir depo sayımı sürüyor — sayım tamamlanana kadar bu işlem yapılamaz.';
  return null;
}
async function saveKey(key, value){
  let res;
  try{
    res = await fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({key, value, auth: session ? {username:session.username, passwordHash:session.passwordHash} : null})
    }, 30000);
  }catch(e){
    if(e && e.name==='AbortError'){
      showToast('⏱ Sunucu yanıtı gecikti — kayıt yine de tamamlanmış olabilir, birkaç saniye sonra sayfayı yenileyip kontrol edin.');
    } else {
      showToast('Kaydetme hatası — sunucuya ulaşılamadı (' + (e && e.message ? e.message : 'bilinmeyen ağ hatası') + ')');
    }
    return false;
  }
  if(!res.ok){
    showToast('Kaydetme hatası — sunucu ' + res.status + ' koduyla yanıt verdi, tekrar deneyin');
    return false;
  }
  let data;
  try{
    data = await res.json();
  }catch(e){
    showToast('Kaydetme hatası — sunucu beklenmeyen bir yanıt döndürdü, tekrar deneyin');
    return false;
  }
  if(!data || !data.ok){
    showToast(describeWriteBlock_(data) || (data && data.message) || 'Kaydetme hatası — tekrar deneyin');
    return false;
  }
  return true;
}
// SKUs are stored as individual catalogSku:<id> rows (like colors/variants) rather than one
// big array in a single cell, which has a hard 50,000-character ceiling in Google Sheets.
async function saveSkuRow(sku){ return await saveKey('catalogSku:'+sku.id, sku); }
async function deleteSkuRow(skuId){ return await saveKey('catalogSku:'+skuId, null); }
async function deleteSkuRows(skuIds){ for(const id of skuIds) await deleteSkuRow(id); }
// Applies targeted changes to catalogProducts on the server (merged against the CURRENT
// server-side array, not the client's local copy) — protects against a stale tab/session
// silently overwriting someone else's more recent edit (e.g. a price just updated elsewhere).
async function patchProducts(upserts, deleteIds){
  let res;
  try{
    res = await fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'patchCatalogProducts', auth:{username:session.username, passwordHash:session.passwordHash}, upserts: upserts||[], deleteIds: deleteIds||[]})
    }, 30000);
  }catch(e){
    if(e && e.name==='AbortError'){
      showToast('⏱ Sunucu yanıtı gecikti — kayıt yine de tamamlanmış olabilir, birkaç saniye sonra sayfayı yenileyip kontrol edin.');
    } else {
      showToast('Kaydetme hatası — sunucuya ulaşılamadı (' + (e && e.message ? e.message : 'bilinmeyen ağ hatası') + ')');
    }
    return false;
  }
  if(!res.ok){
    showToast('Kaydetme hatası — sunucu ' + res.status + ' koduyla yanıt verdi, tekrar deneyin');
    return false;
  }
  let data;
  try{
    data = await res.json();
  }catch(e){
    showToast('Kaydetme hatası — sunucu beklenmeyen bir yanıt döndürdü, tekrar deneyin');
    return false;
  }
  if(data && data.ok){
    // Merge locally instead of replacing the whole array — the server now returns only the
    // touched products (upserted/deleted), not the entire catalog, since each product lives in
    // its own row server-side and there's no reason to round-trip every other product too.
    const deletedSet = new Set(data.deletedIds||[]);
    state.products = state.products.filter(p=>!deletedSet.has(p.id));
    (data.upserted||[]).forEach(saved=>{
      const idx = state.products.findIndex(p=>p.id===saved.id);
      if(idx>=0) state.products[idx] = saved; else state.products.push(saved);
    });
    return true;
  }
  showToast(describeWriteBlock_(data) || (data && data.message) || 'Kaydetme hatası — tekrar deneyin');
  return false;
}

const AUTH_STORAGE_KEY = 'fs_auth_session_v2';
let session = null;
const authState = { screen: 'loading', error: '', loggingIn: false, publicLogo: null };
const LOGO_CACHE_KEY = 'fs_logo_cache_v1';
function loadCachedLogo(){
  try{ return localStorage.getItem(LOGO_CACHE_KEY) || null; }catch(e){ return null; }
}
function saveCachedLogo(dataUrl){
  try{ if(dataUrl) localStorage.setItem(LOGO_CACHE_KEY, dataUrl); }catch(e){ /* storage full/unavailable — ignore, cosmetic only */ }
}
async function fetchPublicLogo(){
  try{
    const res = await fetch(API_URL + '?action=publicLogo');
    const data = await res.json();
    if(data && data.logo){
      authState.publicLogo = data.logo;
      saveCachedLogo(data.logo);
      if(authState.screen !== 'app') renderAuthScreen();
    }
  }catch(e){ /* logo is cosmetic — ignore failures */ }
}

async function hashPassword(pw){ return pw; } // Supabase Auth parolayı kendisi saklar/doğrular
function loadSessionFromStorage(){
  try{ const raw = localStorage.getItem(AUTH_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveSessionToStorage(s){ try{ localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(Object.assign({}, s, {passwordHash:''}))); }catch(e){} }
function clearSessionStorage(){ try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e){} }
async function checkBootstrapStatus(){
  try{
    const res = await fetch(API_URL + '?action=bootstrapStatus');
    const data = await res.json();
    return !!data.hasUsers;
  }catch(e){ return true; }
}
async function verifySession(s){
  try{
    const res = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'login', username:s.username, passwordHash:s.passwordHash})
    });
    const data = await res.json();
    return data && data.ok ? data.user : null;
  }catch(e){ return null; }
}
async function boot(){
  authState.publicLogo = loadCachedLogo();
  renderAuthScreen();
  fetchPublicLogo();
  const stored = loadSessionFromStorage();
  if(stored){
    // Load immediately using the stored session — don't block on a network round-trip first.
    session = { username: stored.username, passwordHash: stored.passwordHash, displayName: stored.displayName||stored.username, role: stored.role||'staff', id: stored.id };
    authState.screen = 'app';
    init();
    // Verify in the background; only kick back to login if it's actually invalid.
    verifySession(stored).then(user=>{
      if(user){
        session = { username: user.username, passwordHash: stored.passwordHash, displayName: user.displayName, role: user.role, id: user.id };
      } else {
        clearSessionStorage();
        session = null;
        authState.screen = 'login';
        renderAuthScreen();
      }
    });
    return;
  }
  const hasUsers = await checkBootstrapStatus();
  authState.screen = hasUsers ? 'login' : 'bootstrap';
  renderAuthScreen();
}
async function submitBootstrap(){
  if(authState.loggingIn) return;
  const username = document.getElementById('bs-username').value.trim();
  const password = document.getElementById('bs-password').value;
  const displayName = document.getElementById('bs-displayname').value.trim();
  if(!username || password.length < 4){ authState.error = 'Kullanıcı adı girin, şifre en az 4 karakter olmalı'; renderAuthScreen(); return; }
  authState.error = '';
  authState.loggingIn = true;
  renderAuthScreen();
  const passwordHash = await hashPassword(password);
  try{
    const res = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'bootstrap', username, passwordHash, displayName})
    });
    const data = await res.json();
    authState.loggingIn = false;
    if(data && data.ok){
      session = { username: data.user.username, passwordHash, displayName: data.user.displayName, role: data.user.role, id: data.user.id };
      saveSessionToStorage(session);
      authState.screen = 'app';
      init();
    } else {
      authState.error = 'Kurulum başarısız — sayfayı yenileyip tekrar deneyin';
      renderAuthScreen();
    }
  }catch(e){
    authState.loggingIn = false;
    authState.error = 'Sunucuya bağlanılamadı';
    renderAuthScreen();
  }

// ---------- client-side image processing (crop + whiten background) ----------
function sampleBackgroundColor(data, w, h){
  const pts = [
    [1,1],[w-2,1],[1,h-2],[w-2,h-2],
    [Math.floor(w/2),1],[1,Math.floor(h/2)],[w-2,Math.floor(h/2)],[Math.floor(w/2),h-2]
  ];
  let r=0,g=0,b=0,n=0;
  pts.forEach(([x,y])=>{
    if(x<0||y<0||x>=w||y>=h) return;
    const idx=(y*w+x)*4;
    r+=data[idx]; g+=data[idx+1]; b+=data[idx+2]; n++;
  });
  return n ? [r/n, g/n, b/n] : [255,255,255];
}
function colorDist(r,g,b,cr,cg,cb){
  const dr=r-cr, dg=g-cg, db=b-cb;
  return Math.sqrt(dr*dr + dg*dg + db*db);
}
async function processImageFile(file, maxWidth, quality){
  maxWidth = maxWidth || 620; quality = quality || 0.8;

  // Decode the source image. createImageBitmap with a resize hint lets the browser decode
  // directly at a smaller size — this avoids ever holding a full-resolution decode of a huge
  // phone photo (e.g. a 12MP+ iPhone shot) in memory, which can otherwise cause failures on
  // some devices. Falls back to the classic <img> approach if createImageBitmap isn't available.
  let source, sw, sh;
  try{
    if(window.createImageBitmap){
      source = await createImageBitmap(file, {resizeWidth: 1000, resizeQuality: 'medium'});
      sw = source.width; sh = source.height;
    }
  }catch(err){ source = null; }

  if(!source){
    const dataUrl = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = e=>resolve(e.target.result);
      reader.onerror = ()=>reject(new Error('file read failed'));
      reader.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = ()=>reject(new Error('image load failed'));
      im.src = dataUrl;
    });
    const analyzeScale = Math.min(1, 1000 / img.width);
    sw = Math.max(1, Math.round(img.width * analyzeScale));
    sh = Math.max(1, Math.round(img.height * analyzeScale));
    source = img;
  }

  // Simple, reliable resize — no background detection/cropping, so there's no risk of eating
  // into a light-colored product. Keeps the photo exactly as taken, just sized down.
  const outScale = Math.min(1, maxWidth / sw);
  const ow = Math.max(1, Math.round(sw*outScale)), oh = Math.max(1, Math.round(sh*outScale));
  const c1 = document.createElement('canvas');
  c1.width = ow; c1.height = oh;
  const ctx1 = c1.getContext('2d');
  ctx1.fillStyle = '#ffffff';
  ctx1.fillRect(0,0,ow,oh);
  ctx1.drawImage(source, 0, 0, ow, oh);

  // Safety net: a Sheets cell silently drops data past ~50,000 characters. Try progressively
  // lower quality (never lower resolution) until the encoded image comfortably fits.
  const MAX_IMAGE_CHARS = 38000;
  let q = quality;
  let out = c1.toDataURL('image/jpeg', q);
  while(out.length > MAX_IMAGE_CHARS && q > 0.35){
    q -= 0.1;
    out = c1.toDataURL('image/jpeg', q);
  }
  return out;
}

async function silentAutoRefresh(){
  // Never interrupt active work: skip while a modal is open, a background op is running, an
  // inline row action (like an image upload) is mid-flight, or the tab isn't visible.
  if(document.hidden) return;
  if(state.modalMode) return;
  if(state.depoBulkRunning || state.packingRunning || state.newDepoItemSaving) return;
  if(pendingCriticalWrites > 0) return;
  if(!state.loaded) return;

  const prevPendingIds = new Set((state.pendingPackingOrders||[]).map(o=>o.id));
  try{
    const all = await loadAll();
    const newWarehouseItems = [];
    const newVariants = [];
    Object.keys(all).forEach(k=>{
      if(k.indexOf('catalogVariant:') === 0 && all[k]) newVariants.push(all[k]);
      else if(k.indexOf('warehouseItem:') === 0 && all[k]) newWarehouseItems.push(all[k]);
    });
    // Sanity check: a background refresh should never make the known data shrink drastically.
    // If it does, something went wrong server-side (a partial/malformed response, a transient
    // Apps Script hiccup, etc.) — better to keep showing the last known-good data and quietly
    // retry next cycle than to wipe the list out from under the user.
    const suspiciouslyEmpty = state.warehouseItems.length>0 && newWarehouseItems.length===0;
    if(suspiciouslyEmpty){
      return; // skip this refresh cycle entirely — try again in 45s
    }
    state.products = all['catalogProducts'] || state.products;
    state.skus = all['catalogSkus'] || state.skus;
    state.warehouseItems = newWarehouseItems;
    state.variants = newVariants;

    const newPending = await fetchPendingPackingOrders();
    const newlyAppeared = newPending.filter(o=>!prevPendingIds.has(o.id));
    state.pendingPackingOrders = newPending;

    if(newlyAppeared.length>0){
      state.newOrderPopup = { count: newlyAppeared.length, orderNos: newlyAppeared.map(o=>o.orderNo) };
      playAlertSound();
    }
    render();
  }catch(e){ /* silent — a failed background refresh isn't worth interrupting the user for */ }
}

function processStockCountScan(barcode){

  const el = document.getElementById('sc-scan-input'); if(el) el.value='';
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  if(!item){
    playAlertSound();
    if(navigator.vibrate) navigator.vibrate([120,60,120,60,120]);
    state.stockCountUnknownBarcode = barcode;
    render();
    setTimeout(()=>{ const el=document.getElementById('sc-new-ref'); if(el) el.focus(); }, 60);
    return;
  }
  playSuccessBeep();
  if(navigator.vibrate) navigator.vibrate(60);
  if(!state.stockCountLocalEntries[barcode]){
    state.stockCountLocalEntries[barcode] = {barcode, refNo:item.refNo, colorName:item.colorName, sizeLabel:item.sizeLabel, countedQty:0};
  }
  state.stockCountLocalEntries[barcode].countedQty += 1;
  render();
}

  const sizeLabel = document.getElementById('sc-new-size').value.trim();

  // Register it locally (in-memory) so it behaves like any other known barcode for the rest of
  // this session — the actual Depo kaydı (warehouseItem) only gets created server-side once the
  // count is finalized and applied, exactly like a normal counted item with 0 prior stock.
  const item = { barcode, refNo, colorName, sizeLabel, stock: 0 };

function variantsFor(productId){ return state.variants.filter(v=>v.productId===productId).sort((a,b)=>a.colorOrder-b.colorOrder); }
function skusFor(variantId){ return state.skus.filter(s=>s.variantId===variantId).sort((a,b)=>a.sizeOrder-b.sizeOrder); }
function sizeNumberOnly(sizeLabel){
  if(!sizeLabel) return '';
  const m = String(sizeLabel).match(/(\d+)\s*$/);
  return m ? m[1] : String(sizeLabel).trim();
}
function extractSizeNum(label){
  const m = String(label||'').match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function naturalOrderLineSort(a, b){
  if(a.refNo!==b.refNo) return String(a.refNo||'').localeCompare(String(b.refNo||''));
  if(a.colorName!==b.colorName) return String(a.colorName||'').localeCompare(String(b.colorName||''));
  const na = extractSizeNum(a.sizeLabel), nb = extractSizeNum(b.sizeLabel);
  if(na!==null && nb!==null && na!==nb) return na-nb;
  return String(a.sizeLabel||'').localeCompare(String(b.sizeLabel||''));
}
function detailRefLabel(refNo, colorName, sizeLabel){
  const parts = [refNo, colorName, sizeNumberOnly(sizeLabel)].filter(p=>p!==undefined && p!==null && String(p).trim()!=='');
  return parts.join(' ').toUpperCase();
}
function priceForBarcode(barcode, refNoFallback){
  const sku = state.skus.find(s=>s.barcode===barcode);

    if(variant){
      const product = state.products.find(p=>p.id===variant.productId);
      if(product) return Number(product.price)||0;

    const product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNoFallback).trim().toUpperCase());

async function updateDepoPrice(barcode, refNoFallback, newPrice){
  const price = Number(newPrice);
  if(isNaN(price) || price < 0){ showToast('Geçerli bir fiyat girin'); render(); return; }
  const sku = state.skus.find(s=>s.barcode===barcode);
  let product = null;
  if(sku){

  }
  if(!product && refNoFallback){
    product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNoFallback).trim().toUpperCase());
  }
  const oldPrice = product ? (Number(product.price)||0) : 0;

    const ok = confirm(`Ref ${product.refNo} fiyatını $${formatMoney(oldPrice)}'den $${formatMoney(price)}'ye güncellemek istediğinize emin misiniz? Bu, tüm renk ve bedenleri etkileyecek.`);
    if(!ok){ render(); return; }
  }
  let isNewProduct = false;
  if(!product){
    if(!refNoFallback){ showToast('Bu kayıt için referans bilgisi eksik, fiyat girilemiyor'); return; }
    product = {id:uid(), refNo:refNoFallback, name:'', price:0, createdAt:todayISO(), createdBy:session.displayName};
    state.products.push(product);
    isNewProduct = true;
  }
  product.price = price;
  render();

  if(ok2) showToast('Fiyat güncellendi — Ref ' + product.refNo + '\'in tüm renk ve bedenlerini etkiler');
}

// Shared helper — every stock movement (manual, bulk import, scan) goes through this.
let pendingCriticalWrites = 0;
function beginCriticalWrite(){ pendingCriticalWrites++; }
function endCriticalWrite(){ pendingCriticalWrites = Math.max(0, pendingCriticalWrites-1); }
window.addEventListener('beforeunload', function(e){
  if(pendingCriticalWrites > 0){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
async function postStockMovement(barcode, type, qty, note, refNo, colorName, sizeLabel, isCorrection){
  beginCriticalWrite();
  const clientRequestId = uid() + '-' + Date.now();
  const body = JSON.stringify({action:'addStockMovement', auth:{username:session.username, passwordHash:session.passwordHash}, clientRequestId,
    movement:{barcode, refNo:refNo||'', colorName:colorName||'', sizeLabel:sizeLabel||'', type, qty, note:note||'', date: todayISO(), createdBy: session.displayName, isCorrection: !!isCorrection}});
  async function attempt(){
    const res = await fetchWithTimeout(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body }, 20000);
    return await res.json();
  }
  try{
    let data;
    try{
      data = await attempt();
    }catch(e){
      // Timed out or the connection dropped — the write may well have gone through server-side.
      // Retry ONCE with the same clientRequestId: if the first attempt did succeed, the server
      // returns the same cached result instead of applying the change again, so this is safe.
      data = await attempt();
    }
    if(data && data.ok){
      let item = state.warehouseItems.find(w=>w.barcode===barcode);
      if(!item){ item = {barcode, refNo:refNo||'', colorName:colorName||'', sizeLabel:sizeLabel||'', stock:0}; state.warehouseItems.push(item); }
      item.stock = data.stock;
      return {ok:true, stock:data.stock, item};
    }
    return {ok:false, blockReason: describeWriteBlock_(data)};
  }catch(e){ return {ok:false, networkError:true}; }
  finally{ endCriticalWrite(); }
}

const QTY_WARN_LIMIT = 1000;
function confirmHugeQty(qty){
  if(qty <= QTY_WARN_LIMIT) return true;
  return confirm(`⚠ DİKKAT: ${qty} adet girdiniz!\n\nBu çok yüksek bir miktar. Barkod okuyucu yanlışlıkla adet kutusuna barkod yazmış olabilir.\n\nGerçekten ${qty} adet mi kaydedilsin?\n\n"İptal" derseniz kayıt yapılmaz, miktarı düzeltebilirsiniz.`);
}
async function submitDepoMove(){
  const t = state.depoMoveTarget;
  const qty = parseInt(document.getElementById('dm-qty').value, 10);
  const note = document.getElementById('dm-note').value.trim();
  if(!qty || qty <= 0){ showToast('Geçerli bir miktar girin'); return; }
  if(!confirmHugeQty(qty)) return;
  if(t.type==='out'){
    const item = state.warehouseItems.find(w=>w.barcode===t.barcode);
    const currentStock = item ? (Number(item.stock)||0) : 0;
    if(qty > currentStock){
      const shortfall = qty - currentStock;
      const ok = confirm(`⚠ Depoda sadece ${currentStock} adet görünüyor, ${qty} adet çıkış girdiniz.\n\nBu genelde şu anlama gelir: ${shortfall} adet daha önce sisteme kaydedilmeden fiziksel olarak depoya girmiş (örn. bir üretim/iade kaydı unutulmuş) ve şimdi çıkışı yapılıyor.\n\n"Tamam" derseniz: gerçek çıkış miktarı olan ${qty} adet OLDUĞU GİBİ kaydedilir, ve eksi kalan ${shortfall} adet için otomatik bir "telafi girişi" eklenip stok 0'a getirilir — hem çıkış hem giriş geçmişi doğru kalır.\n\nBunun yerine sadece mevcut ${currentStock} adedi göndermek isterseniz "İptal"e basın.`);
      if(!ok){ return; } // person chose to send only the capped/available amount — do nothing further, they'll edit qty themselves
      state.depoMovePendingCorrection = shortfall; // apply after the real out-movement succeeds
    }
  }
  state.depoMoveRunning = true;
  render();
  const r = await postStockMovement(t.barcode, t.type, qty, note, t.refNo, t.colorName, t.sizeLabel);
  if(r.ok && state.depoMovePendingCorrection){
    const shortfall = state.depoMovePendingCorrection;
    state.depoMovePendingCorrection = null;
    await postStockMovement(t.barcode, 'in', shortfall, 'Kayıt dışı stok telafisi (sistemde görünmeyen ama fiilen depoda bulunan stok)', t.refNo, t.colorName, t.sizeLabel, true);
  }
  state.depoMoveRunning = false;
  if(r.ok){
    showDoneBanner('KAYIT TAMAMLANDI', (t.type==='in' ? 'Stok girişi' : 'Stok çıkışı')+' kaydedildi');
    if(state.returnToPackOrderId){
      const returnId = state.returnToPackOrderId;
      state.returnToPackOrderId = null;
      await refreshData();
      openPackOrderModal(returnId);
    } else {
      state.modalMode = null;
      render();
    }
  } else {
    showToast(r.networkError ? 'Sunucuya bağlanılamadı' : (r.blockReason || 'Kaydedilemedi — yetkinizi kontrol edin'));
    render();
  }
}

  if(productIds.size===0){
    showToast('Seçilenlerin hiçbiri şu an katalogda değil');

  state.depoBulkCatalogRunning = true;
  render();
  productIds.forEach(id=>{ const p = state.products.find(x=>x.id===id); if(p) p.active = false; });
  await patchProducts(Array.from(productIds).map(id=>({id, active:false})));
  state.depoBulkCatalogRunning = false;
  state.depoSelected = new Set();
  render();
  showToast(`${productIds.size} model kataloğdan kaldırıldı`);
}

function parseCombinedRef(text){
  // "261523 BLUE 1" -> {refNo:'261523', colorName:'BLUE', sizeLabel:'1'}
  const tokens = (text||'').trim().split(/\s+/).filter(Boolean);
  if(tokens.length===0) return {refNo:'', colorName:'', sizeLabel:''};
  if(tokens.length===1) return {refNo:tokens[0], colorName:'', sizeLabel:''};
  if(tokens.length===2) return {refNo:tokens[0], colorName:tokens[1], sizeLabel:''};
  return {refNo:tokens[0], colorName:tokens.slice(1,-1).join(' '), sizeLabel:tokens[tokens.length-1]};
}
function parseDepoBulkLines(raw){
  const rawLines = raw.split('\n');
  const items = [];
  const skippedLines = []; // {line, reason, rowNum}
  let batchDupes = 0;
  const seenInBatch = new Set();
  for(let li=0; li<rawLines.length; li++){
    const rowNum = li + 1; // matches the row number you'd see opening the same file in Excel/Sheets
    const line = rawLines[li].trim();
    if(!line) continue;
    if(/^Barkod\s*[,\t]/i.test(line)) continue; // skip a header row if present
    let cols = parseBulkLine(line).map(c=>(c||'').trim()).filter((c,i,arr)=> !(c==='' && i===arr.length-1 && arr.length>1));
    if(cols.length === 7) cols = healDecimalCommaSplit(cols, 6); // likely a split decimal price (Excel MS-DOS CSV + comma-decimal locale)
    let barcode, refNo, colorName, sizeLabel, qtyRaw, priceRaw;
    if(cols.length === 4){
      // Yeni sade format: Barkod, RefNo, Renk, Beden — miktar/fiyat yok, sadece model tanımı
      [barcode, refNo, colorName, sizeLabel] = cols;
      qtyRaw = ''; priceRaw = '';
    } else if(cols.length >= 5){
      // Ayrı sütunlu format: Barkod, RefNo, Renk, Beden, Miktar[, Fiyat]
      [barcode, refNo, colorName, sizeLabel, qtyRaw, priceRaw] = cols;
    } else if(cols.length >= 2){
      // Birleşik referans formatı: Barkod, "261523 BLUE 1"[, Miktar[, Fiyat]]
      barcode = cols[0];
      const combined = parseCombinedRef(cols[1]);
      refNo = combined.refNo; colorName = combined.colorName; sizeLabel = combined.sizeLabel;
      qtyRaw = cols.length >= 3 ? cols[2] : '';
      priceRaw = cols.length >= 4 ? cols[3] : '';
    } else if(cols.length === 1 && /\s/.test(cols[0])){
      // Hiç virgül/tab yok, tamamen boşlukla ayrılmış: Barkod 261523 BLUE 1 Miktar
      const tokens = cols[0].split(/\s+/).filter(Boolean);
      barcode = tokens[0];
      const lastIsNum = /^\d+$/.test(tokens[tokens.length-1]);
      const refTokens = lastIsNum && tokens.length>=3 ? tokens.slice(1,-1) : tokens.slice(1);
      const combined = parseCombinedRef(refTokens.join(' '));
      refNo = combined.refNo; colorName = combined.colorName; sizeLabel = combined.sizeLabel;
      qtyRaw = lastIsNum && tokens.length>=3 ? tokens[tokens.length-1] : '';
    } else {
      skippedLines.push({line, reason: 'Sütun sayısı yetersiz — en az barkod ve bir referans bilgisi gerekli', rowNum});
      continue;
    }
    barcode = (barcode||'').trim();
    const qty = parseInt(qtyRaw, 10);
    const price = parseFlexibleNumber(priceRaw);
    if(!barcode){ skippedLines.push({line, reason: 'Barkod sütunu boş', rowNum}); continue; }
    if(seenInBatch.has(barcode)){ batchDupes++; continue; } // aynı dosyada tekrar eden barkod — ilkini kullan
    seenInBatch.add(barcode);
    items.push({barcode, refNo:(refNo||'').trim(), colorName:(colorName||'').trim(), sizeLabel:(sizeLabel||'').trim(), openingStock: isNaN(qty)?0:qty, price: isNaN(price)?null:price, createdBy: session.displayName});
  }
  return {items, skipped: skippedLines.length, skippedLines, batchDupes};
}
const DEPO_BULK_CHUNK_SIZE = 40; // kept small deliberately — large chunks were timing out server-side
function setDepoBulkProgress(text, isError){
  const el = document.getElementById('depo-bulk-result');
  if(!el) return;
  el.style.display = 'block';
  el.className = 'bulk-result ' + (isError ? 'error' : 'ok');
  el.textContent = text;
}
async function sendDepoBulkImport(items, skipped, batchDupes, skippedLines, isRetry){
  skippedLines = skippedLines || [];
  if(items.length===0){ showToast('İçe aktarılacak geçerli satır bulunamadı'); return; }
  if(state.depoBulkRunning) return; // guard against double-submit
  state.depoBulkRunning = true;
  render();

  let chunks, chunkStatus;
  if(isRetry && state.depoBulkChunks){
    // Only resend chunks that failed last time — successful ones are not touched again.
    chunks = state.depoBulkChunks;
    chunkStatus = state.depoBulkChunkStatus;
  } else {
    chunks = [];
    for(let i=0;i<items.length;i+=DEPO_BULK_CHUNK_SIZE) chunks.push(items.slice(i, i+DEPO_BULK_CHUNK_SIZE));
    chunkStatus = chunks.map(()=>'pending');
    state.depoBulkChunks = chunks;
    state.depoBulkSkipped = skipped;
    state.depoBulkBatchDupes = batchDupes;
    state.depoBulkSkippedLinesData = skippedLines;
  }
  state.depoBulkChunkStatus = chunkStatus;

  let totalMovements = 0, totalProcessed = 0;
  const allConflicts = state.depoBulkAllConflicts && isRetry ? state.depoBulkAllConflicts : [];
  const chunkErrorReason = state.depoBulkChunkErrorReason && isRetry ? state.depoBulkChunkErrorReason : {};
  const toSend = chunks.map((c,i)=>i).filter(i=>chunkStatus[i]!=='ok');
  let doneSoFar = 0;
  for(const i of toSend){
    setDepoBulkProgress(`İşleniyor… parça ${doneSoFar+1}/${toSend.length} gönderiliyor (${chunks[i].length} kayıt) — lütfen bu pencereyi kapatmayın.`);
    try{
      const res = await fetchWithTimeout(API_URL, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'bulkImportWarehouse', auth:{username:session.username, passwordHash:session.passwordHash}, items:chunks[i]})
      }, 90000);
      const data = await res.json();
      if(data && data.ok){
        chunkStatus[i] = 'ok';
        delete chunkErrorReason[i];
        totalMovements += data.movementsWritten||0;
        if(data.conflicts && data.conflicts.length) allConflicts.push(...data.conflicts);
      } else {
        chunkStatus[i] = 'error';
        chunkErrorReason[i] = (data && data.error==='lock_timeout') ? 'sunucu meşgul (kilit zaman aşımı)' : 'sunucu hata döndürdü';
      }
    }catch(e){
      chunkStatus[i] = 'error';
      chunkErrorReason[i] = (e && e.name==='AbortError') ? 'zaman aşımı (parça çok uzun sürdü)' : 'ağ bağlantısı kesildi';
    }
    doneSoFar++;
  }
  state.depoBulkChunkErrorReason = chunkErrorReason;
  state.depoBulkAllConflicts = allConflicts;
  state.depoBulkTotalMovements = (state.depoBulkTotalMovements||0) + totalMovements;

  // Recompute totals across ALL chunks (including ones already ok from a previous attempt)
  totalProcessed = 0;
  chunks.forEach((c,i)=>{ if(chunkStatus[i]==='ok') totalProcessed += c.length; });
  const failedChunks = chunkStatus.filter(s=>s==='error').length;

  state.depoBulkRunning = false;

  // Apply any Fiyat (USD) values to catalog products — never for depocu (no price access).
  // Only applied once processing is fully complete (no more failed chunks left to retry).
  let pricesUpdated = 0;
  if(session.role !== 'depocu' && failedChunks===0){
    const priceByRef = {};
    items.forEach(it=>{ if(it.price!=null && it.refNo) priceByRef[it.refNo] = it.price; });
    const refKeys = Object.keys(priceByRef);
    if(refKeys.length>0){
      const upserts = [];
      refKeys.forEach(refNo=>{
        let product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNo).trim().toUpperCase());
        if(!product){
          product = {id:uid(), refNo, name:'', price:priceByRef[refNo], createdAt:todayISO(), createdBy:session.displayName};
          state.products.push(product);
          upserts.push(product); pricesUpdated++;
        } else if(product.price !== priceByRef[refNo]){
          product.price = priceByRef[refNo];
          upserts.push({id:product.id, price:priceByRef[refNo]}); pricesUpdated++;
        }
      });
      if(upserts.length>0) await patchProducts(upserts);
    }
  }

  if(totalProcessed > 0){ await refreshData(); }
  else { render(); }

  const skippedCount = state.depoBulkSkipped||0;
  const dupeCount = state.depoBulkBatchDupes||0;
  const noOpCount = state.depoBulkNoOpSkipped||0;
  const noteParts = [];
  if(noOpCount>0) noteParts.push(`${noOpCount} kayıt sistemdekiyle birebir aynı olduğu için hiç gönderilmedi`);
  if(skippedCount>0) noteParts.push(`${skippedCount} satır atlandı (altta detaylı liste var)`);
  if(dupeCount>0) noteParts.push(`${dupeCount} satır dosya içinde barkodu tekrar ettiği için atlandı`);
  if(pricesUpdated>0) noteParts.push(`${pricesUpdated} model için fiyat güncellendi`);
  if(allConflicts.length>0) noteParts.push(`⚠ ${allConflicts.length} barkod, sistemde FARKLI bir ürüne kayıtlıydı — stok yine de işlendi ama ürün bilgisi güncellenmedi, aşağıdan listeyi görüp indirebilirsiniz.`);
  const noteStr = noteParts.length ? (' ' + noteParts.join(' · ') + '.') : '';

  if(failedChunks===0){
    state.depoBulkResultText = `✓ Tamamlandı — ${totalProcessed} kayıt işlendi (${state.depoBulkTotalMovements} tanesi stok hareketi olarak eklendi).${noteStr}`;
    state.depoBulkResultIsError = allConflicts.length>0;
    state.depoBulkChunks = null; // done — nothing left to retry
    showToast('Toplu içe aktarma tamamlandı');
  } else {
    const reasons = Object.values(state.depoBulkChunkErrorReason||{});
    const reasonCounts = {};
    reasons.forEach(r=>{ reasonCounts[r]=(reasonCounts[r]||0)+1; });
    const topReason = Object.keys(reasonCounts).sort((a,b)=>reasonCounts[b]-reasonCounts[a])[0];
    state.depoBulkResultText = `${totalProcessed} / ${items.length} kayıt işlendi, ${failedChunks} parça gönderilemedi — sebep: ${topReason||'bilinmiyor'}.${noteStr}`;
    state.depoBulkResultIsError = true;
    showToast('Bazı parçalar aktarılamadı — aşağıdaki "Başarısız Parçaları Tekrar Dene" ile devam edin');
  }
  state.depoBulkSkippedLines = skippedLines;
  render();
}
function depoBulkItemIsNoOp(item){
  if(item.openingStock) return false; // has a quantity to apply — must send
  if(item.price != null) return false; // has a price to apply — must send
  const existing = state.warehouseItems.find(w=>w.barcode===item.barcode);
  if(!existing) return false; // genuinely new — must send
  const sameRef = padRef(existing.refNo||'') === padRef(item.refNo||'');
  const sameColor = (existing.colorName||'').trim().toUpperCase() === (item.colorName||'').trim().toUpperCase();
  const sameSize = (existing.sizeLabel||'').trim().toUpperCase() === (item.sizeLabel||'').trim().toUpperCase();
  return sameRef && sameColor && sameSize; // identical in every way — nothing to update
}
async function submitDepoBulkImport(){
  if(state.depoBulkRunning) return;
  state.depoBulkError = null;
  state.depoBulkResultText = null;
  state.depoBulkChunks = null;
  state.depoBulkTotalMovements = 0;
  state.depoBulkAllConflicts = [];
  state.depoBulkChunkErrorReason = {};
  let items, skipped, batchDupes, skippedLines;
  if(state.depoBulkFile){
    ({items, skipped, batchDupes, skippedLines} = state.depoBulkFile);
    state.depoBulkFile = null;
  } else {
    const raw = document.getElementById('depo-bulk-textarea').value;
    if(!raw || !raw.trim()){
      state.depoBulkError = 'Önce bir CSV dosyası seçin ya da kutuya veri yapıştırın.';
      render();
      return;
    }
    ({items, skipped, batchDupes, skippedLines} = parseDepoBulkLines(raw));
    if(items.length===0){
      state.depoBulkError = `Girdiğiniz veriden geçerli bir satır çıkmadı (${skipped} satır atlandı) — aşağıda hangi satırların neden atlandığını görebilirsiniz.`;
      state.depoBulkSkippedLines = skippedLines;
      render();
      return;
    }
  }
  const itemsToSend = items.filter(it=>!depoBulkItemIsNoOp(it));
  state.depoBulkNoOpSkipped = items.length - itemsToSend.length;
  state.depoBulkAllItems = itemsToSend;
  if(itemsToSend.length===0){
    state.depoBulkResultText = `✓ Gönderilecek bir şey yok — ${items.length} satırın hepsi zaten sistemdeki bilgiyle birebir aynı.`;
    state.depoBulkResultIsError = false;
    render();
    return;
  }
  await sendDepoBulkImport(itemsToSend, skipped, batchDupes, skippedLines);
}
async function retryDepoBulkImport(){
  if(state.depoBulkRunning || !state.depoBulkChunks) return;
  await sendDepoBulkImport(state.depoBulkAllItems, state.depoBulkSkipped, state.depoBulkBatchDupes, state.depoBulkSkippedLinesData, true);
}
function handleDepoBulkFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(state.depoBulkRunning){ e.target.value=''; return; }
  const nameLower = (file.name||'').toLowerCase();
  if(nameLower.endsWith('.xlsx') || nameLower.endsWith('.xls')){
    state.depoBulkFile = null;
    state.depoBulkError = `Bu araç .xlsx/.xls dosyası kabul etmiyor, sadece CSV. Excel'de dosyanızı açıp "Farklı Kaydet" → "CSV UTF-8 (Virgülle Ayrılmış) (.csv)" seçip öyle yükleyin.`;
    render();
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      let text = ev.target.result;
      if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip UTF-8 BOM if present
      const roughLineCount = (text.match(/\n/g)||[]).length;
      if(roughLineCount > 50000){
        state.depoBulkFile = null;
        state.depoBulkError = `Bu dosya beklenenden çok daha fazla satır içeriyor gibi görünüyor (${roughLineCount.toLocaleString('tr-TR')}) — muhtemelen yanlış bir dosya türü seçildi (örn. .xlsx bir dosya CSV yerine yanlışlıkla seçilmiş olabilir). Lütfen düz bir CSV dosyası seçtiğinizden emin olun.`;
        render();
        return;
      }
      const {items, skipped, batchDupes, skippedLines} = parseDepoBulkLines(text);
      state.depoBulkResultText = null;
      if(items.length===0){
        state.depoBulkFile = null;
        state.depoBulkError = `Dosyadan geçerli bir satır çıkmadı (${skipped} satır atlandı) — aşağıda hangi satırların neden atlandığını görebilirsiniz.`;
        state.depoBulkSkippedLines = skippedLines;
      } else {
        const willSkipCount = items.filter(it=>depoBulkItemIsNoOp(it)).length;
        state.depoBulkFile = {name:file.name, items, skipped, batchDupes, skippedLines, willSkipCount, willSendCount: items.length-willSkipCount};
        state.depoBulkError = null;
        state.depoBulkSkippedLines = skippedLines; // preview which lines will be skipped, before they even confirm the import
        showToast(`${items.length} satır dosyadan okundu — "İçe Aktar"a basın`);
      }
    }catch(err){

      state.depoBulkError = 'Dosya işlenirken bir hata oluştu: ' + (err && err.message ? err.message : err);
    }
    render();
  };
  reader.onerror = function(){ showToast('Dosya okunamadı'); };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

// ---------- Yeni Depo Kaydı — barkodu otomatik formülle üretir (admin/staff) ----------
async function ensureCatalogEntryForExistingBarcode(barcode, refNo, colorName, sizeLabel, initialImage){
  // Used for legacy/imported barcodes that already exist — reuses the given barcode
  // as-is instead of computing a new one, and allows non-numeric reference codes.
  let product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===String(refNo||'').trim().toUpperCase());
  if(!product){
    product = {id:uid(), refNo:(refNo||'').trim(), name:'', price:0, active:true, createdAt:todayISO(), createdBy:session.displayName};
    state.products = [...state.products, product];
    const ok = await patchProducts([product]);
    // patchProducts already showed the SPECIFIC reason (timeout / network / server rejection) via
    // its own toast — return a plain marker here rather than a generic message that would
    // overwrite and hide that more useful diagnostic text.
    if(!ok){ state.products = state.products.filter(p=>p!==product); return {error:true}; }
  } else if(product.active === false){
    product.active = true;
    const ok = await patchProducts([{id:product.id, active:true}]);
    if(!ok){ product.active = false; return {error:true}; }
  }
  let variant = state.variants.find(v=>v.productId===product.id && normColor(v.colorName)===normColor(colorName));
  if(!variant){
    const existingV = variantsFor(product.id);
    const colorOrder = existingV.length ? Math.max(...existingV.map(v=>v.colorOrder))+1 : 1;
    // Include the image right away if we already have it — avoids a separate follow-up write
    // for what is, in practice, the most common case (uploading a photo for a brand-new color).
    variant = {id:uid(), productId:product.id, colorName:normColor(colorName), colorOrder, image:initialImage||null, createdAt:todayISO(), createdBy:session.displayName};
    state.variants = [...state.variants, variant];
    const ok = await saveKey('catalogVariant:'+variant.id, variant);
    if(!ok){ state.variants = state.variants.filter(v=>v!==variant); return {error:true}; }
  }
  let sku = state.skus.find(s=>s.barcode===barcode);
  if(!sku){
    const existingS = skusFor(variant.id);
    const sizeOrder = existingS.length ? Math.max(...existingS.map(s=>s.sizeOrder))+1 : 1;
    const num = sizeNumberOnly(sizeLabel);
    const matchedSize = SIZES.find(s=>s.code===num);
    sku = {id:uid(), variantId:variant.id, sizeCode: matchedSize?matchedSize.code:null, sizeOrder, euSize: matchedSize?matchedSize.eu:null, customSizeLabel: matchedSize?'':(sizeLabel||''), barcode, createdAt:todayISO()};
    state.skus = [...state.skus, sku];
    const ok = await saveSkuRow(sku);
    if(!ok){ state.skus = state.skus.filter(s=>s!==sku); return {error:true}; }
  }
  return {productId:product.id, variantId:variant.id, skuId:sku.id};
}
async function toggleCatalogMembership(barcode){
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  if(!item) return;
  if(state.depoTogglingBarcodes.has(barcode)) return; // already in flight — ignore repeat clicks
  const product = item.refNo ? state.products.find(p=>padRef(p.refNo)===padRef(item.refNo)) : null;
  const isActive = !!(product && product.active !== false);
  state.depoTogglingBarcodes.add(barcode);
  beginCriticalWrite();
  try{
    if(isActive){
      render();
      showToast('Kataloğdan kaldırılıyor…', true);
      product.active = false;
      await patchProducts([{id:product.id, active:false}]);
      state.depoTogglingBarcodes.delete(barcode);
      render();
      showToast('Kataloğdan kaldırıldı — resim, fiyat ve depo stoğu korunuyor, istediğiniz zaman geri ekleyebilirsiniz');
    } else {
      if(!item.refNo && !item.colorName){ state.depoTogglingBarcodes.delete(barcode); showToast('Kataloğa eklemek için önce referans/renk bilgisi girin'); return; }
      render();
      showToast('Kataloğa ekleniyor…', true);
      const r = await ensureCatalogEntryForExistingBarcode(item.barcode, item.refNo, item.colorName, item.sizeLabel);
      state.depoTogglingBarcodes.delete(barcode);
      render();
      if(!r.error) showToast('Kataloğa eklendi — fotoğraf ve fiyat eklemek için Sipariş sayfasının Modeller sekmesinde ilgili modeli açın');
    }
  } finally {
    endCriticalWrite();
  }
}

function parseImageFilename(filename){
  const base = filename.replace(/\.[^.]+$/, '');
  const cleaned = base.replace(/_/g, '-').replace(/\s+/g, '-');
  const parts = cleaned.split('-').filter(Boolean);
  if(parts.length < 2) return null;
  const refNo = parts[0].replace(/[^0-9]/g,'');
  const colorName = parts.slice(1).join(' ').toUpperCase();
  if(!refNo || !colorName) return null;
  return {refNo, colorName};
}
function matchCountForRefColor(refNo, colorName){
  return state.warehouseItems.filter(w=> String(w.refNo||'').trim().toUpperCase()===refNo && (w.colorName||'').trim().toUpperCase()===colorName).length;
}
function openBulkImageModal(){ state.modalMode = 'bulkImage'; state.bulkImageRows = []; state.bulkImageRunning = false; render(); }
function handleBulkImageFiles(e){
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  state.bulkImageRows = files.map(f=>({
    fileName:f.name, parsed:parseImageFilename(f.name), description:'', status:'processing', processedImage:null
  }));
  render();
  files.forEach(async (file, idx)=>{
    const row = state.bulkImageRows[idx];
    if(!row.parsed){ row.status='unparsed'; render(); return; }
    try{
      const processed = await processImageFile(file);
      row.processedImage = processed;
      row.status = 'ready';
    }catch(err){
      row.status = 'error';
    }
    render();
  });
  e.target.value = '';
}
function removeBulkImageRow(idx){ state.bulkImageRows.splice(idx,1); render(); }
function updateBulkImageField(idx, field, value){
  const row = state.bulkImageRows[idx];
  if(!row) return;
  if(field==='refNo' || field==='colorName'){
    row.parsed = row.parsed || {refNo:'', colorName:''};
    row.parsed[field] = field==='refNo' ? value.replace(/[^0-9]/g,'') : value.toUpperCase();
    if(row.parsed.refNo && row.parsed.colorName) row.status = row.processedImage ? 'ready' : row.status;
  } else if(field==='description'){
    row.description = value;
  }
}
async function commitBulkImageImport(){
  const rows = state.bulkImageRows.filter(r=>r.status==='ready' && r.parsed && r.parsed.refNo && r.parsed.colorName);
  if(rows.length===0){ showToast('İçe aktarılacak, eşleşmesi tamamlanmış görsel yok'); return; }
  state.bulkImageRunning = true;
  render();

  let totalVariants=0, totalLinked=0;
  const productUpserts = [];
  const variantsToSave = [];
  const newSkusToSave = [];

  for(let i=0;i<rows.length;i++){
    const row = rows[i];
    state.bulkImageProgress = `İşleniyor… ${i+1} / ${rows.length} görsel (${row.fileName})`;
    render();
    const refNo = row.parsed.refNo, colorName = row.parsed.colorName, description = row.description.trim();

    let product = state.products.find(p=>String(p.refNo).trim().toUpperCase()===refNo);
    if(!product){
      product = {id:uid(), refNo, name:description, price:0, createdAt:todayISO(), createdBy:session.displayName};
      state.products.push(product);
      productUpserts.push(product);
    } else if(description && !product.name){
      product.name = description; productUpserts.push({id:product.id, name:description});
    }

    let variant = state.variants.find(v=>v.productId===product.id && normColor(v.colorName)===normColor(colorName));
    if(!variant){
      const existingV = variantsFor(product.id);
      const colorOrder = existingV.length ? Math.max(...existingV.map(v=>v.colorOrder))+1 : 1;
      variant = {id:uid(), productId:product.id, colorName:normColor(colorName), colorOrder, image:row.processedImage, createdAt:todayISO(), createdBy:session.displayName};
      state.variants.push(variant);
      totalVariants++;
    } else {
      variant.image = row.processedImage;
    }
    variantsToSave.push(variant);

    const matches = state.warehouseItems.filter(w=> String(w.refNo||'').trim().toUpperCase()===refNo && (w.colorName||'').trim().toUpperCase()===colorName);
    for(const w of matches){
      let sku = state.skus.find(s=>s.barcode===w.barcode);
      if(!sku){
        const existingS = skusFor(variant.id);
        const sizeOrder = existingS.length ? Math.max(...existingS.map(s=>s.sizeOrder))+1 : 1;
        const num = sizeNumberOnly(w.sizeLabel);
        const matchedSize = SIZES.find(s=>s.code===num);
        sku = {id:uid(), variantId:variant.id, sizeCode: matchedSize?matchedSize.code:null, sizeOrder, euSize: matchedSize?matchedSize.eu:null, customSizeLabel: matchedSize?'':(w.sizeLabel||''), barcode:w.barcode, createdAt:todayISO()};
        state.skus.push(sku);
        newSkusToSave.push(sku);
        totalLinked++;
      }
    }
  }

  if(productUpserts.length>0) await patchProducts(productUpserts);
  for(const v of variantsToSave) await saveKey('catalogVariant:'+v.id, v);
  for(const s of newSkusToSave) await saveSkuRow(s);

  state.bulkImageRunning = false;
  state.modalMode = null;
  render();
  showToast(`${rows.length} görsel işlendi — ${totalVariants} yeni renk, ${totalLinked} beden kataloğa bağlandı`);
}
function isBarcodeInCatalog(barcode){
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  if(!item || !item.refNo) return state.skus.some(s=>s.barcode===barcode);
  const product = state.products.find(p=>padRef(p.refNo)===padRef(item.refNo));
  return !!(product && product.active !== false);
}
function imageForRefColor(refNo, colorName){
  const product = state.products.find(p=>padRef(p.refNo)===padRef(refNo));
  if(!product) return null;
  const variant = state.variants.find(v=>v.productId===product.id && normColor(v.colorName)===normColor(colorName));
  return variant ? variant.image : null;
}
async function handleDepoRowImage(e, refNo, colorName, barcode){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  showToast('Resim işleniyor…', true);
  beginCriticalWrite();
  try{
    const processed = await processImageFile(file);
    const result = await ensureCatalogEntryForExistingBarcode(barcode, refNo, colorName, '', processed);
    if(result.error) return; // the underlying save already showed the specific reason
    const variant = state.variants.find(v=>v.id===result.variantId);
    if(variant.image !== processed){
      // The variant already existed (its image wasn't set at creation time above) — save it now.
      variant.image = processed;
      const ok = await saveKey('catalogVariant:'+result.variantId, variant);
      if(!ok) return; // saveKey already showed the specific reason
    }
    render();
    showToast('Resim kaydedildi');
  }catch(err){
    showToast('Resim işlenemedi — lütfen başka bir dosya deneyin');
  } finally {
    endCriticalWrite();
  }
}
async function deleteDepoRowImage(refNo, colorName){

  if(!variant) return;

  const ok = await saveKey('catalogVariant:'+variant.id, variant);
  if(!ok){ variant.image = old; render(); return; }

async function ensureCatalogSkuAndBarcode(refNo, refName, colorName, sizeCode){
  let product = state.products.find(p=>padRef(p.refNo)===padRef(refNo));
  if(!product){
    product = {id:uid(), refNo:String(refNo).replace(/[^0-9]/g,''), name:(refName||'').trim(), price:0, createdAt:todayISO(), createdBy:session.displayName};
    const saved = await patchProducts([product]);
    if(!saved) return {error:'Model kaydı oluşturulamadı — yukarıdaki mesaja bakıp tekrar deneyin'};
  }
  let variant = state.variants.find(v=>v.productId===product.id && normColor(v.colorName)===normColor(colorName));
  if(!variant){
    const existingV = variantsFor(product.id);
    if(existingV.length >= MAX_COLORS_PER_MODEL){ return {error:'Bu modelde en fazla ' + MAX_COLORS_PER_MODEL + ' renk olabilir'}; }
    const colorOrder = existingV.length ? Math.max(...existingV.map(v=>v.colorOrder))+1 : 1;
    variant = {id:uid(), productId:product.id, colorName:normColor(colorName), colorOrder, image:null, createdAt:todayISO(), createdBy:session.displayName};
    state.variants = [...state.variants, variant];
    await saveKey('catalogVariant:'+variant.id, variant);
  }
  let sku = state.skus.find(s=>s.variantId===variant.id && s.sizeCode===sizeCode);
  if(!sku){
    const existingS = skusFor(variant.id);
    if(existingS.length >= MAX_SIZES_PER_COLOR){ return {error:'Bu renkte en fazla ' + MAX_SIZES_PER_COLOR + ' beden olabilir'}; }
    const sizeOrder = existingS.length ? Math.max(...existingS.map(s=>s.sizeOrder))+1 : 1;
    const sizeInfo = SIZES.find(s=>s.code===sizeCode);
    const barcode = computeBarcode(product.refNo, variant.colorOrder, sizeOrder);
    sku = {id:uid(), variantId:variant.id, sizeCode, sizeOrder, euSize:sizeInfo.eu, barcode, createdAt:todayISO()};
    state.skus = [...state.skus, sku];
    await saveSkuRow(sku);
  }
  return {barcode: sku.barcode};
}

async function submitNewDepoItem(){
  const d = state.newDepoItemDraft || {};
  const refNo = (d.refNo||'').trim();
  const refName = (d.refName||'').trim();
  const colorName = (d.colorName||'').trim().toUpperCase();
  const unit = d.unit || 'Çift';
  const gender = d.gender || '';
  const season = d.season || '';
  if(!/^[0-9]{1,6}$/.test(refNo)){ showToast('Referans No 1-6 haneli bir sayı olmalı'); return; }
  if(!colorName){ showToast('Renk adı girin'); return; }
  const selectedSizes = SIZES.filter(s=>d.sizeChecked && d.sizeChecked[s.code]);
  if(selectedSizes.length===0){ showToast('En az bir beden seçin'); return; }

  state.newDepoItemSaving = true;
  state.newDepoItemError = null;
  render();

  const created = [];
  let failReason = null;
  for(let i=0;i<selectedSizes.length;i++){
    const sizeInfo = selectedSizes[i];
    state.newDepoItemProgress = `Kaydediliyor… (${i+1}/${selectedSizes.length}: ${sizeInfo.short})`;
    render();
    const qty = parseInt(d.sizeQty && d.sizeQty[sizeInfo.code], 10) || 0;
    const r = await ensureCatalogSkuAndBarcode(refNo, refName, colorName, sizeInfo.code);
    if(r.error){ failReason = r.error; break; }
    const existing = state.warehouseItems.find(w=>w.barcode===r.barcode);
    if(existing && (existing.refNo && existing.refNo!==refNo || existing.colorName && existing.colorName.toUpperCase()!==colorName)){
      failReason = '⚠ Barkod çakışması: ' + sizeInfo.short; break;
    }
    if(qty > 0){
      const res = await postStockMovement(r.barcode, 'in', qty, 'İlk depo kaydı', refNo, colorName, sizeInfo.short);
      if(!res || !res.ok){
        failReason = res && res.blockReason ? res.blockReason : (res && res.networkError ? 'Sunucuya bağlanılamadı — internet bağlantınızı kontrol edin' : 'Stok kaydı başarısız oldu');
        break;
      }
    } else if(!state.warehouseItems.find(w=>w.barcode===r.barcode)){
      state.warehouseItems.push({barcode:r.barcode, refNo, colorName, sizeLabel:sizeInfo.short, stock:0});
    }
    created.push({barcode:r.barcode, sizeLabel:sizeInfo.short, qty});
  }
  const allOk = !failReason;

  // Unit/gender/season + image apply once per ref/color, not per size
  if(allOk){
    const product = state.products.find(p=>padRef(p.refNo)===padRef(refNo));
    if(product){
      const patch = {id:product.id};
      let hasChange = false;
      if(unit && product.unit!==unit){ product.unit = unit; patch.unit = unit; hasChange = true; }
      if(gender && product.gender!==gender){ product.gender = gender; patch.gender = gender; hasChange = true; }
      if(season && product.season!==season){ product.season = season; patch.season = season; hasChange = true; }
      if(hasChange) await patchProducts([patch]);
      if(state.newDepoItemImage){
        const variant = state.variants.find(v=>v.productId===product.id && normColor(v.colorName)===normColor(colorName));
        if(variant){ variant.image = state.newDepoItemImage; await saveKey('catalogVariant:'+variant.id, variant); }
      }
    }
  }

  state.newDepoItemSaving = false;
  state.newDepoItemProgress = null;
  if(allOk){
    state.newDepoItemSuccess = { refNo, colorName, items: created };
    render();
  } else {
    const doneCount = created.length;
    const totalCount = selectedSizes.length;
    state.newDepoItemError = doneCount>0
      ? `⚠ ${failReason} — ${doneCount}/${totalCount} beden zaten kaydedildi (bunlar için tekrar denemenize gerek yok), kalan bedenleri ayrı ayrı eklemeyi deneyin.`
      : `⚠ ${failReason} — hiçbir beden kaydedilmedi.`;
    render();
  }
}

  state.packingOrderId = orderId;
  const saved = order.packingProgress || {};
  const shipped = order.shippedQuantities || {};
  state.packingProgress = {};
  order.lines.forEach(l=>{
    const remaining = l.qty - (shipped[l.barcode]||0);
    if(remaining>0) state.packingProgress[l.barcode] = Math.min(saved[l.barcode]||0, remaining);
  });
  state.packScanError = null;
  state.modalMode = 'packOrder';
  render();
  const hasSavedProgress = Object.values(state.packingProgress).some(v=>v>0);
  if(hasSavedProgress) showToast('Kaydedilmiş ilerleme yüklendi — kaldığınız yerden devam edebilirsiniz');
  setTimeout(()=>{ const el=document.getElementById('pack-scan-input'); if(el) el.focus(); }, 60);
}

let packSaveTimer = null;

async function savePackingProgressNow(){

  if(!state.packingOrderId) return;
  try{
    await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'savePackingProgress', auth:{username:session.username, passwordHash:session.passwordHash}, orderId: state.packingOrderId, packingProgress: state.packingProgress})
    }, 15000);
    // Keep the local pendingPackingOrders cache in sync too, so re-opening later (without a full refresh) still shows it.
    const order = state.pendingPackingOrders.find(o=>o.id===state.packingOrderId);

function remainingForLine(order, barcode){
  const line = order.lines.find(l=>l.barcode===barcode);

}
// ---------- Camera barcode scanning (phone camera, no physical scanner needed) ----------
let cameraScannerInstance = null;
let cameraScannerMode = null; // 'quick' or 'pack'
let cameraScannerLastCode = null; // the code currently sitting in view, already processed
let cameraScannerArmed = true;    // true = ready to accept the next (different) scan
let cameraScannerLastScanAt = 0;  // enforce a minimum gap between accepted scans
// Minimum time (ms) that must pass between two accepted camera scans (even for different
// barcodes). Higher = slower/more deliberate scanning, lower = faster but easier to double-read.
// To adjust yourself: just change this one number, save, and re-upload depo.html.
const CAMERA_SCAN_MIN_INTERVAL_MS = 1000;
async function openCameraScanner(mode, keepBatch){
  if(!window.Html5Qrcode){ showToast('Kamera kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin'); return; }
  cameraScannerMode = mode;
  cameraScannerLastCode = null;
  cameraScannerArmed = true;
  cameraScannerLastScanAt = 0;
  if(mode==='quick' && !keepBatch){
    state.cameraBatchItems = {};
    state.cameraReviewing = false;
    if(!state.scan || !state.scan.mode) state.scan = { mode: 'out', stage:'scan', barcode:'', item:null, sessionLog:[], negativeStockFlags:[], batchItems:{}, batchCommitting:false, rapidMode:true, lastResult:null };
  }
  state.modalMode = 'cameraScanner';
  render();
  setTimeout(async ()=>{
    try{
      cameraScannerInstance = new Html5Qrcode('camera-scan-region');
      const formats = [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.CODE_39];
      await cameraScannerInstance.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 260, height: 140 }, formatsToSupport: formats },
        (decodedText)=>{
          // Same code still sitting in the frame from the last successful read — ignore until
          // it's removed from view (tracked below) or a genuinely different code appears.
          if(!cameraScannerArmed && decodedText === cameraScannerLastCode) return;
          // Also enforce a minimum real-world gap between accepted scans, even for different
          // codes — the camera reads much faster than someone can physically move to the next item.
          const now = Date.now();
          if(now - cameraScannerLastScanAt < CAMERA_SCAN_MIN_INTERVAL_MS) return;
          cameraScannerLastScanAt = now;
          cameraScannerLastCode = decodedText;
          cameraScannerArmed = false;
          if(cameraScannerMode === 'quick') processCameraQuickScan(decodedText);
          else if(cameraScannerMode === 'pack') { if(navigator.vibrate) navigator.vibrate(80); updateCameraScanFeedback(decodedText, 'reading'); processPackScan(decodedText); }
        },
        ()=>{
          // No code decoded in this frame — the barcode has left the view (or never entered it).
          // Re-arm so the same code can be scanned again next time it's shown.
          cameraScannerArmed = true;
          cameraScannerLastCode = null;
        }
      );
    }catch(err){
      showToast('Kameraya erişilemedi — tarayıcının kamera iznini kontrol edin');
      state.modalMode = null;
      render();
    }
  }, 100);
}
function setCameraScanMode(mode){
  if(!state.scan) state.scan = { mode: 'out', stage:'scan', barcode:'', item:null, sessionLog:[], negativeStockFlags:[], batchItems:{}, batchCommitting:false, rapidMode:true, lastResult:null };
  state.scan.mode = mode;

  const outBtn = document.getElementById('camera-mode-out');

    if(mode==='in'){

function processCameraQuickScan(barcode){
