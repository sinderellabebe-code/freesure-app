function processPackScan(barcode){
  barcode = (barcode||'').trim();
  if(!barcode) return;
  const order = state.pendingPackingOrders.find(o=>o.id===state.packingOrderId);
  if(!order) return;
  const line = order.lines.find(l=>l.barcode===barcode);
  if(!line){
    if(state.modalMode==='cameraScanner'){ stopCameraStream(); state.modalMode = 'packOrder'; }
    playAlertSound();
    if(navigator.vibrate) navigator.vibrate([120,60,120,60,120]);
    state.packScanError = 'Bu barkod bu siparişte yok: ' + barcode;
    showBigScanAlert('BU SİPARİŞTE YOK', barcode, 'pack-scan-input');
    return;
  }
  const remaining = remainingForLine(order, barcode);
  const current = state.packingProgress[barcode] || 0;
  if(remaining<=0 || current >= remaining){
    if(state.modalMode==='cameraScanner'){ stopCameraStream(); state.modalMode = 'packOrder'; }
    playAlertSound();
    if(navigator.vibrate) navigator.vibrate([120,60,120,60,120]);
    state.packScanError = remaining<=0
      ? `⚠ FAZLA OKUTMA: ${detailRefLabel(line.refNo, line.colorName, line.sizeLabel)} — bu ürün için tüm miktar zaten hazırlanmış!`
      : `⚠ FAZLA OKUTMA: ${detailRefLabel(line.refNo, line.colorName, line.sizeLabel)} — kalan ${remaining} adet zaten tamamlandı, fazladan okuttunuz! Fazlalığı elinizden çıkarıp aşağıdaki düğmeyle devam edin.`;
    showBigScanAlert('FAZLA OKUTMA', detailRefLabel(line.refNo, line.colorName, line.sizeLabel), 'pack-scan-input');
  } else {
    state.packScanError = null;
    state.packingProgress[barcode] = current + 1;
    schedulePackingProgressSave();
    if(state.modalMode==='cameraScanner'){ updateCameraScanCountDisplay(); return; }
  }
  render();
  setTimeout(()=>{ const el=document.getElementById('pack-scan-input'); if(el) el.focus(); }, 60);
}
function handlePackScanKey(e){

function setPackQtyManual(barcode, value){
  const order = state.pendingPackingOrders.find(o=>o.id===state.packingOrderId);
  const line = order ? order.lines.find(l=>l.barcode===barcode) : null;
  const max = line ? remainingForLine(order, barcode) : 999999;
  const entered = parseInt(value,10)||0;
  if(line && entered > max){
    playAlertSound();
    state.packScanError = `⚠ FAZLA GİRİŞ: ${detailRefLabel(line.refNo, line.colorName, line.sizeLabel)} — kalan ${max} adet, girdiğiniz ${entered} adet. En fazla ${max} girilebilir.`;
  } else {
    state.packScanError = null;
  }
  state.packingProgress[barcode] = Math.max(0, Math.min(max, entered));
  schedulePackingProgressSave();

}
function packingAllMatched(order){
  return order.lines.every(l=> (state.packingProgress[l.barcode]||0) >= remainingForLine(order, l.barcode));

async function submitPackOrder(){
  const order = state.pendingPackingOrders.find(o=>o.id===state.packingOrderId);
  if(!order) return;
  const totalConfirmed = Object.values(state.packingProgress).reduce((s,v)=>s+(Number(v)||0),0);
  const totalOrdered = order.lines.reduce((s,l)=>s+l.qty,0);
  const totalAlreadyShipped = order.lines.reduce((s,l)=>s+((order.shippedQuantities&&order.shippedQuantities[l.barcode])||0),0);
  if(totalConfirmed===0){
    alert('Hiçbir ürün okutulmadı veya girilmedi. "Hazırlandı" olarak kaydetmeden önce en az bir ürün okutmanız veya adet girmeniz gerekir.');
    return;
  }
  const willTotal = totalAlreadyShipped + totalConfirmed;
  if(!packingAllMatched(order)){
    if(!confirm(`Bu oturumda ${totalConfirmed} adet onaylandı (toplamda ${willTotal} / ${totalOrdered}). Sipariş henüz tam değil — onaylanan miktar stoktan düşülecek, sipariş "Bekleyen Siparişler" listesinde eksik olarak kalmaya devam edecek. Onaylıyor musunuz?`)) return;
  }
  state.packingRunning = true;
  render();
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'shipOrder', auth:{username:session.username, passwordHash:session.passwordHash}, orderId: order.id, shippedBy: session.displayName, packedQuantities: state.packingProgress})
    }, 30000);
    const data = await res.json();
    state.packingRunning = false;
    if(data && data.ok){
      state.modalMode = 'pendingOrders';
      state.packingOrderId = null;
      await refreshData();
      showToast(data.fullyShipped ? 'Sipariş hazırlandı olarak işaretlendi' : `${totalConfirmed} adet stoktan düşüldü — sipariş eksik olarak bekleyen listede kaldı`);
    } else {
      showToast('Kaydedilemedi — tekrar deneyin');
      render();
    }
  }catch(e){
    state.packingRunning = false;
    showToast('Sunucuya bağlanılamadı'+(typeof e!=='undefined'&&e&&e.message?' ('+e.message+')':''));
    render();
  }
}

// Distinct two-tone alert sound — different from a typical barcode-scanner beep,
// so the operator notices a problem even without looking at the screen.
let audioCtx = null;
function playSuccessBeep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1046; // pleasant, distinct from the error tone
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now+0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.13);
  }catch(e){ /* audio unavailable — vibration/visual feedback still works */ }
}
function playAlertSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [660, 330, 660].forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      const t = now + i*0.18;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(1.0, t+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.17);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t+0.18);
    });
  }catch(e){ /* audio unavailable — ignore, visual warning still shows */ }
}
function processQuickScan(barcode){
  barcode = (barcode||'').trim();
  if(!barcode) return;
  if(hasUnresolvedUnknownScan()) return; // blocked until the pending unknown entry is resolved
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  if(!item){
    if(state.modalMode==='cameraScanner'){ stopCameraStream(); state.modalMode = 'scan'; }
    const el = document.getElementById('scan-barcode'); if(el) el.value = '';
    playAlertSound();
    if(navigator.vibrate) navigator.vibrate([120,60,120,60,120]);
    const entryId = uid();
    state.scan.sessionLog.unshift({id:entryId, barcode, status:'unknown'});
    showBigScanAlert('BARKOD TANINMIYOR', barcode, 'scan-barcode');
    return;
  }
  if(state.scan.rapidMode){
    // Accumulate locally first — nothing is sent to the server until the operator reviews the
    // list and presses "Kaydet". This gives a chance to fix a misread (wrong qty, duplicate,
    // wrong barcode) before it's committed, at the cost of not being instantaneous per-scan.
    const el = document.getElementById('scan-barcode'); if(el) el.value = '';
    if(!state.scan.batchItems[barcode]){
      state.scan.batchItems[barcode] = { barcode, refNo:item.refNo, colorName:item.colorName, sizeLabel:item.sizeLabel, qty:0 };
    }
    state.scan.batchItems[barcode].qty += 1;
    playSuccessBeep();
    render();
  } else {
    if(state.modalMode==='cameraScanner'){ stopCameraStream(); state.modalMode = 'scan'; }
    state.scan.barcode = barcode;
    state.scan.item = item;
    state.scan.stage = 'qty';
    render();
    setTimeout(()=>{ const el=document.getElementById('scan-qty'); if(el){ el.focus(); el.select(); } }, 60);
  }
}
function adjustScanBatchQty(barcode, delta){
  const it = state.scan.batchItems[barcode];
  if(!it) return;
  it.qty = Math.max(0, it.qty + delta);
  if(it.qty===0) delete state.scan.batchItems[barcode];
  render();
}
function removeScanBatchItem(barcode){
  delete state.scan.batchItems[barcode];
  render();
}
function scanBatchTotalQty(){
  return Object.values(state.scan.batchItems||{}).reduce((s,it)=>s+it.qty, 0);
}
async function commitScanBatch(){
  const items = Object.values(state.scan.batchItems||{}).filter(it=>it.qty>0);
  if(items.length===0) return;
  const bigItem = items.find(it=>it.qty>QTY_WARN_LIMIT);
  if(bigItem && !confirmHugeQty(bigItem.qty)) return;
  state.scan.batchCommitting = true;
  render();
  for(const it of items){
    let entry = state.scan.sessionLog.find(l=>l.barcode===it.barcode && l.mode===state.scan.mode && l.status!=='unknown');
    if(!entry){
      entry = { id: uid(), barcode: it.barcode, refNo: it.refNo, colorName: it.colorName, sizeLabel: it.sizeLabel,
        mode: state.scan.mode, scanCount: 0, totalQty: 0, pendingCount: 0, errorCount: 0, status: 'pending', stock: null };
      state.scan.sessionLog.unshift(entry);
    } else {
      state.scan.sessionLog = state.scan.sessionLog.filter(l=>l!==entry);
      state.scan.sessionLog.unshift(entry);
    }
    entry.scanCount += it.qty;
    entry.pendingCount++;
    entry.status = 'pending';
    render();
    await processQueuedScan(entry, it.qty);
  }
  state.scan.batchItems = {};
  state.scan.batchCommitting = false;
  render();
  const failed = (state.scan.sessionLog||[]).some(l=>l.errorCount>0 && l.status!=='ok');
  if(!failed) showDoneBanner('TÜM KAYITLAR TAMAMLANDI', `${items.length} kalem kaydedildi`);
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 60);
}
function hasUnresolvedUnknownScan(){
  return (state.scan.sessionLog||[]).some(l=>l.status==='unknown');

// Queue a scan for background processing — returns immediately so the operator can keep scanning
// without waiting for the server round-trip. Each entry shows its own pending/ok/error status.
function flagNegativeStock(barcode, refNo, colorName, sizeLabel, stock){
  if(state.scan.negativeStockFlags.some(f=>f.barcode===barcode)) return; // already flagged this session
  state.scan.negativeStockFlags.push({barcode, refNo, colorName, sizeLabel, stock});
  playAlertSound();
}
async function fixOneNegativeStock(barcode){
  const flag = state.scan.negativeStockFlags.find(f=>f.barcode===barcode);
  if(!flag) return;
  const qty = Math.abs(flag.stock);
  // The negative balance means more was scanned OUT than the system had on record — i.e. some
  // physical stock existed but was never logged as an "in" movement. The correct fix is a
  // compensating IN for the untracked quantity (bringing the balance to exactly 0), NOT erasing
  // or reducing the OUT movements that already happened — those really did leave the depo and
  // must stay in the history exactly as recorded.
  const r = await postStockMovement(barcode, 'in', qty, 'Kayıt dışı stok telafisi (sistemde görünmeyen ama fiilen depoda bulunan stok)', flag.refNo, flag.colorName, flag.sizeLabel, true);
  if(r.ok){
    state.scan.negativeStockFlags = state.scan.negativeStockFlags.filter(f=>f.barcode!==barcode);
    showToast(`${flag.barcode} stoğu 0'a düzeltildi (${qty} adet telafi girişi eklendi, önceki çıkış kayıtları değişmedi)`);
    render();
  } else {
    showToast('Düzeltme kaydedilemedi — tekrar deneyin');
  }
}
async function fixAllNegativeStock(){
  const flags = [...state.scan.negativeStockFlags];
  if(flags.length===0) return;
  if(!confirm(`${flags.length} barkodun eksi stoğu 0'a düzeltilecek. Onaylıyor musunuz?`)) return;
  for(const f of flags){ await fixOneNegativeStock(f.barcode); }
  showToast('Tüm eksi stoklar düzeltildi');
}
async function processQueuedScan(entry, qty){
  const r = await postStockMovement(entry.barcode, entry.mode, qty, 'Hızlı tarama', entry.refNo, entry.colorName, entry.sizeLabel);
  entry.pendingCount--;
  if(r.ok){
    entry.totalQty += qty;
    entry.stock = r.stock;
    entry.status = entry.pendingCount>0 ? 'pending' : (entry.errorCount>0 ? 'partial' : 'ok');
    if(r.stock < 0) flagNegativeStock(entry.barcode, entry.refNo, entry.colorName, entry.sizeLabel, r.stock);
    if(state.modalMode==='cameraScanner') updateCameraScanFeedback(entry.barcode, 'ok');
  } else {
    entry.errorCount++;
    entry.scanCount--; // this particular scan attempt didn't actually count — doesn't inflate the total
    entry.status = entry.pendingCount>0 ? 'pending' : 'error';
    playAlertSound();
    if(r.blockReason) showBigScanAlert('İŞLEM ENGELLENDİ', r.blockReason, 'scan-barcode');
    if(state.modalMode==='cameraScanner') updateCameraScanFeedback(entry.barcode, 'error');
  }
  render();
  const stillPending = (state.scan.sessionLog||[]).some(l=>l.pendingCount>0);
  if(r.ok && !stillPending && !state.scan.batchCommitting){
    showDoneBanner('KAYIT TAMAMLANDI', `${entry.mode==='out'?'Çıkış':'Giriş'} kaydedildi — Yeni stok: ${r.stock}`);
  }
}
function retryQueuedScan(entryId){
  const entry = state.scan.sessionLog.find(x=>x.id===entryId);
  if(!entry) return;
  entry.errorCount = Math.max(0, entry.errorCount-1);
  entry.scanCount++;
  entry.pendingCount++;
  entry.status = 'pending';
  render();
  processQueuedScan(entry, 1);
}
async function submitScanMovement(qty){
  const item = state.scan.item, mode = state.scan.mode;
  state.scan.stage = 'pending';
  state.scan.lastResult = { ok:true, text: `⏳ ${detailRefLabel(item.refNo,item.colorName,item.sizeLabel)} kaydediliyor…`, pending:true };
  render();
  const r = await postStockMovement(item.barcode, mode, qty, 'Hızlı tarama', item.refNo, item.colorName, item.sizeLabel);
  if(r.ok){
    let entry = state.scan.sessionLog.find(l=>l.barcode===item.barcode && l.mode===mode && l.status!=='unknown');
    if(!entry){
      entry = { id: uid(), barcode: item.barcode, refNo: item.refNo, colorName: item.colorName, sizeLabel: item.sizeLabel,
        mode, scanCount: 0, totalQty: 0, pendingCount: 0, errorCount: 0, status: 'ok', stock: null };
      state.scan.sessionLog.unshift(entry);
    } else {
      state.scan.sessionLog = state.scan.sessionLog.filter(l=>l!==entry);
      state.scan.sessionLog.unshift(entry);
    }
    entry.scanCount++;
    entry.totalQty += qty;
    entry.stock = r.stock;
    entry.status = entry.errorCount>0 ? 'partial' : 'ok';
    state.scan.lastResult = { ok:true, text: `✓ ${detailRefLabel(item.refNo,item.colorName,item.sizeLabel)} — ${mode==='out'?'Çıkış':'Giriş'} ${qty} kaydedildi (Yeni stok: ${r.stock})` };
    if(r.stock < 0) flagNegativeStock(item.barcode, item.refNo, item.colorName, item.sizeLabel, r.stock);
    showDoneBanner('KAYIT TAMAMLANDI', `${mode==='out'?'Çıkış':'Giriş'} ${qty} adet — Yeni stok: ${r.stock}`);
  } else {
    state.scan.lastResult = { ok:false, text: r.networkError ? '⚠ Sunucuya bağlanılamadı — kaydedilmedi, tekrar deneyin' : '⚠ Kaydedilemedi, tekrar deneyin' };
  }
  state.scan.stage = 'scan'; state.scan.barcode=''; state.scan.item=null;
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 60);
}
async function handleScanQtyKey(e){
  if(e.key !== 'Enter') return;
  const qty = parseInt(e.target.value, 10) || 1;
  if(!confirmHugeQty(qty)){ e.target.select(); return; }
  await submitScanMovement(qty);
}

function handleLogoUpload(e){

  reader.readAsDataURL(file);
}

// ---------- render ----------
function render(){
  const root = document.getElementById('root');
  if(!state.loaded){ root.innerHTML = '<div class="loading">Yükleniyor…</div>'; return; }

  // The camera scanner attaches a live video stream to #camera-scan-region. Rebuilding the whole
  // page HTML would destroy that element and kill the camera. Once it's up and running, skip
  // re-rendering entirely while this modal is open — nothing in that modal depends on state.
  if(state.modalMode === 'cameraScanner' && document.getElementById('camera-scan-region') && document.getElementById('camera-scan-region').childElementCount > 0){
    return;
  }

  // Preserve focus + cursor position across the innerHTML rebuild below —
  // otherwise every keystroke in a text input loses focus (cursor stops blinking).
  const activeEl = document.activeElement;
  let focusInfo = null;
  if(activeEl && activeEl.id && root.contains(activeEl)){
    focusInfo = { id: activeEl.id, start: activeEl.selectionStart, end: activeEl.selectionEnd };
  }

  // Preserve scroll position too — e.g. checking a box in a long Depo list shouldn't jump back to the top.
  const pageScrollY = window.scrollY;
  const tableWrapEl = document.querySelector('.depo-table-wrap');
  const tableWrapScrollTop = tableWrapEl ? tableWrapEl.scrollTop : null;
  const packListEl = document.getElementById('pack-list-scroll');
  const packListScrollTop = packListEl ? packListEl.scrollTop : null;

  const isDepocu = session.role === 'depocu';
  const roleLabel = session.role==='admin' ? 'Yönetici' : (session.role==='depocu' ? 'Depocu' : 'Personel');

  let html = `<div class="banner">
    <div class="brand-row">
      <div class="brand-logo-wrap">

function parseFlexibleNumber(str){
  // Accepts both "8.50" (dot decimal) and "8,50" (comma decimal, Turkish/European style) so the
  // person doesn't have to remember to always type a dot. Also handles "1.234,50" (dot as
  // thousands separator, comma as decimal) in case a larger price gets pasted in that format.
  if(str==null) return NaN;
  str = String(str).trim();
  str = str.replace(/[$₺€£]/g, '').trim(); // strip currency symbols (our own export prefixes prices with $)
  if(/^\d{1,3}(\.\d{3})+,\d+$/.test(str)){
    str = str.replace(/\./g, '').replace(',', '.'); // European: dot=thousands, comma=decimal
  } else if(/^\d+,\d+$/.test(str)){
    str = str.replace(',', '.'); // plain comma-as-decimal, any number of digits after it
  }
  return parseFloat(str);
}
function healDecimalCommaSplit(cols, expectedCount){
  // Excel's "MS-DOS Comma Separated CSV" export, combined with a Turkish/European locale where
  // "," is the decimal separator, turns a single value like "8,5" into TWO CSV columns ("8" and "5")
  // since comma is also the field delimiter. If we see more columns than expected and two adjacent
  // ones are both plain integers, they're almost certainly a split decimal — merge them back.
  cols = cols.slice();
  while(cols.length > expectedCount){
    let merged = false;
    for(let i=cols.length-2; i>=0; i--){
      if(/^\d+$/.test(cols[i]) && /^\d+$/.test(cols[i+1])){
        cols[i] = cols[i] + '.' + cols[i+1];
        cols.splice(i+1,1);
        merged = true;
        break;
      }
    }
    if(!merged) break; // can't safely repair further — leave as-is, validation below will catch it
  }
  return cols;
}
function parseStockPriceUpdateLines(raw){
  const rawLines = raw.split('\n');
  const updates = [];
  const skippedLines = [];
  for(let li=0; li<rawLines.length; li++){
    const rowNum = li + 1;
    const line = rawLines[li].trim();
    if(!line) continue;
    if(/^Barkod\s*[,\t]/i.test(line)) continue; // header row
    let cols = parseBulkLine(line).map(c=>(c||'').trim());
    if(cols.length > 3) cols = healDecimalCommaSplit(cols, 3);
    const barcode = (cols[0]||'').trim();
    const stockRaw = (cols[1]||'').trim();
    const priceRaw = (cols[2]||'').trim();
    if(!barcode){ skippedLines.push({line, reason:'Barkod sütunu boş', rowNum}); continue; }
    if(!stockRaw && !priceRaw){ skippedLines.push({line, reason:'Ne stok ne fiyat girilmiş — güncellenecek bir şey yok', rowNum}); continue; }
    const newStock = stockRaw ? parseInt(stockRaw,10) : null;
    const newPrice = priceRaw ? parseFlexibleNumber(priceRaw) : null;
    if(stockRaw && isNaN(newStock)){ skippedLines.push({line, reason:'Stok miktarı sayı değil: "'+stockRaw+'"', rowNum}); continue; }
    if(priceRaw && isNaN(newPrice)){ skippedLines.push({line, reason:'Fiyat sayı değil: "'+priceRaw+'" — ondalık ayıracı olarak NOKTA (.) kullandığınızdan emin olun', rowNum}); continue; }
    updates.push({barcode, newStock, newPrice, createdBy: session.displayName});
  }
  return {updates, skippedLines};
}
async function sendStockPriceUpdate(updates, skippedLines){
  if(updates.length===0){ showToast('Güncellenecek geçerli satır bulunamadı'); return; }
  if(state.stockPriceUpdateRunning) return;
  state.stockPriceUpdateRunning = true;
  render();
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'bulkUpdateStockPrice', auth:{username:session.username, passwordHash:session.passwordHash}, updates})
    }, 90000);
    const data = await res.json();
    state.stockPriceUpdateRunning = false;
    if(data && data.ok){
      await refreshData();
      const parts = [];
      if(data.stockUpdated>0) parts.push(`${data.stockUpdated} barkodun stoğu güncellendi`);
      if(data.priceUpdated>0) parts.push(`${data.priceUpdated} barkodun fiyatı güncellendi`);
      if(data.notFound && data.notFound.length>0) parts.push(`⚠ ${data.notFound.length} barkod sistemde bulunamadı: ` + data.notFound.slice(0,10).join(', ') + (data.notFound.length>10?'…':''));
      state.stockPriceUpdateResultText = (parts.join(' · ')||'İşlem tamamlandı') + '.';
      state.stockPriceUpdateResultIsError = !!(data.notFound && data.notFound.length>0);
      showToast('Toplu güncelleme tamamlandı');
    } else {
      state.stockPriceUpdateResultText = 'Güncelleme başarısız oldu — yetkinizi kontrol edin ve tekrar deneyin.';
      state.stockPriceUpdateResultIsError = true;
      showToast('Güncelleme başarısız');
    }
  }catch(e){
    state.stockPriceUpdateRunning = false;
    if(e && e.name === 'AbortError'){
      state.stockPriceUpdateResultText = '⏱ Sunucu 90 saniyede yanıt vermedi. İşlem sunucu tarafında hâlâ devam ediyor olabilir — sayfayı birkaç dakika sonra yenileyip stok/fiyatların değişip değişmediğini kontrol edin. Eğer değişmemişse tekrar deneyin.';
    } else {
      state.stockPriceUpdateResultText = 'Sunucuya bağlanılamadı — internet bağlantınızı kontrol edip tekrar deneyin.';
    }
    state.stockPriceUpdateResultIsError = true;
  }
  state.stockPriceUpdateSkippedLines = skippedLines || [];
  render();
}
async function submitStockPriceUpdate(){
  if(state.stockPriceUpdateRunning) return;
  state.stockPriceUpdateError = null;
  state.stockPriceUpdateResultText = null;
  if(state.stockPriceUpdateFile){
    await sendStockPriceUpdate(state.stockPriceUpdateFile.updates, state.stockPriceUpdateFile.skippedLines);
    state.stockPriceUpdateFile = null;
    return;
  }
  const raw = document.getElementById('stockprice-textarea').value;
  if(!raw || !raw.trim()){
    state.stockPriceUpdateError = 'Önce bir CSV dosyası seçin ya da kutuya veri yapıştırın.';
    render();
    return;
  }
  const {updates, skippedLines} = parseStockPriceUpdateLines(raw);
  if(updates.length===0){
    state.stockPriceUpdateError = `Girdiğiniz veriden geçerli bir satır çıkmadı — aşağıda hangi satırların neden atlandığını görebilirsiniz.`;
    state.stockPriceUpdateSkippedLines = skippedLines;
    render();
    return;
  }
  await sendStockPriceUpdate(updates, skippedLines);
}
function handleStockPriceUpdateFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(state.stockPriceUpdateRunning){ e.target.value=''; return; }
  const nameLower = (file.name||'').toLowerCase();
  if(nameLower.endsWith('.xlsx') || nameLower.endsWith('.xls')){
    state.stockPriceUpdateFile = null;
    state.stockPriceUpdateError = `Bu araç .xlsx/.xls dosyası kabul etmiyor, sadece CSV. Excel'de dosyanızı açıp "Farklı Kaydet" → "CSV UTF-8 (Virgülle Ayrılmış) (.csv)" seçip öyle yükleyin.`;
    render();
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      let text = ev.target.result;
      if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      // Sanity check: this tool is meant for at most a few thousand rows. A wildly larger line
      // count almost always means a non-text file (e.g. a binary .xlsx) was read as if it were
      // plain text, producing garbage — parsing it further would just freeze the browser.
      const roughLineCount = (text.match(/\n/g)||[]).length;
      if(roughLineCount > 50000){
        state.stockPriceUpdateFile = null;
        state.stockPriceUpdateError = `Bu dosya beklenenden çok daha fazla satır içeriyor gibi görünüyor (${roughLineCount.toLocaleString('tr-TR')}) — muhtemelen yanlış bir dosya türü seçildi (örn. .xlsx bir dosya CSV yerine yanlışlıkla seçilmiş olabilir). Lütfen düz bir CSV dosyası seçtiğinizden emin olun.`;
        render();
        return;
      }
      const {updates, skippedLines} = parseStockPriceUpdateLines(text);
      state.stockPriceUpdateResultText = null;
      if(updates.length===0){
        state.stockPriceUpdateFile = null;
        state.stockPriceUpdateError = `Dosyadan geçerli bir satır çıkmadı — aşağıda hangi satırların neden atlandığını görebilirsiniz.`;
        state.stockPriceUpdateSkippedLines = skippedLines;
      } else {
        state.stockPriceUpdateFile = {name:file.name, updates, skippedLines};
        state.stockPriceUpdateError = null;
        state.stockPriceUpdateSkippedLines = skippedLines;
        showToast(`${updates.length} satır dosyadan okundu — "Güncelle"ye basın`);
      }
    }catch(err){
      state.stockPriceUpdateFile = null;
      state.stockPriceUpdateError = 'Dosya işlenirken bir hata oluştu: ' + (err && err.message ? err.message : err);
    }
    render();
  };
  reader.onerror = function(){ showToast('Dosya okunamadı'); };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}
function clearStockPriceUpdateFile(){ state.stockPriceUpdateFile = null; state.stockPriceUpdateError = null; state.stockPriceUpdateSkippedLines = []; render(); }

function renderStockCountAnalysisTab(){
  if(state.stockCountAnalysisSubView==='detail') return renderStockCountAnalysisDetail();
  const allCompleted = state.stockCountHistory.filter(c=>c.status!=='cancelled');

  const years = Array.from(new Set(allCompleted.map(c=>(c.completedAt||c.startedAt||'').slice(0,4)).filter(Boolean))).sort().reverse();
  const filterYear = state.stockCountFilterYear || 'all';
  const filterFrom = state.stockCountFilterFrom || '';
  const filterTo = state.stockCountFilterTo || '';

  const completed = allCompleted.filter(c=>{
    const d = (c.completedAt||c.startedAt||'').slice(0,10);
    if(!d) return true;
    if(filterYear!=='all' && d.slice(0,4)!==filterYear) return false;
    if(filterFrom && d < filterFrom) return false;
    if(filterTo && d > filterTo) return false;
    return true;
  });

  return `<div style="max-width:900px">
    <h2 style="margin:0 0 4px">📊 Depo Sayım Analizi</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Tamamlanmış her sayımın dönem özeti — eski stok, giren (üretilen/depoya alınan), çıkan ve nihai stok. Bir sayıma tıklayarak kalem bazlı dökümü ve dönemler arası trendi görebilirsiniz.</p>
    ${years.length>0 ? `
      <div class="toolbar" style="margin-bottom:16px">
        <select onchange="state.stockCountFilterYear=this.value;render();">
          <option value="all" ${filterYear==='all'?'selected':''}>Tüm Yıllar</option>
          ${years.map(y=>`<option value="${y}" ${filterYear===y?'selected':''}>${y}</option>`).join('')}
        </select>
        <span style="font-size:12px;color:var(--muted)">veya tarih aralığı:</span>
        <input type="date" value="${filterFrom}" onchange="state.stockCountFilterFrom=this.value;render();" style="width:auto" />
        <span style="font-size:12px;color:var(--muted)">—</span>
        <input type="date" value="${filterTo}" onchange="state.stockCountFilterTo=this.value;render();" style="width:auto" />
        ${(filterYear!=='all'||filterFrom||filterTo) ? `<button class="btn ghost small" onclick="state.stockCountFilterYear='all';state.stockCountFilterFrom='';state.stockCountFilterTo='';render();">✕ Filtreyi Temizle</button>` : ''}
        <div class="count">${completed.length} / ${allCompleted.length} sayım</div>
      </div>
    ` : ''}
    ${completed.length===0 ? `<div class="empty"><h3>${allCompleted.length===0?'Henüz tamamlanmış bir sayım yok':'Bu filtreye uyan sayım yok'}</h3><p>${allCompleted.length===0?'"📦 Depo" sekmesindeki "Depo Sayımı" düğmesiyle ilk sayımınızı başlatabilirsiniz.':'Filtreyi genişletmeyi deneyin.'}</p></div>` : `
      <div class="depo-table-wrap"><table class="depo-table" style="min-width:720px">
        <thead><tr><th>Sayım</th><th>Tarih</th><th>Eski Stok</th><th>Giren (Üretilen)</th><th>Çıkan</th><th>Nihai Stok</th><th>Fark Bulunan</th></tr></thead>
        <tbody>
          ${completed.map(c=>{
            const s = c.periodSummary;
            const opening = s ? s.perBarcode.reduce((sum,r)=>sum+r.openingStock,0) : 0;
            const finalStock = s ? s.perBarcode.reduce((sum,r)=>sum+r.countedQty,0) : 0;
            return `<tr style="cursor:pointer" onclick="openStockCountHistoryDetail('${c.id}')">
              <td style="font-weight:700">${esc(c.name)}</td>
              <td class="depo-td-muted">${fmtDateTimeOrder(c.completedAt||c.startedAt)}</td>
              <td>${s?opening:'—'}</td>
              <td style="color:var(--good);font-weight:700">${s?'+'+s.totals.totalIn:'—'}</td>
              <td style="color:var(--danger)">${s?'−'+s.totals.totalOut:'—'}</td>
              <td style="font-weight:700">${s?finalStock:'—'}</td>
              <td>${s && s.totals.itemsWithDifference>0 ? `<span class="chip other" style="background:var(--danger-bg);color:var(--danger)">${s.totals.itemsWithDifference}</span>` : (s?'✓':'—')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    `}
  </div>`;
}
function renderStockCountAnalysisDetail(){

  return `<div style="max-width:900px">

        <div class="extra-info-box" style="margin:0;text-align:center"><div class="mini-meta">GİREN (ÜRETİLEN)</div><div style="font-size:20px;font-weight:800;color:var(--good)">+${s.totals.totalIn}</div></div>
        <div class="extra-info-box" style="margin:0;text-align:center"><div class="mini-meta">ÇIKAN</div><div style="font-size:20px;font-weight:800;color:var(--danger)">−${s.totals.totalOut}</div></div>
        <div class="extra-info-box" style="margin:0;text-align:center"><div class="mini-meta">NİHAİ STOK</div><div style="font-size:20px;font-weight:800">${s.perBarcode.reduce((sum,r)=>sum+r.countedQty,0)}</div></div>
      </div>
      ${allCompleted.length>1 ? `
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px;font-weight:700">Dönemler Arası Üretim/Giriş Trendi</div>
        <div style="margin-bottom:26px">
          ${allCompleted.map(x=>`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
              <div style="width:150px;font-size:11.5px;color:var(--muted);text-align:right;flex-shrink:0">${esc(x.name)}</div>
              <div style="flex:1;background:var(--line);border-radius:3px;overflow:hidden">
                <div style="width:${Math.round((x.periodSummary.totals.totalIn||0)/maxIn*100)}%;min-width:28px;background:${x.id===c.id?'var(--accent-ink)':'var(--muted)'};padding:5px 8px;color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap">${x.periodSummary.totals.totalIn||0}</div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px;font-weight:700">Kalem Detayı</div>
      <div class="depo-table-wrap"><table class="depo-table" style="min-width:640px">
        <thead><tr><th>Ürün</th><th>Eski Stok</th><th>Giren</th><th>Çıkan</th><th>Nihai Stok</th><th>Fark</th></tr></thead>
        <tbody>
          ${[...s.perBarcode].sort((a,b)=>Math.abs(b.difference)-Math.abs(a.difference)).map(r=>`<tr style="${r.difference!==0?'background:var(--danger-bg)':''}">
            <td>${esc(r.refNo)} · ${esc(r.colorName)} · ${esc(r.sizeLabel)}</td>
            <td class="depo-td-muted">${r.openingStock}</td>
            <td style="color:var(--good)">+${r.totalIn}</td>
            <td style="color:var(--danger)">−${r.totalOut}</td>
            <td style="font-weight:700">${r.countedQty}</td>
            <td style="font-weight:700;color:${r.difference>0?'var(--good)':r.difference<0?'var(--danger)':'var(--muted)'}">${r.difference>0?'+':''}${r.difference}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    `}
  </div>`;
}

              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">

        <div style="max-height:280px;overflow-y:auto">
          <table class="depo-table" style="min-width:100%">
            <thead><tr><th>Ürün</th><th>Sayılan</th><th>Fark</th></tr></thead>

              ${[...s.perBarcode].sort((a,b)=>Math.abs(b.difference)-Math.abs(a.difference)).map(r=>`<tr style="${r.difference!==0?'background:var(--danger-bg)':''}">

function renderScanModal(){

      ${s.stage==='pending' ? `

        <div class="bulk-result error" style="display:block;text-align:center;font-size:14px">
          ⚠ <b>${esc(s.barcode)}</b> barkodu sistemde kayıtlı değil.

      ` : `
        <div class="extra-info-box" style="margin-bottom:14px">

          <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(s.barcode)} · Mevcut stok: ${s.item.stock||0}</div>

        </div>
        <div class="field-msg">Enter'a basınca kaydedilir ve bir sonraki taramaya geçilir</div>

    </div>
  </div>`;
}

function katCountText(){ try{ const d=katBuild(); return d.length+' model, '+d.reduce((a,m)=>a+m.colors.length,0)+' renk bulundu.'; }catch(e){ return ''; } }
function katUpdateCount(){ const e=document.getElementById('kat-count'); if(e) e.textContent=katCountText(); }
function katSizeNum(s){ const m=String(s).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):9999; }
function katBuild(){
  const k=state.kat, isDepocu=session.role==='depocu';
  const refSet = new Set(String(k.refs||'').split(/[\s,;]+/).filter(Boolean).map(x=>padRef(x)));
  const byRef = {};
  state.warehouseItems.forEach(it=>{
    if(!it.refNo) return;
    const key=padRef(it.refNo);
    if(refSet.size && !refSet.has(key)) return;
    const stock = Number(it.stock)||0;
    if(k.onlyStock && stock<=0) return;
    (byRef[key] = byRef[key] || {key, refNo:it.refNo, items:[]}).items.push(it);
  });
  const out=[];
  Object.values(byRef).forEach(g=>{
    const product = state.products.find(p=>padRef(p.refNo)===g.key) || null;
    if(k.gender.size && (!product || !k.gender.has(product.gender||''))) return;
    if(k.season.size && (!product || !k.season.has(product.season||''))) return;
    const colors={};
    g.items.forEach(it=>{
      const cn = normColor(it.colorName);
      const c = colors[cn] = colors[cn] || {colorName:it.colorName||'', sizes:[]};
      c.sizes.push({label:String(it.sizeLabel||'').replace(/^size\s*/i,''), stock:Number(it.stock)||0, barcode:it.barcode||''});
    });
    const variants = product ? variantsFor(product.id) : [];
    const colorList = Object.keys(colors).map(cn=>{
      const c=colors[cn];
      c.sizes.sort((a,b)=>katSizeNum(a.label)-katSizeNum(b.label));
      const v = variants.find(v=>normColor(v.colorName)===cn);
      c.order = v ? (v.colorOrder||0) : 999; c.image = v ? v.image : null;
      return c;
    }).sort((a,b)=>a.order-b.order || a.colorName.localeCompare(b.colorName,'tr'));
    out.push({refNo:g.refNo, key:g.key, name: product&&product.name||'', price: (!isDepocu && product) ? (Number(product.price)||0) : null, colors:colorList});
  });
  out.sort((a,b)=>a.key.localeCompare(b.key));
  return out;
}
function katSizesText(c, showQty){
  return c.sizes.map(s=> showQty ? (s.label+' ('+s.stock+')') : s.label).join(' · ');
}
function katPriceText(m){
  const k=state.kat;
  if(k.price==='none' || m.price==null || session.role==='depocu') return '';
  if(k.price==='TRY'){ const r=parseFloat(k.rate); return formatMoney(m.price*r)+' ₺'; }
  return '$'+formatMoney(m.price);
}
function katCheckRate(){
  const k=state.kat;
  if(session.role!=='depocu' && k.price==='TRY'){ const r=parseFloat(k.rate); if(!r||r<=0){ showToast('Geçerli bir USD/TL kuru girin'); return false; } }
  return true;
}
function katDataUrlSize(d){ return new Promise(res=>{ if(!d){res({w:1,h:1});return;} const i=new Image(); i.onload=()=>res({w:i.naturalWidth||1,h:i.naturalHeight||1}); i.onerror=()=>res({w:1,h:1}); i.src=d; }); }
async function katLoadImages(data){
  const urls=[]; data.forEach(m=>m.colors.forEach(c=>{ if(c.image) urls.push(c.image); }));
  if(window.fsPrefetchImages) await window.fsPrefetchImages(urls);
  for(const m of data) for(const c of m.colors){
    let u=c.image; if(u && window.fsDataUrl) u=await window.fsDataUrl(u);
    c.dataUrl=u||null; c.nat=await katDataUrlSize(c.dataUrl);
  }
}
function katFileName(ext){
  const t=(state.kat.title||'katalog').toLowerCase().replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'katalog';
  return t+'.'+ext;
}
async function katalogPdf(){
  if(!window.jspdf){ showToast('PDF kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin'); return; }
  if(!katCheckRate()) return;
  const k=state.kat; const data=katBuild();
  if(!data.length){ showToast('Seçime uyan model yok'); return; }
  k.running=true; render(); showToast('Katalog hazırlanıyor…', true);
  try{
    await katLoadImages(data);
    const { jsPDF } = window.jspdf;
    const doc=new jsPDF({unit:'mm', format:'a4'});
    doc.addFileToVFS('DejaVuSans.ttf', KAT_FONT_REG); doc.addFont('DejaVuSans.ttf','DejaVu','normal');
    doc.addFileToVFS('DejaVuSans-Bold.ttf', KAT_FONT_BOLD); doc.addFont('DejaVuSans-Bold.ttf','DejaVu','bold');
    const pageW=210,pageH=297,margin=12,cols=4,gapX=4,gapY=5;
    const colW=(pageW-margin*2-gapX*(cols-1))/cols, imgH=38, cardH=imgH+17, bandH=11;
    let y=margin;
    // logo
    if(state.logo){ try{ const ls=await katDataUrlSize(state.logo); const r=ls.w/ls.h; let h=11,w=11*r; if(w>32){w=32;h=32/r;} doc.addImage(state.logo,'PNG',pageW-margin-w,y-2,w,h); }catch(e){} }
    doc.setFont('DejaVu','bold'); doc.setFontSize(20); doc.text(k.title||'Katalog', margin, y+5);
    doc.setFont('DejaVu','normal'); doc.setFontSize(8.5); doc.setTextColor(120);
    doc.text(new Date().toLocaleDateString('tr-TR')+(k.note?'   ·   '+k.note:''), margin, y+11);
    doc.setTextColor(0); y+=19;
    for(const m of data){
      if(y+bandH+cardH+2>pageH-margin-8){ doc.addPage(); y=margin; }
      doc.setFillColor(241,236,221); doc.rect(margin,y,pageW-margin*2,bandH,'F');
      doc.setFont('DejaVu','bold'); doc.setFontSize(11); doc.setTextColor(35,44,42);
      doc.text('Ref: '+m.refNo+(m.name?'  —  '+m.name:''), margin+3, y+7);
      const pt=katPriceText(m); if(pt){ doc.setFontSize(11.5); doc.text(pt, pageW-margin-3, y+7, {align:'right'}); }
      doc.setTextColor(0); y+=bandH+3;
      let col=0,x=margin;
      for(const c of m.colors){

function yedekCell(v){

async function yedekAl(){

    const meta = await call({action:'Backup'});
    if(!meta || !meta.ok) throw new Error('Yetki yok veya sunucu yanıt vermedi');

      rows = yedekFlatten(t, rows);
      const cols = []; const seen = {};

  }catch(e){ console.error(e); showToast('Yedek alınamadı: ' + (e && e.message || e)); }

// ================= EXCEL YEDEĞİNDEN GERİ YÜKLEME (yalnızca yönetici) =================
const RESTORE_BASE = { catalog_products:['id','updated_at'], catalog_variants:['id','product_id','updated_at'], catalog_skus:['id','barcode','variant_id','updated_at'] };
let __restoreData = null;
function restoreCellVal(v){
  if(v===null || v===undefined) return undefined;
  if(v instanceof Date) return v.toISOString();
  if(typeof v==='object'){ if(v.richText) return v.richText.map(x=>x.text).join(''); if(v.text!==undefined) return v.text; if(v.result!==undefined) return v.result; return undefined; }
  if(v==='') return undefined;
  return v;
}
function restoreRebuildCatalog(table, rows){
  const base = RESTORE_BASE[table]; if(!base) return rows;
  return rows.map(r=>{
    const o = {}, doc = {};
    Object.keys(r).forEach(k=>{
      if(base.indexOf(k)>=0){ o[k]=r[k]; return; }
      let key = k, v = r[k];
      if(k.indexOf('doc_')===0 && base.indexOf(k.slice(4))>=0) key = k.slice(4);
      if(typeof v==='string' && /^[\[{]/.test(v)){ try{ v = JSON.parse(v); }catch(e){} }
      doc[key] = v;
    });
    o.doc = doc; return o;
  });
}
async function restoreReadFile(file){
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  const inv = {}; Object.keys(YEDEK_SHEETS).forEach(t=>{ inv[YEDEK_SHEETS[t]] = t; });
  const data = {};
  wb.eachSheet(ws=>{
    const t = inv[ws.name]; if(!t) return;
    const head = []; ws.getRow(1).eachCell({includeEmpty:true},(c,i)=>{ head[i] = String(restoreCellVal(c.value)||''); });
    const rows = [];
    ws.eachRow((row,n)=>{
      if(n===1) return;
      const o = {}; let any = false;
      for(let i=1;i<head.length;i++){ if(!head[i]) continue; const v = restoreCellVal(row.getCell(i).value); if(v!==undefined){ o[head[i]] = v; any = true; } }
      if(any) rows.push(o);
    });
    data[t] = restoreRebuildCatalog(t, rows);
  });
  return data;
}

    if(!d||!d.ok){ var ex=(d&&d.sitesFound)?' — Hesaptaki siteler: '+d.sitesFound.map(function(s){return s.ad+' ['+s.id+']';}).join('; '):''; var ki=(d&&d.keyInfo)?' — Anahtar: '+d.keyInfo.uzunluk+' karakter, başlangıcı "'+d.keyInfo.bas+'", temizlenen karakter: '+d.keyInfo.temizlenen:''; throw new Error(((d&&d.error)||'Yanıt alınamadı')+ex+ki); }
    __kanalData=d; kanalRender(d);
  }catch(e){ out.innerHTML='<p style="color:#B5402F">Hata: '+kanalEsc(e.message)+'</p>'; }
  btn.disabled=false;
}
function kanalTable(rows,cols,max){
  if(!rows.length) return '<div style="color:#888;font-size:13px">Kayıt yok</div>';
  var h='<div style="max-height:260px;overflow:auto;border:1px solid #e4e4e4;border-radius:6px"><table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr>'+cols.map(function(c){return '<th style="text-align:left;padding:6px 8px;background:#f5f5f2;position:sticky;top:0">'+c[1]+'</th>';}).join('')+'</tr></thead><tbody>';
  rows.slice(0,max).forEach(function(r){ h+='<tr>'+cols.map(function(c){var v=r[c[0]]; if(Array.isArray(v)) v=v.join(', '); return '<td style="padding:5px 8px;border-top:1px solid #eee">'+kanalEsc(v)+'</td>';}).join('')+'</tr>'; });
  h+='</tbody></table></div>'; if(rows.length>max) h+='<div style="font-size:12px;color:#888;margin-top:4px">İlk '+max+' satır gösteriliyor — tamamı için Excel indirin.</div>';
  return h;
}
function kanalRender(d){
  var h='<div style="margin-bottom:6px;font-size:12px;color:#777">Wix siteleri: '+(d.sitesFound||[]).map(function(s){return kanalEsc(s.ad)+' ['+kanalEsc(s.id)+']';}).join(' · ')+'</div><div style="margin-bottom:10px;font-size:13px">Depoda aktif kayıt: <b>'+d.depoSkus+'</b> barkod</div><button class="btn ghost small" onclick="kanalExcel()">⬇ Excel olarak indir</button>';
  d.sites.forEach(function(s){
    h+='<div style="margin-top:18px;border-top:2px solid #3D5A52;padding-top:10px"><h3 style="margin:0 0 6px">'+kanalEsc(s.site)+'</h3>';
    if(!s.ok){ h+='<p style="color:#B5402F">Okunamadı: '+kanalEsc(s.error)+'</p></div>'; return; }
    h+='<div style="font-size:13px;margin-bottom:8px">Katalog: '+kanalEsc(s.version)+' · Sitede varyant: <b>'+s.wixVariants+'</b> · Depoyla eşleşen: <b>'+s.matched+'</b>'+(s.note?' · <span style="color:#B5402F">'+kanalEsc(s.note)+'</span>':'')+'</div>';
    h+='<h4 style="margin:12px 0 4px">📦 Depoda var, sitede yok — eklenmesi önerilen modeller ('+s.notOnSite.length+')</h4>'+kanalTable(s.notOnSite,[['refNo','Ref'],['color','Renk'],['sizes','Bedenler'],['stock','Stok']],200);
    h+='<h4 style="margin:12px 0 4px">🔓 Satışa kapalı ama depoda stoğu var — açılabilir ('+(s.closedInStock||[]).length+')</h4>'+kanalTable((s.closedInStock||[]).map(function(r){return {name:r.name,sizes:r.sizes.sort(),stock:r.stock};}),[['name','Model (sitedeki ad)'],['sizes','Stoklu bedenler'],['stock','Toplam stok']],200);
    h+='<h4 style="margin:12px 0 4px">⚠ Sitede var, depoda barkodu bulunamadı ('+s.wixOnly.length+')</h4>'+kanalTable(s.wixOnly,[['sku','SKU'],['name','Ürün'],['price','Fiyat']],200);
    h+='<h4 style="margin:12px 0 4px">🔁 Stok durumu uyuşmuyor ('+s.mismatch.length+')</h4>'+kanalTable(s.mismatch,[['refNo','Ref'],['color','Renk'],['size','Beden'],['depoStock','Depo stok'],['reserved','Rezerve'],['siteInStock','Sitede stokta'],['siteQty','Sitede adet']],200);
    h+='</div>';
  });
  document.getElementById('kanal-out').innerHTML=h;
}
async function kanalExcel(){
  if(!__kanalData||!window.ExcelJS) return;
  var wb=new ExcelJS.Workbook();
  var add=function(name,rows,cols){ var ws=wb.addWorksheet(name.slice(0,31)); ws.addRow(cols.map(function(c){return c[1];})); rows.forEach(function(r){ws.addRow(cols.map(function(c){var v=r[c[0]]; return Array.isArray(v)?v.join(', '):v;}));}); ws.getRow(1).font={bold:true}; ws.columns.forEach(function(c){c.width=18;}); };
  __kanalData.sites.forEach(function(s){
    if(!s.ok) return; var n=s.site.replace(/[^a-z]/gi,'').slice(0,12);
    add(n+' Sitede Yok',s.notOnSite,[['refNo','Ref'],['color','Renk'],['sizes','Bedenler'],['stock','Stok']]);
    add(n+' Kapalı Stoklu',(s.closedInStock||[]).map(function(r){return {name:r.name,sizes:r.sizes.sort(),stock:r.stock};}),[['name','Model'],['sizes','Stoklu bedenler'],['stock','Toplam stok']]);
    add(n+' Depoda Yok',s.wixOnly,[['sku','SKU'],['name','Ürün'],['price','Fiyat']]);
    add(n+' Stok Uyuşmaz',s.mismatch,[['barcode','Barkod'],['refNo','Ref'],['color','Renk'],['size','Beden'],['depoStock','Depo stok'],['reserved','Rezerve'],['siteInStock','Sitede stokta'],['siteQty','Sitede adet']]);
  });
  var buf=await wb.xlsx.writeBuffer();
  downloadBlob('kanal-raporu-'+new Date().toISOString().slice(0,10)+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',buf);
}
