// Distinct two-tone alert sound — different from a typical barcode-scanner beep,
// so the operator notices a problem even without looking at the screen.
let audioCtx = null;
function playSuccessBeep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1046; // pleasant, distinct from the error tone
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now+0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.13);
  }catch(e){ /* audio unavailable — vibration/visual feedback still works */ }
}
function playAlertSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [660, 330, 660].forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      const t = now + i*0.18;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(1.0, t+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.17);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t+0.18);
    });
  }catch(e){ /* audio unavailable — ignore, visual warning still shows */ }
}
function processQuickScan(barcode){
  barcode = (barcode||'').trim();
  if(!barcode) return;
  if(hasUnresolvedUnknownScan()) return; // blocked until the pending unknown entry is resolved
  const item = state.warehouseItems.find(w=>w.barcode===barcode);
  if(!item){
    if(state.modalMode==='cameraScanner'){ stopCameraStream(); state.modalMode = 'scan'; }
    const el = document.getElementById('scan-barcode'); if(el) el.value = '';
    playAlertSound();
    if(navigator.vibrate) navigator.vibrate([120,60,120,60,120]);
    const entryId = uid();
    state.scan.sessionLog.unshift({id:entryId, barcode, status:'unknown'});
    showBigScanAlert('BARKOD TANINMIYOR', barcode, 'scan-barcode');
    return;
  }
  if(state.scan.rapidMode){
    // Accumulate locally first — nothing is sent to the server until the operator reviews the
    // list and presses "Kaydet". This gives a chance to fix a misread (wrong qty, duplicate,
    // wrong barcode) before it's committed, at the cost of not being instantaneous per-scan.
    const el = document.getElementById('scan-barcode'); if(el) el.value = '';
    if(!state.scan.batchItems[barcode]){
      state.scan.batchItems[barcode] = { barcode, refNo:item.refNo, colorName:item.colorName, sizeLabel:item.sizeLabel, qty:0 };
    }
    state.scan.batchItems[barcode].qty += 1;
    playSuccessBeep();
    render();
  } else {
    if(state.modalMode==='cameraScanner'){ stopCameraStream(); state.modalMode = 'scan'; }
    state.scan.barcode = barcode;
    state.scan.item = item;
    state.scan.stage = 'qty';
    render();
    setTimeout(()=>{ const el=document.getElementById('scan-qty'); if(el){ el.focus(); el.select(); } }, 60);
  }
}
function adjustScanBatchQty(barcode, delta){
  const it = state.scan.batchItems[barcode];
  if(!it) return;
  it.qty = Math.max(0, it.qty + delta);
  if(it.qty===0) delete state.scan.batchItems[barcode];
  render();
}
function removeScanBatchItem(barcode){
  delete state.scan.batchItems[barcode];
  render();
}
function scanBatchTotalQty(){
  return Object.values(state.scan.batchItems||{}).reduce((s,it)=>s+it.qty, 0);
}
async function commitScanBatch(){
  const items = Object.values(state.scan.batchItems||{}).filter(it=>it.qty>0);
  if(items.length===0) return;
  state.scan.batchCommitting = true;
  render();
  for(const it of items){
    let entry = state.scan.sessionLog.find(l=>l.barcode===it.barcode && l.mode===state.scan.mode && l.status!=='unknown');
    if(!entry){
      entry = { id: uid(), barcode: it.barcode, refNo: it.refNo, colorName: it.colorName, sizeLabel: it.sizeLabel,
        mode: state.scan.mode, scanCount: 0, totalQty: 0, pendingCount: 0, errorCount: 0, status: 'pending', stock: null };
      state.scan.sessionLog.unshift(entry);
    } else {
      state.scan.sessionLog = state.scan.sessionLog.filter(l=>l!==entry);
      state.scan.sessionLog.unshift(entry);
    }
    entry.scanCount += it.qty;
    entry.pendingCount++;
    entry.status = 'pending';
    render();
    await processQueuedScan(entry, it.qty);
  }
  state.scan.batchItems = {};
  state.scan.batchCommitting = false;
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 60);
}
function hasUnresolvedUnknownScan(){
  return (state.scan.sessionLog||[]).some(l=>l.status==='unknown');
}
function handleScanBarcodeKey(e){
  if(e.key !== 'Enter') return;
  processQuickScan(e.target.value);
}
function dismissUnknownScanEntry(entryId){
  state.scan.sessionLog = state.scan.sessionLog.filter(l=>l.id!==entryId);
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 60);
}
function defineUnknownScanEntry(entryId){
  const entry = state.scan.sessionLog.find(l=>l.id===entryId);
  if(!entry) return;
  state.scan.barcode = entry.barcode;
  state.scan.stage = 'unknown';
  state.scan.pendingUnknownEntryId = entryId;
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-new-ref'); if(el) el.focus(); }, 60);
}
function cancelScanUnknown(){
  state.scan.stage = 'scan'; state.scan.barcode = ''; state.scan.pendingUnknownEntryId = null;
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 60);
}
function confirmScanUnknown(){
  const refNo = document.getElementById('scan-new-ref').value.trim();
  const colorName = document.getElementById('scan-new-color').value.trim().toUpperCase();
  const sizeLabel = document.getElementById('scan-new-size').value.trim();
  if(!refNo && !colorName){ showToast('En az referans veya renk bilgisi girin'); return; }
  const item = { barcode: state.scan.barcode, refNo, colorName, sizeLabel, stock: 0 };
  if(!state.warehouseItems.find(w=>w.barcode===item.barcode)) state.warehouseItems.push(item);
  // This barcode is now defined — clear the pending "unknown" log entry it came from, if any.
  if(state.scan.pendingUnknownEntryId){
    state.scan.sessionLog = state.scan.sessionLog.filter(l=>l.id!==state.scan.pendingUnknownEntryId);
    state.scan.pendingUnknownEntryId = null;
  }
  if(state.scan.rapidMode){
    state.scan.stage = 'scan'; state.scan.barcode='';
    if(!state.scan.batchItems[item.barcode]){
      state.scan.batchItems[item.barcode] = { barcode:item.barcode, refNo:item.refNo, colorName:item.colorName, sizeLabel:item.sizeLabel, qty:0 };
    }
    state.scan.batchItems[item.barcode].qty += 1;
    render();
  } else {
    state.scan.item = item;
    state.scan.stage = 'qty';
    render();
    setTimeout(()=>{ const el=document.getElementById('scan-qty'); if(el){ el.focus(); el.select(); } }, 60);
  }
}

// Queue a scan for background processing — returns immediately so the operator can keep scanning
// without waiting for the server round-trip. Each entry shows its own pending/ok/error status.
function flagNegativeStock(barcode, refNo, colorName, sizeLabel, stock){
  if(state.scan.negativeStockFlags.some(f=>f.barcode===barcode)) return; // already flagged this session
  state.scan.negativeStockFlags.push({barcode, refNo, colorName, sizeLabel, stock});
  playAlertSound();
}
async function fixOneNegativeStock(barcode){
  const flag = state.scan.negativeStockFlags.find(f=>f.barcode===barcode);
  if(!flag) return;
  const qty = Math.abs(flag.stock);
  const r = await postStockMovement(barcode, 'in', qty, 'Eksi stok düzeltmesi (Hızlı Tarama)', flag.refNo, flag.colorName, flag.sizeLabel, true);
  if(r.ok){
    state.scan.negativeStockFlags = state.scan.negativeStockFlags.filter(f=>f.barcode!==barcode);
    showToast(`${flag.barcode} stoğu 0'a düzeltildi`);
    render();
  } else {
    showToast('Düzeltme kaydedilemedi — tekrar deneyin');
  }
}
async function fixAllNegativeStock(){
  const flags = [...state.scan.negativeStockFlags];
  if(flags.length===0) return;
  if(!confirm(`${flags.length} barkodun eksi stoğu 0'a düzeltilecek. Onaylıyor musunuz?`)) return;
  for(const f of flags){ await fixOneNegativeStock(f.barcode); }
  showToast('Tüm eksi stoklar düzeltildi');
}
async function processQueuedScan(entry, qty){
  const r = await postStockMovement(entry.barcode, entry.mode, qty, 'Hızlı tarama', entry.refNo, entry.colorName, entry.sizeLabel);
  entry.pendingCount--;
  if(r.ok){
    entry.totalQty += qty;
    entry.stock = r.stock;
    entry.status = entry.pendingCount>0 ? 'pending' : (entry.errorCount>0 ? 'partial' : 'ok');
    if(r.stock < 0) flagNegativeStock(entry.barcode, entry.refNo, entry.colorName, entry.sizeLabel, r.stock);
    if(state.modalMode==='cameraScanner') updateCameraScanFeedback(entry.barcode, 'ok');
  } else {
    entry.errorCount++;
    entry.scanCount--; // this particular scan attempt didn't actually count — doesn't inflate the total
    entry.status = entry.pendingCount>0 ? 'pending' : 'error';
    playAlertSound();
    if(state.modalMode==='cameraScanner') updateCameraScanFeedback(entry.barcode, 'error');
  }
  render();
}
function retryQueuedScan(entryId){
  const entry = state.scan.sessionLog.find(x=>x.id===entryId);
  if(!entry) return;
  entry.errorCount = Math.max(0, entry.errorCount-1);
  entry.scanCount++;
  entry.pendingCount++;
  entry.status = 'pending';
  render();
  processQueuedScan(entry, 1);
}
async function submitScanMovement(qty){
  const item = state.scan.item, mode = state.scan.mode;
  state.scan.stage = 'pending';
  state.scan.lastResult = { ok:true, text: `⏳ ${detailRefLabel(item.refNo,item.colorName,item.sizeLabel)} kaydediliyor…`, pending:true };
  render();
  const r = await postStockMovement(item.barcode, mode, qty, 'Hızlı tarama', item.refNo, item.colorName, item.sizeLabel);
  if(r.ok){
    let entry = state.scan.sessionLog.find(l=>l.barcode===item.barcode && l.mode===mode && l.status!=='unknown');
    if(!entry){
      entry = { id: uid(), barcode: item.barcode, refNo: item.refNo, colorName: item.colorName, sizeLabel: item.sizeLabel,
        mode, scanCount: 0, totalQty: 0, pendingCount: 0, errorCount: 0, status: 'ok', stock: null };
      state.scan.sessionLog.unshift(entry);
    } else {
      state.scan.sessionLog = state.scan.sessionLog.filter(l=>l!==entry);
      state.scan.sessionLog.unshift(entry);
    }
    entry.scanCount++;
    entry.totalQty += qty;
    entry.stock = r.stock;
    entry.status = entry.errorCount>0 ? 'partial' : 'ok';
    state.scan.lastResult = { ok:true, text: `✓ ${detailRefLabel(item.refNo,item.colorName,item.sizeLabel)} — ${mode==='out'?'Çıkış':'Giriş'} ${qty} kaydedildi (Yeni stok: ${r.stock})` };
    if(r.stock < 0) flagNegativeStock(item.barcode, item.refNo, item.colorName, item.sizeLabel, r.stock);
  } else {
    state.scan.lastResult = { ok:false, text: r.networkError ? '⚠ Sunucuya bağlanılamadı — kaydedilmedi, tekrar deneyin' : '⚠ Kaydedilemedi, tekrar deneyin' };
  }
  state.scan.stage = 'scan'; state.scan.barcode=''; state.scan.item=null;
  render();
  setTimeout(()=>{ const el=document.getElementById('scan-barcode'); if(el) el.focus(); }, 60);
}
async function handleScanQtyKey(e){
  if(e.key !== 'Enter') return;
  const qty = parseInt(e.target.value, 10) || 1;
  await submitScanMovement(qty);
}

function handleLogoUpload(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Lütfen bir görsel dosyası seçin'); return; }
  if(file.size > 30*1024){ showToast('Logo çok büyük — lütfen 30 KB altında bir dosya kullanın'); return; }
  const reader = new FileReader();
  reader.onload = async function(ev){
    state.logo = ev.target.result;
    render();
    const ok = await saveKey('logo', state.logo);
    if(ok){ saveCachedLogo(state.logo); showToast('Logo kaydedildi'); } else showToast('Logo kaydedilemedi');
  };
  reader.onerror = function(){ showToast('Dosya okunamadı'); };
  reader.readAsDataURL(file);
}

function render(){
  const root = document.getElementById('root');
  if(!state.loaded){ root.innerHTML = '<div class="loading">Yükleniyor…</div>'; return; }

  // The camera scanner attaches a live video stream to #camera-scan-region. Rebuilding the whole
  // page HTML would destroy that element and kill the camera. Once it's up and running, skip
  // re-rendering entirely while this modal is open — nothing in that modal depends on state.
  if(state.modalMode === 'cameraScanner' && document.getElementById('camera-scan-region') && document.getElementById('camera-scan-region').childElementCount > 0){
    return;
  }

  // Preserve focus + cursor position across the innerHTML rebuild below —
  // otherwise every keystroke in a text input loses focus (cursor stops blinking).
  const activeEl = document.activeElement;
  let focusInfo = null;
  if(activeEl && activeEl.id && root.contains(activeEl)){
    focusInfo = { id: activeEl.id, start: activeEl.selectionStart, end: activeEl.selectionEnd };
  }

  // Preserve scroll position too — e.g. checking a box in a long Depo list shouldn't jump back to the top.
  const pageScrollY = window.scrollY;
  const tableWrapEl = document.querySelector('.depo-table-wrap');
  const tableWrapScrollTop = tableWrapEl ? tableWrapEl.scrollTop : null;
  const packListEl = document.getElementById('pack-list-scroll');
  const packListScrollTop = packListEl ? packListEl.scrollTop : null;

  const isDepocu = session.role === 'depocu';
  const roleLabel = session.role==='admin' ? 'Yönetici' : (session.role==='depocu' ? 'Depocu' : 'Personel');

  let html = `<div class="banner">
    <div class="brand-row">
      <div class="brand-logo-wrap">
        <div class="logo-click" onclick="document.getElementById('logo-file').click()" title="${state.logo ? 'Logoyu değiştir' : 'Logo yükle'} — PNG/JPG/SVG, maks. 30 KB">
          ${state.logo ? `<img src="${state.logo}" class="brand-logo" alt="Marka logosu" />` : `<div class="brand-logo-placeholder">Logo yok</div>`}
          <span class="logo-edit-badge">✎</span>
        </div>
        <input type="file" id="logo-file" accept="image/*" style="display:none" onchange="handleLogoUpload(event)" />
      </div>
      <div>
        <h1>Depo</h1>
        <div class="top-nav">
          <a class="top-nav-item ${state.view==='depo'?'active':''}" href="#" onclick="state.view='depo';render();return false;">📦 Depo</a>
          ${!isDepocu ? `<a class="top-nav-item ${state.view==='stockCountAnalysis'?'active':''}" href="#" onclick="openStockCountAnalysisTab();return false;">📊 Sayım Analizi</a>` : ''}
          ${!isDepocu ? `<a class="top-nav-item external" href="siparis.html" target="_blank" rel="noopener">📋 Sipariş ↗</a>
          <a class="top-nav-item external" href="musteri-merkezi.html" target="_blank" rel="noopener">👥 Müşteri Merkezi ↗</a>` : ''}
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="user-badge">
        <span>${esc(session.displayName)} <span class="role-chip">${roleLabel}</span></span>
        ${session.role==='admin' ? '<a class="nav-link" href="#" onclick="openUsersModal();return false;">Kullanıcılar</a>' : ''}
        ${session.role==='admin' ? '<a class="nav-link" href="#" onclick="openSheetHealthModal();return false;">Sistem Sağlığı</a>' : ''}
        <a class="nav-link" href="#" onclick="logout();return false;">Çıkış</a>
      </div>
    </div>
  </div>`;

  html += state.view==='stockCountAnalysis' ? renderStockCountAnalysisTab() : renderDepoView();

  if(state.modalMode === 'users') html += renderUsersModal();
  else if(state.modalMode === 'sheetHealth') html += renderSheetHealthModal();
  else if(state.modalMode === 'depoMove') html += renderDepoMoveModal();
  else if(state.modalMode === 'depoBulk') html += renderDepoBulkModal();
  else if(state.modalMode === 'stockPriceUpdate' && !isDepocu) html += renderStockPriceUpdateModal();
  else if(state.modalMode === 'bulkImage' && !isDepocu) html += renderBulkImageModal();
  else if(state.modalMode === 'newDepoItem' && !isDepocu) html += renderNewDepoItemModal();
  else if(state.modalMode === 'depoScan') html += renderScanModal();
  else if(state.modalMode === 'scanModePrompt') html += renderScanModePromptModal();
  else if(state.modalMode === 'pendingOrders') html += renderPendingOrdersModal();
  else if(state.modalMode === 'cameraScanner') html += renderCameraScannerModal();
  else if(state.modalMode === 'packOrder') html += renderPackOrderModal();
  else if(state.modalMode === 'stockCount') html += renderStockCountModal();
  else if(state.modalMode === 'depoImageLightbox') html += renderDepoImageLightbox();

  if(state.newOrderPopup) html += renderNewOrderPopup();
  if(state.bigScanAlert) html += renderBigScanAlert();

  root.innerHTML = html;

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(typeof el.setSelectionRange === 'function' && focusInfo.start!=null){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }

  window.scrollTo(0, pageScrollY);
  if(tableWrapScrollTop!=null){
    const newTableWrapEl = document.querySelector('.depo-table-wrap');
    if(newTableWrapEl) newTableWrapEl.scrollTop = tableWrapScrollTop;
  }
  if(packListScrollTop!=null){
    const newPackListEl = document.getElementById('pack-list-scroll');
    if(newPackListEl) newPackListEl.scrollTop = packListScrollTop;
  }
}

function parseFlexibleNumber(str){
  // Handles "8,5" or "8,50" as a European-style decimal (comma instead of dot) — this happens when
  // the value survives CSV export as a single field (e.g. quoted by Excel) rather than getting split
  // into two columns. parseFloat("8,5") alone would silently read this as just 8.
  if(str==null) return NaN;
  str = String(str).trim();
  str = str.replace(/[$₺€£]/g, '').trim(); // strip currency symbols (our own export prefixes prices with $)
  if(/^\d+,\d{1,2}$/.test(str)) str = str.replace(',', '.');
  return parseFloat(str);
}
function healDecimalCommaSplit(cols, expectedCount){
  // Excel's "MS-DOS Comma Separated CSV" export, combined with a Turkish/European locale where
  // "," is the decimal separator, turns a single value like "8,5" into TWO CSV columns ("8" and "5")
  // since comma is also the field delimiter. If we see more columns than expected and two adjacent
  // ones are both plain integers, they're almost certainly a split decimal — merge them back.
  cols = cols.slice();
  while(cols.length > expectedCount){
    let merged = false;
    for(let i=cols.length-2; i>=0; i--){
      if(/^\d+$/.test(cols[i]) && /^\d+$/.test(cols[i+1])){
        cols[i] = cols[i] + '.' + cols[i+1];
        cols.splice(i+1,1);
        merged = true;
        break;
      }
    }
    if(!merged) break; // can't safely repair further — leave as-is, validation below will catch it
  }
  return cols;
}
function parseStockPriceUpdateLines(raw){
  const rawLines = raw.split('\n');
  const updates = [];
  const skippedLines = [];
  for(let li=0; li<rawLines.length; li++){
    const rowNum = li + 1;
    const line = rawLines[li].trim();
    if(!line) continue;
    if(/^Barkod\s*[,\t]/i.test(line)) continue; // header row
    let cols = parseBulkLine(line).map(c=>(c||'').trim());
    if(cols.length > 3) cols = healDecimalCommaSplit(cols, 3);
    const barcode = (cols[0]||'').trim();
    const stockRaw = (cols[1]||'').trim();
    const priceRaw = (cols[2]||'').trim();
    if(!barcode){ skippedLines.push({line, reason:'Barkod sütunu boş', rowNum}); continue; }
    if(!stockRaw && !priceRaw){ skippedLines.push({line, reason:'Ne stok ne fiyat girilmiş — güncellenecek bir şey yok', rowNum}); continue; }
    const newStock = stockRaw ? parseInt(stockRaw,10) : null;
    const newPrice = priceRaw ? parseFlexibleNumber(priceRaw) : null;
    if(stockRaw && isNaN(newStock)){ skippedLines.push({line, reason:'Stok miktarı sayı değil: "'+stockRaw+'"', rowNum}); continue; }
    if(priceRaw && isNaN(newPrice)){ skippedLines.push({line, reason:'Fiyat sayı değil: "'+priceRaw+'" — ondalık ayıracı olarak NOKTA (.) kullandığınızdan emin olun', rowNum}); continue; }
    updates.push({barcode, newStock, newPrice, createdBy: session.displayName});
  }
  return {updates, skippedLines};
}
async function sendStockPriceUpdate(updates, skippedLines){
  if(updates.length===0){ showToast('Güncellenecek geçerli satır bulunamadı'); return; }
  if(state.stockPriceUpdateRunning) return;
  state.stockPriceUpdateRunning = true;
  render();
  try{
    const res = await fetchWithTimeout(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'bulkUpdateStockPrice', auth:{username:session.username, passwordHash:session.passwordHash}, updates})
    }, 90000);
    const data = await res.json();
    state.stockPriceUpdateRunning = false;
    if(data && data.ok){
      await refreshData();
      const parts = [];
      if(data.stockUpdated>0) parts.push(`${data.stockUpdated} barkodun stoğu güncellendi`);
      if(data.priceUpdated>0) parts.push(`${data.priceUpdated} barkodun fiyatı güncellendi`);
      if(data.notFound && data.notFound.length>0) parts.push(`⚠ ${data.notFound.length} barkod sistemde bulunamadı: ` + data.notFound.slice(0,10).join(', ') + (data.notFound.length>10?'…':''));
      state.stockPriceUpdateResultText = (parts.join(' · ')||'İşlem tamamlandı') + '.';
      state.stockPriceUpdateResultIsError = !!(data.notFound && data.notFound.length>0);
      showToast('Toplu güncelleme tamamlandı');
    } else {
      state.stockPriceUpdateResultText = 'Güncelleme başarısız oldu — yetkinizi kontrol edin ve tekrar deneyin.';
      state.stockPriceUpdateResultIsError = true;
      showToast('Güncelleme başarısız');
    }
  }catch(e){
    state.stockPriceUpdateRunning = false;
    if(e && e.name === 'AbortError'){
      state.stockPriceUpdateResultText = '⏱ Sunucu 90 saniyede yanıt vermedi. İşlem sunucu tarafında hâlâ devam ediyor olabilir — sayfayı birkaç dakika sonra yenileyip stok/fiyatların değişip değişmediğini kontrol edin. Eğer değişmemişse tekrar deneyin.';
    } else {
      state.stockPriceUpdateResultText = 'Sunucuya bağlanılamadı — internet bağlantınızı kontrol edip tekrar deneyin.';
    }
    state.stockPriceUpdateResultIsError = true;
  }
  state.stockPriceUpdateSkippedLines = skippedLines || [];
  render();
}
async function submitStockPriceUpdate(){
  if(state.stockPriceUpdateRunning) return;
  state.stockPriceUpdateError = null;
  state.stockPriceUpdateResultText = null;
  if(state.stockPriceUpdateFile){
    await sendStockPriceUpdate(state.stockPriceUpdateFile.updates, state.stockPriceUpdateFile.skippedLines);
    state.stockPriceUpdateFile = null;
    return;
  }
  const raw = document.getElementById('stockprice-textarea').value;
  if(!raw || !raw.trim()){
    state.stockPriceUpdateError = 'Önce bir CSV dosyası seçin ya da kutuya veri yapıştırın.';
    render();
    return;
  }
  const {updates, skippedLines} = parseStockPriceUpdateLines(raw);
  if(updates.length===0){
    state.stockPriceUpdateError = `Girdiğiniz veriden geçerli bir satır çıkmadı — aşağıda hangi satırların neden atlandığını görebilirsiniz.`;
    state.stockPriceUpdateSkippedLines = skippedLines;
    render();
    return;
  }
  await sendStockPriceUpdate(updates, skippedLines);
}
function handleStockPriceUpdateFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(state.stockPriceUpdateRunning){ e.target.value=''; return; }
  const nameLower = (file.name||'').toLowerCase();
  if(nameLower.endsWith('.xlsx') || nameLower.endsWith('.xls')){
    state.stockPriceUpdateFile = null;
    state.stockPriceUpdateError = `Bu araç .xlsx/.xls dosyası kabul etmiyor, sadece CSV. Excel'de dosyanızı açıp "Farklı Kaydet" → "CSV UTF-8 (Virgülle Ayrılmış) (.csv)" seçip öyle yükleyin.`;
    render();
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      let text = ev.target.result;
      if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      // Sanity check: this tool is meant for at most a few thousand rows. A wildly larger line
      // count almost always means a non-text file (e.g. a binary .xlsx) was read as if it were
      // plain text, producing garbage — parsing it further would just freeze the browser.
      const roughLineCount = (text.match(/\n/g)||[]).length;
      if(roughLineCount > 50000){
        state.stockPriceUpdateFile = null;
        state.stockPriceUpdateError = `Bu dosya beklenenden çok daha fazla satır içeriyor gibi görünüyor (${roughLineCount.toLocaleString('tr-TR')}) — muhtemelen yanlış bir dosya türü seçildi (örn. .xlsx bir dosya CSV yerine yanlışlıkla seçilmiş olabilir). Lütfen düz bir CSV dosyası seçtiğinizden emin olun.`;
        render();
        return;
      }
      const {updates, skippedLines} = parseStockPriceUpdateLines(text);
      state.stockPriceUpdateResultText = null;
      if(updates.length===0){
        state.stockPriceUpdateFile = null;
        state.stockPriceUpdateError = `Dosyadan geçerli bir satır çıkmadı — aşağıda hangi satırların neden atlandığını görebilirsiniz.`;
        state.stockPriceUpdateSkippedLines = skippedLines;
      } else {
        state.stockPriceUpdateFile = {name:file.name, updates, skippedLines};
        state.stockPriceUpdateError = null;
        state.stockPriceUpdateSkippedLines = skippedLines;
        showToast(`${updates.length} satır dosyadan okundu — "Güncelle"ye basın`);
      }
    }catch(err){
      state.stockPriceUpdateFile = null;
      state.stockPriceUpdateError = 'Dosya işlenirken bir hata oluştu: ' + (err && err.message ? err.message : err);
    }
    render();
  };
  reader.onerror = function(){ showToast('Dosya okunamadı'); };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}
function clearStockPriceUpdateFile(){ state.stockPriceUpdateFile = null; state.stockPriceUpdateError = null; state.stockPriceUpdateSkippedLines = []; render(); }

function renderStockCountAnalysisTab(){
  if(state.stockCountAnalysisSubView==='detail') return renderStockCountAnalysisDetail();
  const allCompleted = state.stockCountHistory.filter(c=>c.status!=='cancelled');

  const years = Array.from(new Set(allCompleted.map(c=>(c.completedAt||c.startedAt||'').slice(0,4)).filter(Boolean))).sort().reverse();
  const filterYear = state.stockCountFilterYear || 'all';
  const filterFrom = state.stockCountFilterFrom || '';
  const filterTo = state.stockCountFilterTo || '';

  const completed = allCompleted.filter(c=>{
    const d = (c.completedAt||c.startedAt||'').slice(0,10);
    if(!d) return true;
    if(filterYear!=='all' && d.slice(0,4)!==filterYear) return false;
    if(filterFrom && d < filterFrom) return false;
    if(filterTo && d > filterTo) return false;
    return true;
  });

  return `<div style="max-width:900px">
    <h2 style="margin:0 0 4px">📊 Depo Sayım Analizi</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Tamamlanmış her sayımın dönem özeti — eski stok, giren (üretilen/depoya alınan), çıkan ve nihai stok. Bir sayıma tıklayarak kalem bazlı dökümü ve dönemler arası trendi görebilirsiniz.</p>
    ${years.length>0 ? `
      <div class="toolbar" style="margin-bottom:16px">
        <select onchange="state.stockCountFilterYear=this.value;render();">
          <option value="all" ${filterYear==='all'?'selected':''}>Tüm Yıllar</option>
          ${years.map(y=>`<option value="${y}" ${filterYear===y?'selected':''}>${y}</option>`).join('')}
        </select>
        <span style="font-size:12px;color:var(--muted)">veya tarih aralığı:</span>
        <input type="date" value="${filterFrom}" onchange="state.stockCountFilterFrom=this.value;render();" style="width:auto" />
        <span style="font-size:12px;color:var(--muted)">—</span>
        <input type="date" value="${filterTo}" onchange="state.stockCountFilterTo=this.value;render();" style="width:auto" />
        ${(filterYear!=='all'||filterFrom||filterTo) ? `<button class="btn ghost small" onclick="state.stockCountFilterYear='all';state.stockCountFilterFrom='';state.stockCountFilterTo='';render();">✕ Filtreyi Temizle</button>` : ''}
        <div class="count">${completed.length} / ${allCompleted.length} sayım</div>
      </div>
    ` : ''}
    ${completed.length===0 ? `<div class="empty"><h3>${allCompleted.length===0?'Henüz tamamlanmış bir sayım yok':'Bu filtreye uyan sayım yok'}</h3><p>${allCompleted.length===0?'"📦 Depo" sekmesindeki "Depo Sayımı" düğmesiyle ilk sayımınızı başlatabilirsiniz.':'Filtreyi genişletmeyi deneyin.'}</p></div>` : `
      <div class="depo-table-wrap"><table class="depo-table" style="min-width:720px">
        <thead><tr><th>Sayım</th><th>Tarih</th><th>Eski Stok</th><th>Giren (Üretilen)</th><th>Çıkan</th><th>Nihai Stok</th><th>Fark Bulunan</th></tr></thead>
        <tbody>
          ${completed.map(c=>{
            const s = c.periodSummary;
            const opening = s ? s.perBarcode.reduce((sum,r)=>sum+r.openingStock,0) : 0;
            const finalStock = s ? s.perBarcode.reduce((sum,r)=>sum+r.countedQty,0) : 0;
            return `<tr style="cursor:pointer" onclick="openStockCountHistoryDetail('${c.id}')">

              <td>${s && s.totals.itemsWithDifference>0 ? `<span class="chip other" style="background:var(--danger-bg);color:var(--danger)">${s.totals.itemsWithDifference}</span>` : (s?'✓':'—')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    `}
  </div>`;
}

  const blocked = hasUnresolvedUnknownScan();
  return `<div class="overlay">
    <div class="modal wide">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="margin:0">Hızlı Tarama</h2>
        <button class="btn small ghost" onclick="closeScanMode()">Kapat</button>
      </div>
      <div style="text-align:center;padding:14px;border-radius:6px;margin-bottom:14px;font-size:17px;font-weight:800;letter-spacing:.02em;${s.mode==='in'?'background:var(--good);color:#fff':'background:var(--danger);color:#fff'}">
        ${s.mode==='in' ? '+ DEPOYA GİRİŞ' : '− DEPODAN ÇIKIŞ'}
      </div>
      <div class="field-msg" style="text-align:center;margin:-8px 0 14px">Yönü değiştirmek için bu ekranı kapatıp "Hızlı Tarama"yı tekrar açın.</div>
      <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);margin-bottom:16px;cursor:pointer">
        <input type="checkbox" ${s.rapidMode?'checked':''} ${s.stage==='pending'?'disabled':''} onchange="toggleScanRapidMode()" style="width:auto" />
        <b>Hızlı Sayım Modu</b> — taramaları listede toplar, siz "Kaydet"e basınca hepsini birden gönderir (yanlış okuma varsa göndermeden düzeltebilirsiniz)
      </label>
      ${s.rapidMode && Object.keys(s.batchItems||{}).length>0 ? `
        <div style="background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:6px;padding:12px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <b>📋 Gönderilmeyi Bekliyor — ${scanBatchTotalQty()} adet, ${Object.keys(s.batchItems).length} barkod</b>
          </div>
          <div style="max-height:260px;overflow-y:auto">
            ${Object.values(s.batchItems).map(it=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(0,0,0,.08);font-size:12.5px">
              <span style="flex:1">${esc(detailRefLabel(it.refNo,it.colorName,it.sizeLabel))} <span style="color:var(--muted);font-variant-numeric:tabular-nums">${esc(it.barcode)}</span></span>
              <button class="btn small ghost" style="padding:2px 8px" ${s.batchCommitting?'disabled':''} onclick="adjustScanBatchQty('${attrEsc(it.barcode)}',-1)">−</button>
              <b style="min-width:22px;text-align:center">${it.qty}</b>
              <button class="btn small ghost" style="padding:2px 8px" ${s.batchCommitting?'disabled':''} onclick="adjustScanBatchQty('${attrEsc(it.barcode)}',1)">+</button>
              <button class="btn small danger-outline" style="padding:2px 8px" ${s.batchCommitting?'disabled':''} onclick="removeScanBatchItem('${attrEsc(it.barcode)}')">✕</button>
            </div>`).join('')}
          </div>
          <button class="btn primary" style="width:100%;margin-top:10px" ${s.batchCommitting?'disabled':''} onclick="commitScanBatch()">${s.batchCommitting?'⏳ Kaydediliyor…':`✓ ${scanBatchTotalQty()} Adedi Kaydet`}</button>
        </div>
      ` : ''}
      ${s.negativeStockFlags.length>0 ? `
        <div style="background:var(--danger-bg);border:1.5px solid var(--danger);border-radius:6px;padding:12px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <b style="color:var(--danger)">⚠ ${s.negativeStockFlags.length} barkod eksi stoğa düştü</b>
            <button class="btn small" style="background:var(--danger);color:#fff" onclick="fixAllNegativeStock()">Tümünü 0'a Düzelt</button>
          </div>
          ${s.negativeStockFlags.map(f=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;border-top:1px solid rgba(0,0,0,.08)">
            <span>${esc(detailRefLabel(f.refNo,f.colorName,f.sizeLabel))} — <span style="font-variant-numeric:tabular-nums">${esc(f.barcode)}</span> — <b>${f.stock}</b> adet</span>
            <button class="btn small ghost" onclick="fixOneNegativeStock('${attrEsc(f.barcode)}')">0'a Düzelt</button>
          </div>`).join('')}
        </div>
      ` : ''}
      ${s.sessionLog.length>0 ? `
        <div style="margin-bottom:18px">
          <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;font-weight:700">Bu oturumda (${s.sessionLog.length})${s.sessionLog.some(l=>l.pendingCount>0)?' — bazıları kaydediliyor…':''}</div>
          <div style="max-height:320px;overflow-y:auto">
          ${s.sessionLog.map(l=>l.status==='unknown' ? `<div class="log-item" style="padding:10px 10px;background:#FFDCC2;border-left:4px solid #D9480F;border-radius:4px;margin-bottom:4px">
            <div class="meta" style="flex-wrap:wrap;gap:6px">
              <span class="chip other" style="background:#D9480F;color:#fff;font-weight:700">⚠ Tanınmıyor</span>
              <span style="font-variant-numeric:tabular-nums;font-weight:700">${esc(l.barcode)}</span>
              <div style="width:100%;display:flex;gap:6px;margin-top:4px">
                <button class="btn small ghost" style="flex:1" onclick="dismissUnknownScanEntry('${l.id}')">🗑 Sil (Muhtemelen Hatalı Okuma)</button>
                <button class="btn small primary" style="flex:1" onclick="defineUnknownScanEntry('${l.id}')">+ Yeni Barkod Olarak Tanımla</button>
              </div>
            </div>
          </div>` : `<div class="log-item" style="padding:6px 0;${l.status==='error'?'background:var(--danger-bg)':l.status==='partial'?'background:var(--warn-bg)':l.status==='pending'?'background:#FBF9F3':''}">
            <div class="meta">
              <span class="chip ${l.mode==='in'?'wa':'other'}">${l.mode==='in'?'Giriş':'Çıkış'}</span>
              <span>${esc(detailRefLabel(l.refNo, l.colorName, l.sizeLabel))}</span>
              <span style="font-size:11px;color:var(--muted)">× ${l.scanCount} tarama</span>
              <span style="font-weight:700;margin-left:auto">${l.mode==='in'?'+':'−'}${l.totalQty}</span>
              ${l.pendingCount>0 ? `<span style="font-size:11px;color:var(--muted)">⏳ ${l.pendingCount}</span>` : ''}
              ${l.status==='ok' ? '<span style="font-size:12px;color:var(--good)">✓</span>' : ''}
              ${l.errorCount>0 ? `<span style="font-size:11px;color:var(--danger)">⚠ ${l.errorCount} başarısız</span><button class="btn small danger-outline" style="padding:2px 8px" onclick="retryQueuedScan('${l.id}')">Tekrar Dene</button>` : ''}
            </div>
          </div>`).join('')}
          </div>
        </div>
      ` : ''}
      ${s.lastResult ? `<div class="bulk-result ${s.lastResult.ok?'ok':'error'}" style="display:block;margin-bottom:12px">${esc(s.lastResult.text)}</div>` : ''}
      ${blocked ? `<div class="bulk-result error" style="display:block;margin-bottom:12px">⚠ Yukarıdaki listede çözülmemiş bir barkod var — yeni tarama yapabilmek için "Sil" veya "Yeni Barkod Olarak Tanımla" seçin.</div>` : ''}
      ${s.stage==='pending' ? `
        <div class="field">
          <label>Barkodu Okutun</label>
          <input type="text" disabled value="⏳ Kaydediliyor, lütfen bekleyin…" style="font-size:16px;padding:14px;text-align:center;color:var(--muted);background:#F1ECDD" />
        </div>
      ` : s.stage==='scan' ? `
        <div class="field">
          <label>Barkodu Okutun</label>
          <input id="scan-barcode" type="text" autocomplete="off" ${blocked?'disabled':''} style="font-size:20px;padding:14px;text-align:center;font-variant-numeric:tabular-nums${blocked?';background:#F1ECDD':''}" onkeydown="handleScanBarcodeKey(event)" placeholder="${blocked?'Önce yukarıdaki barkodu çözün':'Okuyucuyla tarayın ya da elle yazıp Enter tuşuna basın'}" />
          <button class="btn ghost small" style="width:100%;margin-top:8px" ${blocked?'disabled':''} onclick="openCameraScanner('quick')">📷 Telefon Kamerasıyla Tara</button>
        </div>
      ` : s.stage==='unknown' ? `
        <div class="bulk-result error" style="display:block;text-align:center;font-size:14px">
          ⚠ <b>${esc(s.barcode)}</b> barkodu sistemde kayıtlı değil.
        </div>
        <p style="font-size:13px;color:var(--muted);margin:12px 0 10px">Genelde barkod tanımlama sipariş alınırken veya model Depo'ya eklenirken yapılır — bu barkodun okunmaması çoğunlukla bir <b>okuma hatasından</b> kaynaklanır. Gerçekten yeni bir ürünse aşağıya bilgilerini girip kaydedebilirsiniz.</p>
        <div class="row2">
          <div class="field"><label>Referans No</label><input id="scan-new-ref" type="text" /></div>
          <div class="field"><label>Renk</label><input id="scan-new-color" type="text" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" /></div>
        </div>
        <div class="field"><label>Beden</label><input id="scan-new-size" type="text" placeholder="Örn. 1, Size 1, 19-20" /></div>
        <div class="modal-actions" style="margin-top:0">
          <button class="btn ghost" onclick="cancelScanUnknown()">Geri</button>
          <button class="btn primary" onclick="confirmScanUnknown()">Kaydet ve Devam Et</button>
        </div>
      ` : `
        <div class="extra-info-box" style="margin-bottom:14px">
          <div style="font-weight:700;font-size:15px">${esc(detailRefLabel(s.item.refNo, s.item.colorName, s.item.sizeLabel))}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(s.barcode)} · Mevcut stok: ${s.item.stock||0}</div>
        </div>
        <div class="field">
          <label>Miktar</label>
          <input id="scan-qty" type="number" min="1" value="1" style="font-size:20px;padding:14px;text-align:center" onkeydown="handleScanQtyKey(event)" />
        </div>
        <div class="field-msg">Enter'a basınca kaydedilir ve bir sonraki taramaya geçilir</div>
      `}
    </div>
  </div>`;
}

boot();
</script>
</body>
</html>
